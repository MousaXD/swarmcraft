[package]
name = "swarmcraft-desktop"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/MousaXD/swarmcraft"
build = "build.rs"

[[bin]]
name = "swarmcraft-desktop"
path = "src/main.rs"

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
tauri-build = { version = "2", features = [] }

[dependencies]
swarm-catalog = { path = "../../../crates/swarm-catalog" }
swarm-provider = { path = "../../../crates/swarm-provider" }
swarm-protocol = { path = "../../../crates/swarm-protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2.3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["fs", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
