name: Agent 2 CLI history fixture patch

on:
  push:
    branches: [fix/agent-2-protocol]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-2-protocol
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Align strict membership-history fixtures
        shell: python
        run: |
          from pathlib import Path

          auto = Path("crates/swarm-cli/tests/automatic_invite_join.rs")
          text = auto.read_text()
          old = '        mode: EpochMode::Solo,\n        fencing_token: 1,\n        reason: "automatic invite acceptance seed".into(),'
          new = '        mode: EpochMode::Quorum,\n        fencing_token: 1,\n        reason: "automatic invite quorum-of-one seed".into(),'
          if old not in text:
              raise SystemExit("automatic invite epoch seed anchor missing")
          auto.write_text(text.replace(old, new, 1))

          live = Path("crates/swarm-cli/tests/live_join_replication.rs")
          text = live.read_text()
          old = '''        epoch: 1,
                  sequence: 1,
                  previous_membership_hash: None,'''
          new = '''        epoch: 0,
                  sequence: 0,
                  previous_membership_hash: None,'''
          if old not in text:
              raise SystemExit("live join initial membership anchor missing")
          text = text.replace(old, new, 1)
          anchor = '    a.storage.save_epoch_record(&epoch).unwrap();\n\n    b.storage.create_world(&metadata).unwrap();'
          insert = '''    a.storage.save_epoch_record(&epoch).unwrap();

              let mut promoted_membership = membership.clone();
              promoted_membership.epoch = 1;
              promoted_membership.sequence = 1;
              promoted_membership.previous_membership_hash = Some(membership.record_hash().unwrap());
              promoted_membership.signature.clear();
              a.identity.sign_membership(&mut promoted_membership).unwrap();
              a.storage.save_membership_record(&promoted_membership).unwrap();

              b.storage.create_world(&metadata).unwrap();'''
          if anchor not in text:
              raise SystemExit("live join promotion anchor missing")
          live.write_text(text.replace(anchor, insert, 1))

          for filename in ["three_daemon_recovery.rs", "recovery_successor_dies.rs"]:
              path = Path("crates/swarm-cli/tests") / filename
              text = path.read_text()
              old = '''        epoch: 1,
                  sequence: 1,
                  previous_membership_hash: None,'''
              new = '''        epoch: 0,
                  sequence: 0,
                  previous_membership_hash: None,'''
              if old not in text:
                  raise SystemExit(f"{filename}: initial membership anchor missing")
              text = text.replace(old, new, 1)
              anchor = '''    peer.storage.save_membership_record(seed.membership).unwrap();
                  peer.storage.save_epoch_record(seed.epoch).unwrap();'''
              insert = '''    peer.storage.save_membership_record(seed.membership).unwrap();
                  peer.storage.save_epoch_record(seed.epoch).unwrap();
                  let mut promoted_membership = seed.membership.clone();
                  promoted_membership.epoch = seed.epoch.epoch_number;
                  promoted_membership.sequence = seed.membership.sequence.checked_add(1).unwrap();
                  promoted_membership.previous_membership_hash = Some(seed.membership.record_hash().unwrap());
                  promoted_membership.signature.clear();
                  seed.authority.sign_membership(&mut promoted_membership).unwrap();
                  peer.storage.save_membership_record(&promoted_membership).unwrap();'''
              if anchor not in text:
                  raise SystemExit(f"{filename}: replica promotion anchor missing")
              path.write_text(text.replace(anchor, insert, 1))
      - name: Format fixture changes
        run: cargo fmt --all
      - name: Commit fixture alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-cli/tests/automatic_invite_join.rs \
                  crates/swarm-cli/tests/live_join_replication.rs \
                  crates/swarm-cli/tests/three_daemon_recovery.rs \
                  crates/swarm-cli/tests/recovery_successor_dies.rs
          if git diff --cached --quiet; then
            echo "CLI history fixtures already aligned."
            exit 0
          fi
          git commit -m "test(agent2): align CLI fixtures with strict membership history"
          git push origin HEAD:fix/agent-2-protocol
