name: Refresh 0.5.0 lockfiles

on:
  push:
    branches:
      - release/0.5.0
    paths:
      - .github/workflows/release-0.5.0-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.5.0
      - name: Refresh owned package versions only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "0.5.0"
          expected = {
              Path("Cargo.lock"): {
                  "swarm-catalog",
                  "swarm-cli",
                  "swarm-consensus",
                  "swarm-core",
                  "swarm-ipc",
                  "swarm-network",
                  "swarm-protocol",
                  "swarm-storage",
              },
              Path("apps/desktop/src-tauri/Cargo.lock"): {
                  "swarm-catalog",
                  "swarm-core",
                  "swarm-provider",
                  "swarm-protocol",
                  "swarm-storage",
                  "swarmcraft-desktop",
              },
          }

          for path, names in expected.items():
              text = path.read_text(encoding="utf-8")
              blocks = text.split("[[package]]")
              seen = set()
              for index in range(1, len(blocks)):
                  name_match = re.search(r'\nname = "([^"]+)"', blocks[index])
                  version_match = re.search(r'\nversion = "([^"]+)"', blocks[index])
                  if not name_match or not version_match:
                      continue
                  name = name_match.group(1)
                  if name not in names:
                      continue
                  seen.add(name)
                  blocks[index] = (
                      blocks[index][: version_match.start(1)]
                      + version
                      + blocks[index][version_match.end(1) :]
                  )
              missing = names - seen
              if missing:
                  raise SystemExit(f"{path}: missing owned packages: {', '.join(sorted(missing))}")
              path.write_text("[[package]]".join(blocks), encoding="utf-8")
          PY
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/desktop/src-tauri/Cargo.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
            exit 0
          fi
          git commit -m "release: refresh 0.5.0 lockfiles"
          git push origin HEAD:release/0.5.0
