name: Agent 5 Milestone 1

on:
  push:
    branches:
      - fix/agent-5-supply-chain
    paths:
      - .github/workflows/agent5-milestone1.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Apply Agent 5 milestone
        run: |
          rm -f agent5-protocol.log
          python scripts/agent5_milestone1.py
          python scripts/agent5_milestone1_fix.py
      - name: Format Rust
        run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Validate canonical provider contract
        id: protocol
        continue-on-error: true
        run: cargo test -p swarm-protocol --locked > agent5-protocol.log 2>&1
      - name: Preserve protocol diagnostic on failure
        if: steps.protocol.outcome == 'failure'
        run: |
          git config user.name "SwarmCraft Agent 5"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          git add -f agent5-protocol.log
          git commit -m "ci(agent5): capture protocol failure"
          git push origin HEAD:fix/agent-5-supply-chain
          exit 1
      - name: Validate Desktop provider boundary
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Validate launcher provider mapping
        run: node --test apps/desktop/tests/launcher-controller.test.mjs
      - name: Commit milestone and self-clean helpers
        run: |
          rm -f agent5-protocol.log scripts/agent5_milestone1.py scripts/agent5_milestone1_fix.py .github/workflows/agent5-milestone1.yml
          git add -A
          git config user.name "SwarmCraft Agent 5"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          git commit -m "fix(provider): fence staging and retrieval provenance"
          git push origin HEAD:fix/agent-5-supply-chain
