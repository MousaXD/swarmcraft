name: Runtime readiness proof reconciliation

on:
  push:
    branches:
      - integration/runtime-player-journey

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/runtime-player-journey
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Separate runtime and mod proof boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "swarmcraft-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('crates/swarm-cli/src/runtime_main.rs')
          text = runtime.read_text()
          text = text.replace(
              'runtime_installer::{RuntimeInstallOptions, RuntimeInstaller, RuntimeProgress},',
              'runtime_installer::{\n        RuntimeComponentKind, RuntimeComponentState, RuntimeInstallOptions, RuntimeInstaller, RuntimeProgress,\n        RuntimeStatus,\n    },',
          )
          old_start = '        RuntimeCommand::Verify { world } => {\n'
          start = text.index(old_start)
          end = text.index('        }\n    }\n    Ok(())', start) + len('        }\n')
          new = '''        RuntimeCommand::Verify { world } => {
            let world = parse_world(&world)?;
            let status = installer.verify(world)?;
            let descriptor = storage.load_world_descriptor(world)?;
            let world_config = storage.load_world_config(world)?;

            // Server-mod verification is an independent proof boundary. Record
            // the exact current result even when the platform runtime itself is
            // healthy but a required user mod is missing or incompatible.
            let mods = server_mods::evaluate_world_mods(&paths, world, &world_config.compatibility)?;
            let mod_state = if mods.ready {
                ServerModsReadinessV1::Ready
            } else if mods
                .issues
                .iter()
                .any(|issue| matches!(issue.kind, server_mods::ModIssueKind::MissingRequired))
            {
                ServerModsReadinessV1::Missing
            } else {
                ServerModsReadinessV1::Incompatible
            };
            host_readiness::record_server_mod_readiness(
                &paths,
                world,
                descriptor.compatibility_fingerprint,
                mod_state,
            )?;

            // Runtime proof excludes third-party server-mod readiness. This is
            // what lets Host Readiness distinguish "runtime verified, mod
            // missing" from a genuinely unverified runtime.
            if runtime_platform_ready(&status) {
                let config = migration::load_runtime_config(&paths, world)?;
                if status.manual_configuration {
                    let live =
                        host_readiness::local_runtime_readiness(&paths, world, descriptor.compatibility_fingerprint)?;
                    if live != HostRuntimeReadinessV1::Ready {
                        anyhow::bail!(
                            "manual Advanced runtime is configured but not authoritatively verified; launch it through the shared SwarmCraft runtime once so the authenticated Fabric compatibility handshake can prove this exact configuration"
                        );
                    }
                } else {
                    host_readiness::record_runtime_verified(
                        &paths,
                        world,
                        &config,
                        descriptor.compatibility_fingerprint,
                    )?;
                }
            }
            print_json(&status)?;
        }
'''
          text = text[:start] + new + text[end:]
          helper_anchor = '\nfn parse_world(value: &str) -> Result<WorldId> {'
          if 'fn runtime_platform_ready(' not in text:
              helper = '''
fn runtime_platform_ready(status: &RuntimeStatus) -> bool {
    status.components.iter().all(|component| {
        component.kind == RuntimeComponentKind::ServerMods || component.state == RuntimeComponentState::Ready
    })
}
'''
              text = text.replace(helper_anchor, '\n' + helper + helper_anchor, 1)
          if 'server_mod_failure_does_not_erase_runtime_verification_boundary' not in text:
              text += '''

#[cfg(test)]
mod tests {
    use super::*;
    use swarm_cli::runtime_installer::{RuntimeComponentStatus, RuntimeStatus};

    #[test]
    fn server_mod_failure_does_not_erase_runtime_verification_boundary() {
        let status = RuntimeStatus {
            world_id: "scworld:test".into(),
            minecraft_version: "1.21.1".into(),
            fabric_loader_version: "0.16.0".into(),
            required_java_major: 21,
            ready: false,
            eula_accepted: true,
            launch_configured: true,
            manual_configuration: false,
            components: vec![
                RuntimeComponentStatus {
                    kind: RuntimeComponentKind::Java,
                    state: RuntimeComponentState::Ready,
                    version: Some("21".into()),
                    path: None,
                    managed: false,
                    detail: None,
                },
                RuntimeComponentStatus {
                    kind: RuntimeComponentKind::Eula,
                    state: RuntimeComponentState::Ready,
                    version: None,
                    path: None,
                    managed: true,
                    detail: None,
                },
                RuntimeComponentStatus {
                    kind: RuntimeComponentKind::ServerMods,
                    state: RuntimeComponentState::Incompatible,
                    version: None,
                    path: None,
                    managed: false,
                    detail: Some("required mod missing".into()),
                },
            ],
        };
        assert!(runtime_platform_ready(&status));
        assert!(!status.ready);
    }
}
'''
          runtime.write_text(text)

          readiness = Path('crates/swarm-cli/src/host_readiness.rs')
          text = readiness.read_text()
          if 'use crate::server_mods;' not in text:
              text = text.replace(
                  'use crate::migration::{load_runtime_config, RuntimeLaunchConfig};\n',
                  'use crate::migration::{load_runtime_config, RuntimeLaunchConfig};\nuse crate::server_mods;\n',
                  1,
              )
          start_marker = 'pub fn local_server_mod_readiness(\n'
          start = text.index(start_marker)
          end = text.index('\npub fn surviving_recovery_quorum(', start)
          replacement = '''pub fn local_server_mod_readiness(
    paths: &DataPaths,
    storage: &Storage,
    world: WorldId,
    compatibility_fingerprint: Hash32,
) -> Result<ServerModsReadinessV1> {
    let config = match storage.load_world_config(world) {
        Ok(config) => config,
        Err(_) => return Ok(ServerModsReadinessV1::Unverified),
    };
    if verify_world_config_signature(&config).is_err() {
        return Ok(ServerModsReadinessV1::Incompatible);
    }
    if config.compatibility_fingerprint()? != compatibility_fingerprint {
        return Ok(ServerModsReadinessV1::Incompatible);
    }
    let has_user_server_mods =
        config.compatibility.required_server_mods.iter().any(|artifact| artifact.artifact_id != LEGACY_COMPAT_ARTIFACT);
    if !has_user_server_mods {
        return Ok(ServerModsReadinessV1::Ready);
    }

    // Re-check the current exact inventory before trusting a persisted proof.
    // A deleted/replaced JAR therefore invalidates a prior green immediately.
    let current = server_mods::evaluate_world_mods(paths, world, &config.compatibility)?;
    if !current.ready {
        if current
            .issues
            .iter()
            .any(|issue| matches!(issue.kind, server_mods::ModIssueKind::MissingRequired))
        {
            return Ok(ServerModsReadinessV1::Missing);
        }
        return Ok(ServerModsReadinessV1::Incompatible);
    }

    let record: ServerModsVerificationRecord = match read_json(&server_mod_verification_path(paths, world)) {
        Ok(record) => record,
        Err(_) => return Ok(ServerModsReadinessV1::Unverified),
    };
    if record.schema_version != MOD_VERIFICATION_SCHEMA
        || record.world_id != world
        || record.compatibility_fingerprint != compatibility_fingerprint
    {
        return Ok(ServerModsReadinessV1::Incompatible);
    }
    if record.state == ServerModsReadinessV1::Ready {
        Ok(ServerModsReadinessV1::Ready)
    } else {
        // The inventory is currently good but the last proof was not green, so
        // require a fresh verification instead of reusing a stale negative.
        Ok(ServerModsReadinessV1::Unverified)
    }
}
'''
          text = text[:start] + replacement + text[end:]
          readiness.write_text(text)
          PY
          cargo fmt --all
          cargo test -p swarm-cli --bin swarmcraft-runtime --locked
          cargo test -p swarm-cli host_readiness --lib --locked
          git diff --check
          git rm .github/workflows/runtime-readiness-proof-fix.yml
          git add crates/swarm-cli/src/runtime_main.rs crates/swarm-cli/src/host_readiness.rs
          git commit -m "fix(integration): separate runtime and server-mod readiness proofs"
          git push origin HEAD:integration/runtime-player-journey
