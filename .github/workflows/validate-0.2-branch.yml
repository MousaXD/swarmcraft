name: Validate 0.2 branch

on:
  push:
    branches: [feat/swarmcraft-0.2.0]

permissions:
  contents: write

concurrency:
  group: validate-swarmcraft-0.2
  cancel-in-progress: true

# Temporary branch harness. Remove before merge.
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee .github/clippy-failure.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/clippy-failure.log
            git commit -m 'ci: capture temporary clippy failure log'
            git push origin HEAD:feat/swarmcraft-0.2.0
            exit "$status"
          fi
          rm -f .github/clippy-failure.log
      - name: Test
        run: cargo test --workspace --all-features --locked
