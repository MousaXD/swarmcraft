name: Validate 0.2 branch

on:
  push:
    branches: [feat/swarmcraft-0.2.0]

permissions:
  contents: write

concurrency:
  group: validate-swarmcraft-0.2
  cancel-in-progress: true

# Temporary branch harness. Remove before merge.
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply staged source patch and format
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          for script in .github/scripts/refactor_recovery_context.py .github/scripts/insert_recovery_test_hook.py; do
            if [[ -f "$script" ]]; then
              python "$script"
            fi
          done
          cargo fmt --all
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'test: add recovery certificate crash injection point'
            git push origin HEAD:feat/swarmcraft-0.2.0
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Format
        if: steps.prepare.outputs.changed == 'false'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: steps.prepare.outputs.changed == 'false'
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee .github/clippy-failure.txt
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/clippy-failure.txt
            git commit -m 'ci: capture temporary clippy failure diagnostics'
            git push origin HEAD:feat/swarmcraft-0.2.0
            exit "$status"
          fi
          rm -f .github/clippy-failure.txt
      - name: Test
        if: steps.prepare.outputs.changed == 'false'
        run: cargo test --workspace --all-features --locked
