name: Bootstrap Cargo lockfile

on:
  push:
    branches: [feat/swarmcraft-0.2.0]
    paths:
      - '.github/workflows/bootstrap-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/swarmcraft-0.2.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and commit Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Cargo.lock already committed'
            exit 0
          fi
          git commit -m 'build: commit Cargo.lock'
          git push origin HEAD:feat/swarmcraft-0.2.0
