name: Required Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Optional production release tag to bind to application metadata.
        required: false
        type: string
        default: ''
      run_network_soak:
        description: Include the multi-GiB network soak in this exact-SHA gate.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional production release tag to validate.
        required: false
        type: string
        default: ''
      run_network_soak:
        description: Include the multi-GiB network soak.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    name: Core CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  specialist:
    name: Specialist validation
    uses: ./.github/workflows/specialist-validation.yml
    permissions:
      contents: read

  governance-regressions:
    name: CI governance regressions
    uses: ./.github/workflows/governance-regressions.yml
    permissions:
      contents: read

  version:
    name: Release identity
    uses: ./.github/workflows/version-guard.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    permissions:
      contents: read

  player-journey:
    name: Live player journey
    uses: ./.github/workflows/player-journey-live.yml
    permissions:
      contents: read

  network-soak:
    name: Network soak
    if: ${{ inputs.run_network_soak == true }}
    uses: ./.github/workflows/network-soak.yml
    permissions:
      contents: read

  gate:
    name: Required validation gate
    if: ${{ always() }}
    needs: [core, specialist, governance-regressions, version, player-journey, network-soak]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CORE_RESULT: ${{ needs.core.result }}
      SPECIALIST_RESULT: ${{ needs.specialist.result }}
      GOVERNANCE_RESULT: ${{ needs.governance-regressions.result }}
      VERSION_RESULT: ${{ needs.version.result }}
      PLAYER_RESULT: ${{ needs.player-journey.result }}
      SOAK_RESULT: ${{ needs.network-soak.result }}
      REQUIRE_SOAK: ${{ inputs.run_network_soak }}
    steps:
      - name: Require selected exact-SHA validation components
        shell: bash
        run: |
          set -euo pipefail
          test "$CORE_RESULT" = success
          test "$SPECIALIST_RESULT" = success
          test "$GOVERNANCE_RESULT" = success
          test "$VERSION_RESULT" = success
          test "$PLAYER_RESULT" = success
          if [[ "$REQUIRE_SOAK" == true ]]; then
            test "$SOAK_RESULT" = success
          else
            [[ "$SOAK_RESULT" == skipped || "$SOAK_RESULT" == success ]]
          fi
          echo "Required validation accepted exact SHA $GITHUB_SHA"
