name: Agent 3 compose integrated authority contracts

on:
  push:
    branches: [fix/agent-3-storage]

permissions:
  contents: write

concurrency:
  group: agent3-compose-authority-contracts
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Merge and compose exact authoritative Agent 1 and 2 head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MousaXD"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          git fetch origin integration/audit-remediation-v1
          test "$(git rev-parse origin/integration/audit-remediation-v1)" = "f02bb0d54cb44df67e730f01be4c903e25d670ff"
          set +e
          git merge --no-ff --no-commit f02bb0d54cb44df67e730f01be4c903e25d670ff
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'crates/swarm-storage/src/control.rs\ncrates/swarm-storage/src/lib.rs\ncrates/swarm-storage/src/root.rs\ncrates/swarm-storage/src/state.rs\ncrates/swarm-storage/src/streaming.rs\ncrates/swarm-storage/src/world.rs\ncrates/swarm-storage/tests/publication_ownership_race.rs'
            test "$conflicts" = "$expected" || { echo "Unexpected conflicts:"; printf '%s\n' "$conflicts"; exit 1; }
            git checkout --ours -- \
              crates/swarm-storage/src/control.rs \
              crates/swarm-storage/src/lib.rs \
              crates/swarm-storage/src/root.rs \
              crates/swarm-storage/src/streaming.rs \
              crates/swarm-storage/tests/publication_ownership_race.rs
            git checkout --theirs -- crates/swarm-storage/src/state.rs crates/swarm-storage/src/world.rs
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Root: retain Agent 3 integrity exports and expose Agent 2 membership persistence.
          path = Path('crates/swarm-storage/src/root.rs')
          text = path.read_text()
          if 'pub mod membership;' not in text:
              text = text.replace('pub mod control;\n', 'pub mod control;\npub mod membership;\n', 1)
          if 'pub use membership::{DurableMembershipPromiseV1, MembershipPromiseResult};' not in text:
              text = text.replace('pub use integrity::{CanonicalSnapshotHeadV1, CanonicalSnapshotRefV1, SnapshotCommitFence};\n',
                                  'pub use integrity::{CanonicalSnapshotHeadV1, CanonicalSnapshotRefV1, SnapshotCommitFence};\npub use membership::{DurableMembershipPromiseV1, MembershipPromiseResult};\n', 1)
          path.write_text(text)

          # Base error surface: Agent 2 membership history still uses a named checked-counter error.
          path = Path('crates/swarm-storage/src/lib.rs')
          text = path.read_text()
          needle = '    #[error("snapshot numbering or sequence counter is exhausted")]\n    SnapshotNumberExhausted,\n'
          addition = needle + '    #[error("canonical counter exhausted: {0}")]\n    CounterExhausted(&\'static str),\n'
          if 'CounterExhausted(' not in text:
              if needle not in text:
                  raise SystemExit('CounterExhausted insertion anchor missing')
              text = text.replace(needle, addition, 1)
          path.write_text(text)

          # Control records: keep Agent 3 OS serialization/durability, add Agent 2 semantic validation.
          path = Path('crates/swarm-storage/src/control.rs')
          text = path.read_text()
          replacements = [
              ('        let _guard = self.lock_world_transaction(record.world_id)?;\n        let path = self.control_path(record.world_id, "epoch.postcard");',
               '        let _guard = self.lock_world_transaction(record.world_id)?;\n        record.validate_semantics()?;\n        let path = self.control_path(record.world_id, "epoch.postcard");'),
              ('        if record.world_id != world {\n            return Err(StorageError::WorldMetadataMismatch);\n        }\n        Ok(record)',
               '        if record.world_id != world {\n            return Err(StorageError::WorldMetadataMismatch);\n        }\n        record.validate_semantics()?;\n        Ok(record)'),
              ('        let _guard = self.lock_world_transaction(reservation.world_id)?;\n        self.reserve_recovery_locked(reservation)',
               '        let _guard = self.lock_world_transaction(reservation.world_id)?;\n        reservation.validate_semantics()?;\n        self.reserve_recovery_locked(reservation)'),
              ('        let _guard = self.lock_world_transaction(reservation.world_id)?;\n        if self.reserve_recovery_locked(reservation)? {',
               '        let _guard = self.lock_world_transaction(reservation.world_id)?;\n        reservation.validate_semantics()?;\n        if self.reserve_recovery_locked(reservation)? {'),
              ('        if reservation.world_id != world {\n            return Err(StorageError::WorldMetadataMismatch);\n        }\n        Ok(reservation)',
               '        if reservation.world_id != world {\n            return Err(StorageError::WorldMetadataMismatch);\n        }\n        reservation.validate_semantics()?;\n        Ok(reservation)'),
              ('        let _guard = self.lock_world_transaction(transfer.world_id)?;\n        let bytes = postcard::to_allocvec(transfer)?;',
               '        let _guard = self.lock_world_transaction(transfer.world_id)?;\n        transfer.validate_semantics()?;\n        let bytes = postcard::to_allocvec(transfer)?;'),
              ('        if record.world_id != world {\n            return Err(StorageError::WorldMetadataMismatch);\n        }\n        Ok(record)\n    }\n\n    pub fn save_sleep_record',
               '        if record.world_id != world {\n            return Err(StorageError::WorldMetadataMismatch);\n        }\n        record.validate_semantics()?;\n        Ok(record)\n    }\n\n    pub fn save_sleep_record'),
              ('        let _guard = self.lock_world_transaction(record.world_id)?;\n        let bytes = postcard::to_allocvec(record)?;\n        durable_atomic_write(&self.control_path(record.world_id, "sleep.postcard"), &bytes)',
               '        let _guard = self.lock_world_transaction(record.world_id)?;\n        record.validate_semantics()?;\n        let bytes = postcard::to_allocvec(record)?;\n        durable_atomic_write(&self.control_path(record.world_id, "sleep.postcard"), &bytes)'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          # The final Sleep load has the same generic record tail as other loads; insert if absent.
          sleep_marker = 'let record: SleepRecordV1 = postcard::from_bytes(&bytes)?;'
          idx = text.find(sleep_marker)
          if idx >= 0:
              tail = text[idx:text.find('    pub fn clear_sleep_record', idx)]
              if 'record.validate_semantics()?;' not in tail:
                  tail = tail.replace('        Ok(record)\n', '        record.validate_semantics()?;\n        Ok(record)\n', 1)
                  end = text.find('    pub fn clear_sleep_record', idx)
                  text = text[:idx] + tail + text[end:]
          path.write_text(text)

          # State: start from Agent 2 authority/history semantics and put every mutation under Agent 3 durable world transaction.
          path = Path('crates/swarm-storage/src/state.rs')
          text = path.read_text()
          text = re.sub(r'use crate::\{Storage, StorageError\};\nuse serde::\{Deserialize, Serialize\};\nuse std::\{\n    fs::\{self, OpenOptions\},\n    io::Write,\n    path::\{Path, PathBuf\},\n\};',
                        'use crate::{\n    transaction::{durable_atomic_write, durable_remove},\n    Storage, StorageError,\n};\nuse serde::{Deserialize, Serialize};\nuse std::{fs, path::PathBuf};', text, count=1)
          text = text.replace('atomic_write(', 'durable_atomic_write(')
          lock_pairs = [
              ('    ) -> Result<RecoveryPromiseResult, StorageError> {\n        ballot.validate_semantics()?;',
               '    ) -> Result<RecoveryPromiseResult, StorageError> {\n        let _guard = self.lock_world_transaction(ballot.world_id)?;\n        ballot.validate_semantics()?;'),
              ('    ) -> Result<bool, StorageError> {\n        let Ok(promise) = self.load_recovery_promise(world) else {',
               '    ) -> Result<bool, StorageError> {\n        let _guard = self.lock_world_transaction(world)?;\n        let Ok(promise) = self.load_recovery_promise(world) else {'),
              ('    pub fn save_world_config(&self, config: &WorldConfigV1) -> Result<(), StorageError> {\n        let mut config = config.clone();',
               '    pub fn save_world_config(&self, config: &WorldConfigV1) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(config.world_id)?;\n        let mut config = config.clone();'),
              ('    pub fn save_solo_branch(&self, branch: &SoloBranchV1) -> Result<(), StorageError> {\n        branch.validate_semantics()?;',
               '    pub fn save_solo_branch(&self, branch: &SoloBranchV1) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(branch.world_id)?;\n        branch.validate_semantics()?;'),
              ('    pub fn preserve_solo_conflict(&self, branch: &SoloBranchV1) -> Result<PathBuf, StorageError> {\n        branch.validate_semantics()?;',
               '    pub fn preserve_solo_conflict(&self, branch: &SoloBranchV1) -> Result<PathBuf, StorageError> {\n        let _guard = self.lock_world_transaction(branch.world_id)?;\n        branch.validate_semantics()?;'),
              ('    pub fn set_background_seeding(&self, world: WorldId, enabled: bool) -> Result<(), StorageError> {\n        self.load_world(world)?;',
               '    pub fn set_background_seeding(&self, world: WorldId, enabled: bool) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(world)?;\n        self.load_world(world)?;'),
          ]
          for old, new in lock_pairs:
              if old not in text:
                  raise SystemExit(f'state lock anchor missing: {old[:60]}')
              text = text.replace(old, new, 1)
          text = text.replace('        remove_if_present(&self.control_path_v2(world, "recovery-promise.postcard"))?;',
                              '        durable_remove(&self.control_path_v2(world, "recovery-promise.postcard"))?;')
          start = text.find('fn remove_if_present(path: &Path)')
          end = text.find('#[cfg(test)]', start)
          if start < 0 or end < 0:
              raise SystemExit('state helper cleanup anchors missing')
          text = text[:start] + 'fn io_error(path: impl Into<PathBuf>, source: std::io::Error) -> StorageError {\n    StorageError::Io { path: path.into(), source }\n}\n\n' + text[end:]
          path.write_text(text)

          # World protocol state: preserve Agent 2 authority/history rules, serialize/durably persist them with Agent 3 primitives.
          path = Path('crates/swarm-storage/src/world.rs')
          text = path.read_text()
          text = re.sub(r'use crate::\{Storage, StorageError\};\nuse std::\{\n    fs::\{self, OpenOptions\},\n    io::Write,\n    path::\{Path, PathBuf\},\n\};',
                        'use crate::{\n    transaction::{durable_atomic_write, durable_remove},\n    Storage, StorageError,\n};\nuse std::{fs, path::PathBuf};', text, count=1)
          text = text.replace('atomic_write(', 'durable_atomic_write(')
          method_locks = [
              ('    pub fn save_world_descriptor(&self, descriptor: &WorldDescriptorV1) -> Result<(), StorageError> {\n        let original_member_count',
               '    pub fn save_world_descriptor(&self, descriptor: &WorldDescriptorV1) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(descriptor.world_id)?;\n        let original_member_count'),
              ('    pub fn save_membership_record(&self, record: &MembershipRecordV1) -> Result<(), StorageError> {\n        record.validate_semantics()?;',
               '    pub fn save_membership_record(&self, record: &MembershipRecordV1) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(record.world_id)?;\n        record.validate_semantics()?;'),
              ('    pub fn save_pending_join(&self, request: &JoinRequestV1) -> Result<(), StorageError> {\n        request.validate_semantics()?;',
               '    pub fn save_pending_join(&self, request: &JoinRequestV1) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(request.world_id)?;\n        request.validate_semantics()?;'),
              ('    pub fn clear_pending_join(&self, world: WorldId) -> Result<(), StorageError> {\n        remove_protocol_file',
               '    pub fn clear_pending_join(&self, world: WorldId) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(world)?;\n        remove_protocol_file'),
              ('    pub fn save_pending_leave(&self, request: &LeaveRequestV1) -> Result<(), StorageError> {\n        request.validate_semantics()?;',
               '    pub fn save_pending_leave(&self, request: &LeaveRequestV1) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(request.world_id)?;\n        request.validate_semantics()?;'),
              ('    pub fn clear_pending_leave(&self, world: WorldId) -> Result<(), StorageError> {\n        remove_protocol_file',
               '    pub fn clear_pending_leave(&self, world: WorldId) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(world)?;\n        remove_protocol_file'),
              ('    pub fn remove_local_membership(&self, world: WorldId) -> Result<(), StorageError> {\n        for name in [',
               '    pub fn remove_local_membership(&self, world: WorldId) -> Result<(), StorageError> {\n        let _guard = self.lock_world_transaction(world)?;\n        for name in ['),
          ]
          for old, new in method_locks:
              if old not in text:
                  raise SystemExit(f'world lock anchor missing: {old[:60]}')
              text = text.replace(old, new, 1)
          helper_start = text.find('fn remove_protocol_file(')
          io_start = text.find('fn io_error(', helper_start)
          tests_start = text.find('#[cfg(test)]', io_start)
          if helper_start < 0 or io_start < 0 or tests_start < 0:
              raise SystemExit('world helper cleanup anchors missing')
          helper = '''fn remove_protocol_file(storage: &Storage, world: WorldId, name: &str) -> Result<(), StorageError> {\n    durable_remove(&storage.world_protocol_path(world, name))\n}\n\nfn io_error(path: impl Into<PathBuf>, source: std::io::Error) -> StorageError {\n    StorageError::Io { path: path.into(), source }\n}\n\n'''
          text = text[:helper_start] + helper + text[tests_start:]
          path.write_text(text)

          # Agent 2 membership promise/certificate persistence is also control state: put it under the same OS-backed world lock.
          path = Path('crates/swarm-storage/src/membership.rs')
          text = path.read_text()
          text = re.sub(r'use crate::\{Storage, StorageError\};\nuse serde::\{Deserialize, Serialize\};\nuse std::\{\n    fs::\{self, OpenOptions\},\n    io::Write,\n    path::\{Path, PathBuf\},\n\};',
                        'use crate::{\n    transaction::{durable_atomic_write, durable_remove},\n    Storage, StorageError,\n};\nuse serde::{Deserialize, Serialize};\nuse std::{fs, path::PathBuf};', text, count=1)
          text = text.replace('atomic_write(', 'durable_atomic_write(')
          anchors = [
              ('    ) -> Result<MembershipPromiseResult, StorageError> {\n        if !proposal.validate_shape()?',
               '    ) -> Result<MembershipPromiseResult, StorageError> {\n        let _guard = self.lock_world_transaction(proposal.proposed.world_id)?;\n        if !proposal.validate_shape()?'),
              ('    ) -> Result<bool, StorageError> {\n        let Ok(promise) = self.load_membership_promise(world) else {',
               '    ) -> Result<bool, StorageError> {\n        let _guard = self.lock_world_transaction(world)?;\n        let Ok(promise) = self.load_membership_promise(world) else {'),
              ('    pub fn save_membership_certificate(&self, certificate: &MembershipCertificateV1) -> Result<(), StorageError> {\n        let world =',
               '    pub fn save_membership_certificate(&self, certificate: &MembershipCertificateV1) -> Result<(), StorageError> {\n        let world = certificate.proposal.proposed.world_id;\n        let _guard = self.lock_world_transaction(world)?;\n        let world ='),
          ]
          for old, new in anchors:
              if old not in text:
                  raise SystemExit(f'membership lock anchor missing: {old[:60]}')
              text = text.replace(old, new, 1)
          # Remove duplicate world assignment introduced by the simple anchor transform.
          text = text.replace('        let world = certificate.proposal.proposed.world_id;\n        let _guard = self.lock_world_transaction(world)?;\n        let world = certificate.proposal.proposed.world_id;',
                              '        let world = certificate.proposal.proposed.world_id;\n        let _guard = self.lock_world_transaction(world)?;', 1)
          text = text.replace('        remove_if_present(&self.world_dir(world).join("metadata/membership-promise.postcard"))?;',
                              '        durable_remove(&self.world_dir(world).join("metadata/membership-promise.postcard"))?;')
          helper_start = text.find('fn remove_if_present(path: &Path)')
          tests_start = text.find('#[cfg(test)]', helper_start)
          if helper_start < 0 or tests_start < 0:
              raise SystemExit('membership helper cleanup anchors missing')
          text = text[:helper_start] + 'fn io_error(path: impl Into<PathBuf>, source: std::io::Error) -> StorageError {\n    StorageError::Io { path: path.into(), source }\n}\n\n' + text[tests_start:]
          path.write_text(text)
          PY
          git add crates/swarm-storage
          test -z "$(git diff --name-only --diff-filter=U)"
          cargo fmt --all
          git add -A
          git diff --cached --check
      - name: Compile and prove composed storage authority semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p swarm-storage --all-targets --locked
          cargo test -p swarm-storage --locked
          cargo test -p swarm-storage --test membership_history --locked
          cargo test -p swarm-protocol --locked
          cargo test -p swarm-core --locked
      - name: Commit and push composed tree
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "merge: compose Agent 1 and 2 authority contracts into Agent 3 storage"
          git merge-base --is-ancestor f02bb0d54cb44df67e730f01be4c903e25d670ff HEAD
          git push origin HEAD:fix/agent-3-storage
          echo "COMPOSED_SHA=$(git rev-parse HEAD)"
