name: One-shot daemon convergence patch

on:
  push:
    branches: [feat/runtime-release]
    paths: ['.github/workflows/patch-daemon-recovery.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-release
          fetch-depth: 0
      - name: Apply exact convergence fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('crates/swarm-cli/src/daemon.rs')
          source = path.read_text()

          def replace_once(pattern, replacement, label):
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')

          replace_once(
              r"(struct RequestState<'a> \{\n\s*pending_manifests: &'a mut HashMap<WorldId, SnapshotManifestV1>,\n)(\s*leases: &'a mut LeaseRuntime,)",
              r"\1    outbound: &'a mut HashMap<String, OutboundContext>,\n\2",
              'RequestState outbound field',
          )
          replace_once(
              r"(let mut state = RequestState \{\n\s*pending_manifests: &mut pending_manifests,\n)(\s*leases: &mut leases,)",
              r"\1                        outbound: &mut outbound,\n\2",
              'RequestState outbound value',
          )
          replace_once(
              r"\s*handle_request\(\n\s*&context,\n\s*&mut node,\n\s*transport_peer,\n\s*application_peer,\n\s*request,\n\s*channel,\n\s*&mut state,\n\s*\)\?;",
              '''
                      if let Err(error) = handle_request(
                          &context,
                          &mut node,
                          transport_peer,
                          application_peer,
                          request,
                          channel,
                          &mut state,
                      ) {
                          warn!(peer = %application_peer, %error, "inbound authenticated request rejected");
                      }''',
              'nonfatal inbound request handling',
          )
          replace_once(
              r"node\.respond\(channel, WireResponse::JoinAccepted \{ membership_sequence: canonical\.sequence \}\)\?;\n\s*node\.send_request\(&transport_peer, WireRequest::Membership\(canonical\)\)\?;",
              '''node.respond(channel, WireResponse::JoinAccepted { membership_sequence: canonical.sequence })?;
                      push_known_worlds(storage, node, &transport_peer, application_peer, state.outbound)?;''',
              'live join replication',
          )
          path.write_text(source)
      - name: Format and commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff -- crates/swarm-cli/src/daemon.rs
          git config user.name 'MousaXD'
          git config user.email '101021011+MousaXD@users.noreply.github.com'
          git add crates/swarm-cli/src/daemon.rs
          git commit -m 'fix(daemon): keep stale requests nonfatal and replicate joins immediately'
          git push origin HEAD:feat/runtime-release
