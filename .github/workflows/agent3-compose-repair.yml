name: Agent 3 composition repair

on:
  push:
    branches: [fix/agent-3-storage]

permissions:
  contents: write

concurrency:
  group: agent3-composition-repair
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Reuse audited composition transform
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/agent3-compose-integration.yml').read_text()
          marker = '      - name: Merge and compose exact authoritative Agent 1 and 2 head\n'
          start = text.index(marker)
          run_marker = '        run: |\n'
          run_start = text.index(run_marker, start) + len(run_marker)
          end = text.index('      - name: Compile and prove composed storage authority semantics\n', run_start)
          lines = text[run_start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/compose-agent3.sh').write_text(script)
          PY
          bash /tmp/compose-agent3.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/swarm-storage/src/world.rs')
          text = path.read_text()
          old = '    durable_remove(&storage.world_protocol_path(world, name))\n'
          new = '    durable_remove(&storage.world_protocol_path(world, name)).map(|_| ())\n'
          if old not in text:
              raise SystemExit('durable remove adapter anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git add -A
          git diff --cached --check
      - name: Compile and prove composed storage authority semantics
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p swarm-storage --all-targets --locked
          cargo test -p swarm-storage --locked
          cargo test -p swarm-storage --test membership_history --locked
          cargo test -p swarm-protocol --locked
          cargo test -p swarm-core --locked
      - name: Commit and push composed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MousaXD"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          git commit -m "merge: compose Agent 1 and 2 authority contracts into Agent 3 storage"
          git merge-base --is-ancestor f02bb0d54cb44df67e730f01be4c903e25d670ff HEAD
          git push origin HEAD:fix/agent-3-storage
          echo "COMPOSED_SHA=$(git rev-parse HEAD)"
