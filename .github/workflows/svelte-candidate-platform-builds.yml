# Agent 04 / issue #87: candidate-only packaging evidence.
# Does not modify production tauri.conf.json or mandatory installer workflows.
name: Svelte candidate desktop installers (Windows/macOS)

on:
  push:
    branches:
      - agent-04/svelte-typescript-desktop
    paths:
      - 'apps/desktop/frontend/**'
      - 'apps/desktop/src/**'
      - '.github/workflows/svelte-candidate-platform-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svelte-candidate-platforms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-platform-candidate:
    name: Candidate package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-nsis
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Verify isolated candidate override does not weaken shipping Tauri security
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('apps/desktop/src-tauri/tauri.conf.json').read_text())
          override = json.loads(Path('apps/desktop/frontend/tauri.candidate.conf.json').read_text())
          assert override == {'build': {'frontendDist': '../frontend/dist'}}
          assert base['build']['frontendDist'] == '../src'
          assert base['app']['withGlobalTauri'] is True
          assert len(base['bundle']['externalBin']) == 4
          assert 'ipc:' in base['app']['security']['csp']
          PY
      - name: Build committed-lock Svelte frontend, check types and feature parity
        shell: bash
        working-directory: apps/desktop/frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm run test:source
          npm run test
          npm run build
          test -s dist/index.html
          test -s dist/bootstrap.js
      - name: Verify Rust lockfiles
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Compile exact-commit Rust sidecars
        shell: bash
        run: cargo build --release -p swarm-cli --locked
      - name: Stage Windows sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          foreach ($name in @('swarmcraft','swarmcraft-host','swarmcraft-runtime','swarmcraft-import')) {
            Copy-Item "target/release/$name.exe" "apps/desktop/src-tauri/binaries/$name-$target.exe"
            & "apps/desktop/src-tauri/binaries/$name-$target.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "Failed to verify $name" }
          }
      - name: Stage macOS sidecars
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          for name in swarmcraft swarmcraft-host swarmcraft-runtime swarmcraft-import; do
            cp "target/release/$name" "apps/desktop/src-tauri/binaries/$name-$target"
            "apps/desktop/src-tauri/binaries/$name-$target" --version
          done
      - name: Install pinned Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build real Svelte Windows NSIS installer with bounded retries
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo tauri build --bundles nsis --ci --config frontend/tauri.candidate.conf.json; then
              test -n "$(find src-tauri/target/release/bundle -iname '*setup*.exe' -type f -print -quit)"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'FAILED: candidate NSIS package after three attempts' >&2
              exit 1
            fi
            sleep $((attempt * 6))
          done
      - name: Build actual Svelte macOS application
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          cargo tauri build --bundles app --ci --config frontend/tauri.candidate.conf.json
          test -d src-tauri/target/release/bundle/macos/SwarmCraft.app
      - name: Build and verify native macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          app=src-tauri/target/release/bundle/macos/SwarmCraft.app
          out_dir=src-tauri/target/release/bundle/dmg
          mkdir -p "$out_dir"
          dmg="$out_dir/SwarmCraft-Svelte-candidate-${{ matrix.label }}.dmg"
          hdiutil create -volname 'SwarmCraft Svelte Candidate' -srcfolder "$app" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          test -s "$dmg"
      - name: Upload exact SHA candidate installers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: svelte-candidate-${{ matrix.label }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 7
