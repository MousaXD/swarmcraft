name: Agent 3 CurseForge provider materialization

on:
  push:
    branches: [agent/curseforge-provider]

permissions:
  contents: write

jobs:
  materialize:
    name: Finalize checked-in Agent 3 source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curseforge-provider
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Materialize final provider source and Desktop lockfile
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent3_finalize.py
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps >/dev/null

      - name: Restore canonical repository validation and remove bootstrap machinery
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/backup/local-work-20260824 -- .github/workflows/ci.yml scripts/check_release_version.py
          rm -f .github/agent3_finalize.py .github/agent3-validation-trigger.txt .github/workflows/agent3-curseforge-provider.yml

      - name: Commit final checked-in state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "swarmcraft-agent3-ci"
          git config user.email "agent3-ci@users.noreply.github.com"
          git add -A -- \
            .github/agent3_finalize.py \
            .github/agent3-validation-trigger.txt \
            .github/workflows/agent3-curseforge-provider.yml \
            .github/workflows/ci.yml \
            scripts/check_release_version.py \
            apps/desktop/src-tauri
          if git diff --cached --quiet; then
            echo "No materialization changes were required."
            exit 0
          fi
          git commit -m "Finalize CurseForge provider source"
          git push origin HEAD:agent/curseforge-provider
