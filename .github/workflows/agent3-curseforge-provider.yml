name: Agent 3 CurseForge provider materialization

on:
  push:
    branches: [agent/curseforge-provider]

permissions:
  contents: write

jobs:
  materialize:
    name: Materialize checked-in Agent 3 source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curseforge-provider
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Build bundled runtimes
        run: cargo build --release -p swarm-cli --locked

      - name: Stage required Desktop sidecars
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/swarmcraft "apps/desktop/src-tauri/binaries/swarmcraft-$target"
          cp target/release/swarmcraft-host "apps/desktop/src-tauri/binaries/swarmcraft-host-$target"
          cp target/release/swarmcraft-runtime "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target"
          cp target/release/swarmcraft-import "apps/desktop/src-tauri/binaries/swarmcraft-import-$target"

      - name: Apply final provider hardening
        run: |
          python3 .github/agent3_finalize.py
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify materialized Desktop source
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features --locked

      - name: Commit materialized source and lockfile
        run: |
          set -euo pipefail
          git config user.name "swarmcraft-agent3-ci"
          git config user.email "agent3-ci@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/curseforge.rs apps/desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Finalize CurseForge provider source"
            git push origin HEAD:agent/curseforge-provider
          fi
