name: Agent 3 CurseForge provider validation

on:
  pull_request:
    branches: [backup/local-work-20260824]

permissions:
  contents: write
  statuses: write

jobs:
  curseforge-provider:
    name: CurseForge provider exact-head gate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curseforge-provider
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Apply Agent 3 final hardening
        run: |
          python3 .github/agent3_finalize.py
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Regenerate and compile Desktop lockfile
        run: |
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked

      - name: Publish normalized provider source and Desktop lockfile
        run: |
          set -euo pipefail
          if ! git diff --quiet -- apps/desktop/src-tauri/src apps/desktop/src-tauri/Cargo.lock; then
            git config user.name "swarmcraft-agent3-ci"
            git config user.email "agent3-ci@users.noreply.github.com"
            git add apps/desktop/src-tauri/src apps/desktop/src-tauri/Cargo.lock
            git commit -m "Finalize CurseForge provider handoff"
            git push origin HEAD:agent/curseforge-provider
          fi

      - name: Verify root lockfile is current
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Workspace format
        run: cargo fmt --all -- --check

      - name: Workspace check
        run: cargo check --workspace --all-features --locked

      - name: Workspace clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Desktop format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Desktop check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked

      - name: Desktop clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: CurseForge deterministic matrix
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml curseforge::tests:: --locked

      - name: Validate six Tauri command registrations and structured states
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('apps/desktop/src-tauri/src/curseforge.rs').read_text()
          main = Path('apps/desktop/src-tauri/src/main.rs').read_text()
          commands = [
              'curseforge_provider_status',
              'curseforge_search',
              'curseforge_project',
              'curseforge_versions',
              'curseforge_resolve',
              'curseforge_download',
          ]
          for command in commands:
              assert f'fn {command}' in source, f'missing command implementation: {command}'
              assert command in main, f'missing Tauri registration: {command}'

          required_states = [
              '"configuration_required"',
              '"rate_limited"',
              '"incompatible"',
              '"manual_artifact_required"',
              '"download_failed"',
              '"downloaded"',
              '"status": "ok"',
          ]
          for state in required_states:
              assert state in source, f'missing structured provider state: {state}'

          assert 'SWARMCRAFT_CURSEFORGE_API_KEY' in source
          assert 'http://edge.forgecdn.net/files/example.jar' in source  # negative test only
          assert 'https://api.curseforge.com' in source
          assert 'local_sha256' in source
          assert 'provider_hashes_verified' in source
          assert 'provider_download_unavailable' in source
          assert 'supply_exact_file_id' in source
          print('Validated Tauri commands:', ', '.join(commands))
          PY

      - name: Publish exact-head validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          export sha
          python3 - <<'PY' > /tmp/agent3-status.json
          import json
          import os

          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          payload = {
              'state': state,
              'context': 'agent3/curseforge-provider',
              'description': 'Agent 3 exact-head gate passed' if state == 'success' else 'Agent 3 exact-head gate failed',
              'target_url': os.environ['RUN_URL'],
          }
          print(json.dumps(payload))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${sha}" \
            --data-binary @/tmp/agent3-status.json
