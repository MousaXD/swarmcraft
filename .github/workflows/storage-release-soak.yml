name: Storage release soak

on:
  push:
    branches: [feat/runtime-release]
    paths: ['.github/workflows/storage-release-soak.yml']

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-release
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stream 1, 5, and 10 GiB snapshots
        run: cargo test -p swarm-storage release_large_world_streaming_profiles -- --ignored --nocapture
