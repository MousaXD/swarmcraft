name: One-shot 0.3.0 version bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/version-bump-once.yml'

permissions:
  contents: write

jobs:
  bump:
    if: contains(github.event.head_commit.message, 'prepare 0.3.0 version bump')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Bump application metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('Cargo.toml', '[workspace.package]\nversion = "0.2.1"', '[workspace.package]\nversion = "0.3.0"')
          replace_once('apps/desktop/src-tauri/Cargo.toml', '[package]\nname = "swarmcraft-desktop"\nversion = "0.2.1"', '[package]\nname = "swarmcraft-desktop"\nversion = "0.3.0"')
          replace_once('apps/desktop/src-tauri/tauri.conf.json', '"version": "0.2.1"', '"version": "0.3.0"')
          replace_once('minecraft/fabric/gradle.properties', 'mod_version=0.2.1', 'mod_version=0.3.0')

          guard = Path('scripts/check_release_version.py')
          text = guard.read_text(encoding='utf-8')
          if text.count('0.2.1') != 5:
              raise SystemExit(f'version guard: expected 5 plain references to 0.2.1, found {text.count("0.2.1")}')
          text = text.replace('0.2.1', '0.3.0')
          if text.count(r'0\.2\.1') != 1:
              raise SystemExit(f'version guard: expected one escaped 0.2.1 regex, found {text.count(r"0\.2\.1")}')
          text = text.replace(r'0\.2\.1', r'0\.3\.0', 1)
          guard.write_text(text, encoding='utf-8')
          PY

      - name: Update and audit Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo check --workspace --all-features
          python3 - <<'PY'
          from pathlib import Path
          import re

          allowed = {
              'swarm-cli',
              'swarm-consensus',
              'swarm-core',
              'swarm-ipc',
              'swarm-network',
              'swarm-protocol',
              'swarm-storage',
          }

          def package_blocks(text):
              chunks = text.split('[[package]]')
              preamble = chunks[0]
              blocks = {}
              for chunk in chunks[1:]:
                  match = re.search(r'\nname = "([^"]+)"', chunk)
                  if not match:
                      raise SystemExit('Cargo.lock contains an unnamed package block')
                  blocks[match.group(1)] = '[[package]]' + chunk
              return preamble, blocks

          before_text = Path('/tmp/Cargo.lock.before').read_text(encoding='utf-8')
          after_text = Path('Cargo.lock').read_text(encoding='utf-8')
          before_preamble, before = package_blocks(before_text)
          after_preamble, after = package_blocks(after_text)

          if before_preamble != after_preamble:
              raise SystemExit('Cargo.lock preamble changed unexpectedly')
          if set(before) != set(after):
              raise SystemExit('Cargo.lock package set changed unexpectedly')

          changed = {name for name in before if before[name] != after[name]}
          if changed != allowed:
              raise SystemExit(f'Cargo.lock changed unexpected package blocks: {sorted(changed)}')

          for name in sorted(allowed):
              expected = before[name].replace('version = "0.2.1"', 'version = "0.3.0"', 1)
              if expected == before[name]:
                  raise SystemExit(f'{name}: old local version not found')
              if after[name] != expected:
                  raise SystemExit(f'{name}: lock block changed beyond version 0.2.1 -> 0.3.0')

          print('Cargo.lock changed only the seven SwarmCraft package version lines.')
          PY

      - name: Validate 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_release_version.py
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Commit release bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock \
            apps/desktop/src-tauri/Cargo.toml \
            apps/desktop/src-tauri/tauri.conf.json \
            minecraft/fabric/gradle.properties \
            scripts/check_release_version.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No release bump changes to commit'; exit 1; } || true
          git commit -m 'chore(release): bump SwarmCraft to 0.3.0'
          git push origin HEAD:main
