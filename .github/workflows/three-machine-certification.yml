name: Three-machine real E2E certification (manual / non-release)

on:
  workflow_dispatch:
    inputs:
      run_remote_preflight:
        description: Explicitly connect operator-owned machines from a dedicated self-hosted runner (requires pinned SSH secrets)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: three-machine-certification
  cancel-in-progress: true

jobs:
  harness-negative-controls:
    name: Three-machine harness negative assertions
    runs-on: [self-hosted, linux, swarmcraft-certification]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Syntax and fail-closed unit tests (NOT real E2E certification)
        run: |
          python3 -m compileall -q scripts/e2e/three_machine
          python3 -m unittest discover -s scripts/e2e/three_machine -p 'test_*.py' -v

  remote-preflight:
    name: Three remote installations (preflight ONLY, not certification)
    if: github.event_name == 'workflow_dispatch' && inputs.run_remote_preflight == true
    needs: harness-negative-controls
    runs-on: [self-hosted, linux, swarmcraft-certification]
    timeout-minutes: 15
    env:
      E2E_CONFIG_JSON: ${{ secrets.SWARMCRAFT_E2E_CONFIG_JSON }}
      E2E_SSH_PRIVATE_KEY: ${{ secrets.SWARMCRAFT_E2E_SSH_PRIVATE_KEY }}
      E2E_SSH_KNOWN_HOSTS: ${{ secrets.SWARMCRAFT_E2E_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require explicitly provisioned hosts and pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$E2E_CONFIG_JSON" ] || [ -z "$E2E_SSH_PRIVATE_KEY" ] || [ -z "$E2E_SSH_KNOWN_HOSTS" ]; then
            echo 'BLOCKED: dedicated machines, SSH key, and pinned known_hosts are required.'
            exit 2
          fi
          # A dedicated runner may already have unrelated SSH identities.
          # Keep the lab credentials and config strictly within this step.
          E2E_SSH_DIR="$(mktemp -d "$RUNNER_TEMP/swarmcraft-e2e-ssh.XXXXXX")"
          trap 'rm -rf -- "$E2E_SSH_DIR"' EXIT
          REAL_SSH="$(command -v ssh)"
          export E2E_SSH_DIR REAL_SSH
          printf '%s\n' "$E2E_SSH_PRIVATE_KEY" > "$E2E_SSH_DIR/id_ed25519"
          chmod 600 "$E2E_SSH_DIR/id_ed25519"
          printf '%s\n' "$E2E_SSH_KNOWN_HOSTS" > "$E2E_SSH_DIR/known_hosts"
          chmod 600 "$E2E_SSH_DIR/known_hosts"
          printf '%s' "$E2E_CONFIG_JSON" > "$E2E_SSH_DIR/config.json"
          unset E2E_SSH_PRIVATE_KEY E2E_SSH_KNOWN_HOSTS E2E_CONFIG_JSON
          cat > "$E2E_SSH_DIR/ssh" <<'SH'
          #!/bin/sh
          exec "$REAL_SSH" -F /dev/null -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o IdentityAgent=none -o UpdateHostKeys=no \
            -o UserKnownHostsFile="$E2E_SSH_DIR/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -i "$E2E_SSH_DIR/id_ed25519" "$@"
          SH
          chmod 700 "$E2E_SSH_DIR/ssh"
          export PATH="$E2E_SSH_DIR:$PATH"
          python3 - "$E2E_SSH_DIR/config.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys
          config = json.load(open(sys.argv[1], encoding='utf-8'))
          if config.get('commit') != sys.argv[2]:
              raise SystemExit('BLOCKED: configured package provenance commit differs from workflow SHA')
          PY
          python3 scripts/e2e/three_machine/run.py preflight \
            --config "$E2E_SSH_DIR/config.json" \
            --output "$RUNNER_TEMP/three-machine-e2e"
      - name: Upload only sanitized preflight record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: three-machine-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/three-machine-e2e/preflight.json
          if-no-files-found: ignore
          retention-days: 14
