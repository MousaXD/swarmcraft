name: One-shot rustfmt

on:
  push:
    branches:
      - feat/runtime-release
    paths:
      - crates/swarm-cli/src/daemon.rs
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-release
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply rustfmt"
          git push origin HEAD:feat/runtime-release
