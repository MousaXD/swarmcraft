name: Agent 4 Ledger Reconcile

on:
  push:
    branches:
      - fix/agent-4-network
    paths:
      - .github/workflows/agent4-ledger-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      CLEANUP_HEAD: fd9a3deccd22ef27880a92f50d9c8a0dacc6f74f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply ledger reconciliation
        run: |
          set -euo pipefail
          python .github/agent4_reconcile_ledger.py
          rm -f .github/agent4_reconcile_ledger.py
          rm -f .github/workflows/agent4-ledger-reconcile.yml

      - name: Prove net follow-up is ledger only
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$CLEANUP_HEAD" | sort)" = 'implementation/agent-4-network.md'
          git diff --check

      - name: Commit reconciled ledger
        run: |
          set -euo pipefail
          git config user.name 'swarmcraft-agent4'
          git config user.email 'agent4@users.noreply.github.com'
          git add -A
          git commit -m 'docs(agent4): reconcile final closure ledger'
          echo "FINAL_AGENT4_LEDGER_HEAD=$(git rev-parse HEAD)"
          git push origin HEAD:fix/agent-4-network
