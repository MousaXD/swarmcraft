# Agent 5 HTTP validation retry 2
name: Agent 5 Milestone 2

on:
  push:
    branches:
      - fix/agent-5-supply-chain
    paths:
      - .github/workflows/agent5-milestone2.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Apply Agent 5 HTTP hardening
        run: |
          rm -f agent5-milestone2.log
          python scripts/agent5_milestone2.py
          python scripts/agent5_milestone2_fix.py
      - name: Format touched Rust
        run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Stage validation-only Tauri sidecars
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          for name in swarmcraft swarmcraft-host swarmcraft-runtime swarmcraft-import; do
            cp /bin/true "apps/desktop/src-tauri/binaries/${name}-${target}"
          done
      - name: Validate provider HTTP hardening
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '== refresh root lock and compile shared provider source =='
            cargo check -p swarm-cli
            echo '== root provider runtime unit tests =='
            cargo test -p swarm-cli --lib --locked provider_runtime
            echo '== Modrinth deterministic provider suite =='
            cargo test -p swarm-cli --test modrinth_provider --locked
            echo '== shared provider lint =='
            cargo clippy -p swarm-cli --lib --locked -- -D warnings
            echo '== refresh Desktop lock and compile provider bridge =='
            cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
            echo '== Desktop provider tests =='
            cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
            echo '== Desktop provider lint =='
            cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
            echo '== static secret/subprocess and redirect checks =='
            ! grep -n 'Command::new("curl")' crates/swarm-cli/src/provider_runtime.rs
            ! grep -n 'x-api-key: {api_key}' crates/swarm-cli/src/provider_runtime.rs
            ! grep -n '"-L"' crates/swarm-cli/src/package_provider/modrinth.rs
          } > agent5-milestone2.log 2>&1
      - name: Preserve diagnostic on failure
        if: steps.validate.outcome == 'failure'
        run: |
          git config user.name "SwarmCraft Agent 5"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          git add -f agent5-milestone2.log
          git commit -m "ci(agent5): capture provider HTTP failure"
          git push origin HEAD:fix/agent-5-supply-chain
          exit 1
      - name: Commit milestone and self-clean helpers
        if: steps.validate.outcome == 'success'
        run: |
          rm -f agent5-milestone2.log scripts/agent5_milestone2.py scripts/agent5_milestone2_fix.py .github/workflows/agent5-milestone2.yml
          git add -A
          git config user.name "SwarmCraft Agent 5"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          git commit -m "fix(provider): isolate credentials and bound metadata"
          git push origin HEAD:fix/agent-5-supply-chain
