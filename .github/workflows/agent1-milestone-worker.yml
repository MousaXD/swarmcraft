name: Agent 1 milestone worker

on:
  push:
    branches:
      - fix/agent-1-consensus
    paths:
      - implementation/agent1-milestone1.py
      - .github/workflows/agent1-milestone-worker.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/agent-1-consensus
          fetch-depth: 0

      - name: Repair staged worker typo
        run: |
          sed -i '77s/"""/""/' implementation/agent1-milestone1.py
          python3 -m py_compile implementation/agent1-milestone1.py

      - name: Apply milestone transformations
        run: python3 implementation/agent1-milestone1.py

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Check affected workspace
        run: cargo check --workspace --all-targets

      - name: Test consensus and storage safety
        run: cargo test -p swarm-consensus -p swarm-storage

      - name: Test CLI library and compile process tests
        run: |
          cargo test -p swarm-cli --lib
          cargo test -p swarm-cli --tests --no-run

      - name: Commit validated milestone
        env:
          BRANCH: fix/agent-1-consensus
        run: |
          rm implementation/agent1-milestone1.py
          rm .github/workflows/agent1-milestone-worker.yml
          git add -A
          git config user.name "swarmcraft-agent-1"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(consensus): fence unsafe recovery and solo generations"
          git push origin "HEAD:${BRANCH}"
