name: Agent 5 macOS automatic invite diagnostics

on:
  push:
    branches: [agent/automatic-invites]
    paths:
      - '.github/workflows/agent5-bootstrap-retry-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-invites
      - uses: dtolnay/rust-toolchain@stable
      - name: Runner network diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          ifconfig
          route -n get 1.1.1.1 || true
      - name: Instrument test without committing source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/swarm-cli/tests/automatic_invite_join.rs')
          text = path.read_text()
          text = text.replace('.env("RUST_LOG", "warn")', '.env("RUST_LOG", "info")')
          text = text.replace('struct ManagedChild(Child);', 'struct ManagedChild(Child, std::path::PathBuf);', 1)
          old_drop = '        let _ = self.0.kill();\n        let _ = self.0.wait();'
          new_drop = '\n'.join([
              '        let status = self.0.try_wait();',
              '        eprintln!("A5_DIAG child_status_before_kill={status:?} log={}", self.1.display());',
              '        let _ = self.0.kill();',
              '        let _ = self.0.wait();',
              '        match fs::read_to_string(&self.1) {',
              '            Ok(log) => eprintln!("A5_DAEMON_LOG {}\\n{}", self.1.display(), log),',
              '            Err(error) => eprintln!("A5_DIAG failed_to_read_log={} error={error}", self.1.display()),',
              '        }',
          ])
          if old_drop not in text:
              raise SystemExit('ManagedChild drop anchor not found')
          text = text.replace(old_drop, new_drop, 1)
          old_stderr = '        .stderr(Stdio::inherit())\n        .spawn()\n        .unwrap();\n    ManagedChild(child)'
          new_stderr = '\n'.join([
              '        .stderr(Stdio::from(fs::File::create(peer.paths.root.join("daemon.stderr.log")).unwrap()))',
              '        .spawn()',
              '        .unwrap();',
              '    ManagedChild(child, peer.paths.root.join("daemon.stderr.log"))',
          ])
          if old_stderr not in text:
              raise SystemExit('spawn_daemon stderr anchor not found')
          text = text.replace(old_stderr, new_stderr, 1)
          anchor = '    let local_ip = local_non_loopback_ipv4();\n'
          replacement = anchor + '    eprintln!("A5_DIAG local_ip={local_ip} a_port={} b_port={}", a.port, b.port);\n'
          if anchor not in text:
              raise SystemExit('local-ip anchor not found')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
      - name: Prove automatic invite join with captured transport logs
        env:
          RUST_BACKTRACE: '1'
        run: cargo test -p swarm-cli --test automatic_invite_join --locked -- --nocapture
