name: Agent 5 macOS automatic invite diagnostics

on:
  push:
    branches: [agent/automatic-invites]
    paths:
      - '.github/workflows/agent5-bootstrap-retry-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-invites
      - uses: dtolnay/rust-toolchain@stable
      - name: Runner network diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          ifconfig
          route -n get 1.1.1.1 || true
      - name: Instrument test without committing source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/swarm-cli/tests/automatic_invite_join.rs')
          text = path.read_text()
          text = text.replace('.env("RUST_LOG", "warn")', '.env("RUST_LOG", "info")')
          anchor = '    let local_ip = local_non_loopback_ipv4();\n'
          replacement = anchor + '    eprintln!("A5_DIAG local_ip={local_ip} a_port={} b_port={}", a.port, b.port);\n'
          if anchor not in text:
              raise SystemExit('local-ip anchor not found')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
      - name: Prove automatic invite join with transport logs
        env:
          RUST_BACKTRACE: '1'
        run: cargo test -p swarm-cli --test automatic_invite_join --locked -- --nocapture
