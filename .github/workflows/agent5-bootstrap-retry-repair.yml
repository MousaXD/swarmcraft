name: Agent 5 macOS automatic invite diagnostics

on:
  push:
    branches: [agent/automatic-invites]
    paths:
      - '.github/workflows/agent5-bootstrap-retry-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-invites
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify macOS self-addressed UDP reaches a wildcard listener
        shell: bash
        run: |
          python - <<'PY'
          import socket
          receiver = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          receiver.bind(('0.0.0.0', 0))
          receiver.settimeout(2)
          probe = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          probe.connect(('1.1.1.1', 53))
          local_ip = probe.getsockname()[0]
          sender = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sender.sendto(b'a5-udp-probe', (local_ip, receiver.getsockname()[1]))
          payload, source = receiver.recvfrom(256)
          assert payload == b'a5-udp-probe', payload
          print(f'A5_UDP_SELF_OK local_ip={local_ip} source={source} port={receiver.getsockname()[1]}')
          PY
      - name: Bind authority QUIC directly to the advertised interface for diagnosis
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/swarm-cli/tests/automatic_invite_join.rs')
          text = path.read_text()
          old = '    let _daemon_a = spawn_daemon(&a, Ipv4Addr::UNSPECIFIED);'
          new = '    let _daemon_a = spawn_daemon(&a, local_ip);'
          if old not in text:
              raise SystemExit('authority wildcard-listen anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Prove automatic invite join with interface-bound authority
        env:
          RUST_BACKTRACE: '1'
        run: cargo test -p swarm-cli --test automatic_invite_join --locked -- --nocapture
