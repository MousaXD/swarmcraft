name: Release version guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application and protocol versions
        run: python3 scripts/check_release_version.py

  runtime-installer-hash-fix:
    name: Apply in-process runtime hashing fix
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/runtime-installer' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-installer
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Replace shell hashing with ring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('crates/swarm-cli/Cargo.toml')
          cargo_text = cargo.read_text()
          needle = 'postcard.workspace = true\n'
          if 'ring = "0.17"' not in cargo_text:
              if needle not in cargo_text:
                  raise SystemExit('Cargo.toml insertion point not found')
              cargo_text = cargo_text.replace(needle, needle + 'ring = "0.17"\n', 1)
          cargo.write_text(cargo_text)

          path = Path('crates/swarm-cli/src/runtime_installer.rs')
          text = path.read_text()

          import_needle = 'use serde_json::Value;\n'
          ring_import = 'use ring::digest::{Context as DigestContext, SHA1_FOR_LEGACY_USE_ONLY, SHA256};\n'
          if ring_import not in text:
              if import_needle not in text:
                  raise SystemExit('ring import insertion point not found')
              text = text.replace(import_needle, import_needle + ring_import, 1)

          old_io = '    io::Write,\n'
          new_io = '    io::{Read, Write},\n'
          if old_io in text:
              text = text.replace(old_io, new_io, 1)
          elif new_io not in text:
              raise SystemExit('io import insertion point not found')

          start = text.find('fn hash_file(path: &Path, kind: HashKind) -> Result<String> {')
          end = text.find('fn eq_hash(left: &str, right: &str) -> bool {', start)
          if start < 0 or end < 0:
              raise SystemExit('hash_file block not found')
          replacement = '''fn hash_file(path: &Path, kind: HashKind) -> Result<String> {
    let algorithm = match kind {
        HashKind::Sha1 => &SHA1_FOR_LEGACY_USE_ONLY,
        HashKind::Sha256 => &SHA256,
    };
    let mut context = DigestContext::new(algorithm);
    let mut file = fs::File::open(path).with_context(|| format!("cannot open {} for hashing", path.display()))?;
    let mut buffer = [0_u8; 64 * 1024];
    loop {
        let read = file.read(&mut buffer)?;
        if read == 0 {
            break;
        }
        context.update(&buffer[..read]);
    }
    Ok(hex::encode(context.finish().as_ref()))
}

'''
          text = text[:start] + replacement + text[end:]

          old_verify = '''    if let Some(expected) = &artifact.sha1 {
        let actual = hash_file(&temporary, HashKind::Sha1)?;
        if !eq_hash(expected, &actual) {
            let _ = fs::remove_file(&temporary);
            bail!("downloaded artifact SHA-1 mismatch");
        }
    }
    let sha256 = hash_file(&temporary, HashKind::Sha256)?;
    if let Some(expected) = &artifact.sha256 {
        if !eq_hash(expected, &sha256) {
            let _ = fs::remove_file(&temporary);
            bail!("downloaded artifact SHA-256 mismatch");
        }
    }
    sync_file(&temporary)?;'''
          new_verify = '''    let verification = (|| -> Result<String> {
        if let Some(expected) = &artifact.sha1 {
            let actual = hash_file(&temporary, HashKind::Sha1)?;
            if !eq_hash(expected, &actual) {
                bail!("downloaded artifact SHA-1 mismatch");
            }
        }
        let sha256 = hash_file(&temporary, HashKind::Sha256)?;
        if let Some(expected) = &artifact.sha256 {
            if !eq_hash(expected, &sha256) {
                bail!("downloaded artifact SHA-256 mismatch");
            }
        }
        sync_file(&temporary)?;
        Ok(sha256)
    })();
    let sha256 = match verification {
        Ok(sha256) => sha256,
        Err(error) => {
            let _ = fs::remove_file(&temporary);
            return Err(error);
        }
    };'''
          if old_verify not in text:
              raise SystemExit('artifact verification block not found')
          text = text.replace(old_verify, new_verify, 1)
          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Update lockfile without fetching new packages
        run: cargo check -p swarm-cli
      - name: Clippy
        run: cargo clippy -p swarm-cli --all-targets --all-features --locked -- -D warnings
      - name: Unit and integration tests
        run: cargo test -p swarm-cli --all-features --locked
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/swarm-cli/Cargo.toml crates/swarm-cli/src/runtime_installer.rs
          git diff --cached --quiet && exit 0
          git commit -m "runtime: hash artifacts in process"
          git push origin HEAD:agent/runtime-installer
