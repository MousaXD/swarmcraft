name: Specialist Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrated-specialist-checks:
    name: Migrated catalog/provider checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Catalog deterministic tests
        run: cargo test -p swarm-catalog --all-features --locked
      - name: Catalog live-source validation
        run: cargo test -p swarm-catalog --test live_sources --locked -- --ignored --nocapture
      - name: Modrinth deterministic provider tests
        run: |
          cargo test -p swarm-cli --test modrinth_provider --locked
          cargo test -p swarm-cli --test modrinth_provider_matrix --locked
      - name: Install Linux Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Verify Desktop lockfile is current
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Build and stage required Tauri sidecars
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p swarm-cli --locked
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/swarmcraft "apps/desktop/src-tauri/binaries/swarmcraft-$target"
          cp target/release/swarmcraft-host "apps/desktop/src-tauri/binaries/swarmcraft-host-$target"
          cp target/release/swarmcraft-runtime "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target"
          cp target/release/swarmcraft-import "apps/desktop/src-tauri/binaries/swarmcraft-import-$target"
      - name: CurseForge deterministic provider tests
        run: >-
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          curseforge::tests:: --all-features --locked
      - name: Validate CurseForge command registration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('apps/desktop/src-tauri/src/main.rs').read_text()
          for command in (
              'curseforge_provider_status',
              'curseforge_search',
              'curseforge_project',
              'curseforge_versions',
              'curseforge_resolve',
              'curseforge_download',
          ):
              assert command in main, f'missing Tauri registration: {command}'
          PY
