name: Finalize storage soak evidence

on:
  push:
    branches: [feat/runtime-release]
    paths: ['.github/workflows/finalize-storage-soak.yml']

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-release
          fetch-depth: 0
      - name: Wait for and require successful storage soak
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/storage-release-soak.yml/runs?branch=feat/runtime-release&event=push&per_page=1" --jq '.workflow_runs[0].id')"
          test -n "$run_id"
          for _ in $(seq 1 150); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            if [ "$status" = completed ]; then
              conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
              tested_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')"
              if [ "$conclusion" != success ]; then
                echo "Storage soak failed: run=$run_id conclusion=$conclusion" >&2
                exit 1
              fi
              printf '%s\n' "$run_id" > /tmp/swarmcraft-soak-run
              printf '%s\n' "$tested_sha" > /tmp/swarmcraft-soak-sha
              exit 0
            fi
            sleep 20
          done
          echo 'Timed out waiting for storage release soak' >&2
          exit 1
      - name: Record evidence and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat /tmp/swarmcraft-soak-run)"
          tested_sha="$(cat /tmp/swarmcraft-soak-sha)"
          mkdir -p docs
          cat > docs/RELEASE_GATES.md <<EOF
          # SwarmCraft v0.1.0-preview release gates

          This file records executable release evidence for the preview branch.

          ## Storage large-world soak

          - Result: PASS
          - GitHub Actions run: ${run_id}
          - Tested commit: ${tested_sha}
          - Command: \`cargo test -p swarm-storage release_large_world_streaming_profiles -- --ignored --nocapture\`
          - Profiles: 1 GiB, 5 GiB, and 10 GiB synthetic world files
          - Path: streaming snapshot creation, Zstd blob encoding, content hashing, snapshot commit, and streaming verification
          - Buffering: bounded 1 MiB storage buffers; no whole-world or whole-blob materialization is required by the streaming path

          ## Permanent CI gates

          The normal PR workflow must also pass before merge:

          - Ubuntu Rust format, strict Clippy, and tests
          - Windows Rust strict Clippy and tests
          - real loopback live-join plus immediate snapshot replication test
          - real three-daemon hard-kill recovery plus stale-peer resynchronization test
          - real host-process IPC / restore / final-snapshot / sleep test
          - Fabric server mod build
          - RustSec dependency audit
          - Linux DEB and AppImage builds with bundled runtime sidecars
          - Windows NSIS build with bundled runtime sidecars

          ## Known preview limitation

          If an elected recovery successor dies after durable recovery reservation but before Recovery epoch quorum, the generation may safely stall. The preview favors canonical safety over liveness and does not automatically skip to a second successor within that half-committed recovery round.
          EOF
          git rm .github/workflows/storage-release-soak.yml .github/workflows/finalize-storage-soak.yml
          git config user.name 'MousaXD'
          git config user.email '101021011+MousaXD@users.noreply.github.com'
          git add docs/RELEASE_GATES.md
          git commit -m 'docs: record preview release gate evidence'
          git push origin HEAD:feat/runtime-release
