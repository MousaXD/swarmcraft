      - name: Stage validation-only Tauri sidecars
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          for name in swarmcraft swarmcraft-host swarmcraft-runtime swarmcraft-import; do
            cp /bin/true "apps/desktop/src-tauri/binaries/${name}-${target}"
          done
      - name: Validate permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p swarm-protocol --locked agent5_supply_chain_tests
          cargo test -p swarm-cli --test agent5_supply_chain_acceptance --locked
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked agent5_final_acceptance_tests
          cargo check -p swarm-cli --locked
          cargo clippy -p swarm-cli --all-targets --locked -- -D warnings
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Commit final permanent regression milestone
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent5-final-permanent-regressions.yml
          rm -rf apps/desktop/src-tauri/binaries
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          git status --short
          git add apps/desktop/src-tauri/src/curseforge.rs crates/swarm-cli/tests/agent5_supply_chain_acceptance.rs .github/workflows/agent5-final-permanent-regressions.yml
          git config user.name "SwarmCraft Agent 5"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          git commit -m "test(provider): prove redirect and reacquisition boundaries"
          git push origin HEAD:fix/agent-5-supply-chain
