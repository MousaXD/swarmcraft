name: Agent 5 Final Permanent Regressions

on:
  push:
    branches:
      - fix/agent-5-supply-chain
    paths:
      - .github/workflows/agent5-final-permanent-regressions.yml

permissions:
  contents: write

jobs:
  harden-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Add permanent Agent 5 regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/agent-5-supply-chain)"
          if ! grep -q 'mod agent5_final_acceptance_tests' apps/desktop/src-tauri/src/curseforge.rs; then
            cat >> apps/desktop/src-tauri/src/curseforge.rs <<'RS'

#[cfg(test)]
mod agent5_final_acceptance_tests {
    use super::*;
    use reqwest::redirect::Policy;
    use std::{
        io::{Read, Write},
        net::TcpListener,
        sync::{Arc, Mutex},
        thread,
        time::{Duration, Instant},
    };

    type Capture = Arc<Mutex<Option<String>>>;

    fn spawn_http_once(response: String) -> (String, Capture, thread::JoinHandle<()>) {
        let listener = TcpListener::bind("127.0.0.1:0").unwrap();
        listener.set_nonblocking(true).unwrap();
        let address = listener.local_addr().unwrap();
        let capture = Arc::new(Mutex::new(None));
        let capture_thread = Arc::clone(&capture);
        let handle = thread::spawn(move || {
            let deadline = Instant::now() + Duration::from_secs(2);
            loop {
                match listener.accept() {
                    Ok((mut stream, _)) => {
                        let _ = stream.set_read_timeout(Some(Duration::from_secs(1)));
                        let mut buffer = [0u8; 16 * 1024];
                        let read = stream.read(&mut buffer).unwrap_or(0);
                        *capture_thread.lock().unwrap() = Some(String::from_utf8_lossy(&buffer[..read]).into_owned());
                        let _ = stream.write_all(response.as_bytes());
                        let _ = stream.flush();
                        break;
                    }
                    Err(error) if error.kind() == std::io::ErrorKind::WouldBlock => {
                        if Instant::now() >= deadline {
                            break;
                        }
                        thread::sleep(Duration::from_millis(10));
                    }
                    Err(_) => break,
                }
            }
        });
        (format!("http://{address}"), capture, handle)
    }

    fn same_origin(left: &reqwest::Url, right: &reqwest::Url) -> bool {
        left.scheme() == right.scheme()
            && left.host_str() == right.host_str()
            && left.port_or_known_default() == right.port_or_known_default()
    }

    fn exact_origin_policy(origin: reqwest::Url) -> Policy {
        Policy::custom(move |attempt| {
            if attempt.previous().len() >= 5 {
                attempt.error("too many test redirects")
            } else if same_origin(&origin, attempt.url()) {
                attempt.follow()
            } else {
                attempt.error("cross-origin redirect rejected")
            }
        })
    }

    fn approved_origins_policy(origins: Vec<reqwest::Url>) -> Policy {
        Policy::custom(move |attempt| {
            if attempt.previous().len() >= 5 {
                attempt.error("too many test redirects")
            } else if origins.iter().any(|origin| same_origin(origin, attempt.url())) {
                attempt.follow()
            } else {
                attempt.error("artifact redirect left approved origins")
            }
        })
    }

    fn redirect(location: &str) -> String {
        format!(
            "HTTP/1.1 302 Found\r\nLocation: {location}\r\nContent-Length: 0\r\nConnection: close\r\n\r\n"
        )
    }

    fn ok() -> String {
        "HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok".to_owned()
    }

    #[tokio::test]
    async fn authenticated_two_origin_redirect_never_reaches_attacker() {
        let (attacker, attacker_capture, attacker_thread) = spawn_http_once(ok());
        let (api, api_capture, api_thread) = spawn_http_once(redirect(&format!("{attacker}/steal")));
        let origin = reqwest::Url::parse(&api).unwrap();
        let client = reqwest::Client::builder()
            .redirect(exact_origin_policy(origin))
            .timeout(Duration::from_secs(2))
            .build()
            .unwrap();
        let error = client
            .get(format!("{api}/v1/mods"))
            .header("x-api-key", "agent5-secret")
            .send()
            .await
            .unwrap_err();
        assert!(error.is_redirect());
        api_thread.join().unwrap();
        attacker_thread.join().unwrap();
        let first = api_capture.lock().unwrap().clone().unwrap().to_ascii_lowercase();
        assert!(first.contains("x-api-key: agent5-secret"));
        assert!(attacker_capture.lock().unwrap().is_none(), "credential-bearing redirect reached attacker origin");

        let public_api = reqwest::Url::parse("https://api.curseforge.com/v1/mods/1").unwrap();
        let attacker_url = reqwest::Url::parse("https://attacker.invalid/steal").unwrap();
        assert!(is_curseforge_api_url(&public_api));
        assert!(!is_curseforge_api_url(&attacker_url));
    }

    #[tokio::test]
    async fn artifact_redirect_policy_accepts_approved_origin_and_rejects_unapproved_origin_without_api_key() {
        let (approved, approved_capture, approved_thread) = spawn_http_once(ok());
        let (source, source_capture, source_thread) = spawn_http_once(redirect(&format!("{approved}/artifact.jar")));
        let source_origin = reqwest::Url::parse(&source).unwrap();
        let approved_origin = reqwest::Url::parse(&approved).unwrap();
        let client = reqwest::Client::builder()
            .redirect(approved_origins_policy(vec![source_origin, approved_origin]))
            .timeout(Duration::from_secs(2))
            .build()
            .unwrap();
        let response = client.get(format!("{source}/artifact.jar")).send().await.unwrap();
        assert!(response.status().is_success());
        source_thread.join().unwrap();
        approved_thread.join().unwrap();
        for captured in [source_capture, approved_capture] {
            let request = captured.lock().unwrap().clone().unwrap().to_ascii_lowercase();
            assert!(!request.contains("x-api-key"), "artifact request carried API credential");
        }

        let (unapproved, unapproved_capture, unapproved_thread) = spawn_http_once(ok());
        let (source, _source_capture, source_thread) = spawn_http_once(redirect(&format!("{unapproved}/artifact.jar")));
        let source_origin = reqwest::Url::parse(&source).unwrap();
        let client = reqwest::Client::builder()
            .redirect(approved_origins_policy(vec![source_origin]))
            .timeout(Duration::from_secs(2))
            .build()
            .unwrap();
        let error = client.get(format!("{source}/artifact.jar")).send().await.unwrap_err();
        assert!(error.is_redirect());
        source_thread.join().unwrap();
        unapproved_thread.join().unwrap();
        assert!(unapproved_capture.lock().unwrap().is_none());

        assert!(is_curseforge_artifact_url(
            &reqwest::Url::parse("https://mediafilez.forgecdn.net/files/1/2/example.jar").unwrap()
        ));
        assert!(!is_curseforge_artifact_url(
            &reqwest::Url::parse("https://evilforgecdn.net/files/example.jar").unwrap()
        ));
    }

    #[test]
    fn curseforge_metadata_bounds_precede_json_parse_and_cover_headers_and_cardinality() {
        let oversized_invalid_json = vec![b'{'; MAX_METADATA_BYTES + 1];
        assert_eq!(parse_metadata_bytes(&oversized_invalid_json).unwrap_err().code, "response_too_large");

        let too_many = Value::Array(vec![Value::Null; MAX_METADATA_ARRAY_ITEMS + 1]);
        assert_eq!(validate_metadata_value(&too_many).unwrap_err().code, "response_too_large");

        let mut object = serde_json::Map::new();
        for index in 0..=MAX_METADATA_OBJECT_ENTRIES {
            object.insert(format!("field-{index}"), Value::Null);
        }
        assert_eq!(validate_metadata_value(&Value::Object(object)).unwrap_err().code, "response_too_large");

        let mut headers = reqwest::header::HeaderMap::new();
        for index in 0..=MAX_METADATA_HEADERS {
            let name = reqwest::header::HeaderName::from_bytes(format!("x-agent5-{index}").as_bytes()).unwrap();
            headers.insert(name, reqwest::header::HeaderValue::from_static("x"));
        }
        assert_eq!(validate_metadata_headers(&headers).unwrap_err().code, "response_too_large");
    }

    #[test]
    fn api_key_has_no_child_process_or_artifact_request_path() {
        let desktop = include_str!("curseforge.rs");
        let runtime = include_str!("../../../../crates/swarm-cli/src/provider_runtime.rs");
        for source in [desktop, runtime] {
            assert!(!source.contains("Command::new("), "provider credential path must not spawn child processes");
            assert!(!source.contains("std::process::Command"), "provider credential path must stay in-process");
        }
        let desktop_artifact = desktop
            .split("async fn download_artifact")
            .nth(1)
            .unwrap()
            .split("#[tauri::command]")
            .next()
            .unwrap();
        assert!(!desktop_artifact.contains("x-api-key"));
        let runtime_artifact = runtime
            .split("fn download_curseforge_artifact")
            .nth(1)
            .unwrap()
            .split("fn safe_filename")
            .next()
            .unwrap();
        assert!(!runtime_artifact.contains("x-api-key"));
    }
}
RS
          fi

          cat > crates/swarm-cli/tests/agent5_supply_chain_acceptance.rs <<'RS'
use std::{collections::BTreeMap, path::Path};
use swarm_cli::package_provider::{
    modrinth::{HttpResponse, ModrinthClient, ModrinthTransport, MAX_PROVIDER_METADATA_BYTES},
    ModSearchQuery, PackageEnvironment, ProviderFailure, ProviderFailureKind, ReleaseType,
};
use swarm_protocol::{
    ArtifactSideV1, CanonicalArtifactSourceV1, CanonicalHashAlgorithmV1, CanonicalLoaderV1, CanonicalModpackV1,
    CanonicalPackageIdentityV1, CanonicalPackageV1, CanonicalProviderArtifactV1, CanonicalProviderHashV1,
    CanonicalProviderV1, CanonicalRetrievalV1, Hash32, CANONICAL_MODPACK_SCHEMA_VERSION,
};

#[derive(Clone)]
struct OversizedTransport;

impl ModrinthTransport for OversizedTransport {
    fn get(&self, _url: &str) -> Result<HttpResponse, ProviderFailure> {
        Ok(HttpResponse {
            status: 200,
            headers: BTreeMap::new(),
            body: vec![b'{'; MAX_PROVIDER_METADATA_BYTES + 1],
        })
    }

    fn download(&self, _url: &str, _destination: &Path, _max_bytes: u64) -> Result<(), ProviderFailure> {
        unreachable!("metadata-bound regression never downloads an artifact")
    }
}

fn strong_curseforge_pack(retrieval: CanonicalRetrievalV1) -> CanonicalModpackV1 {
    CanonicalModpackV1 {
        schema_version: CANONICAL_MODPACK_SCHEMA_VERSION,
        minecraft_version: "1.21.1".into(),
        loader: CanonicalLoaderV1 { id: "fabric".into(), version: "0.16.14".into() },
        packages: vec![CanonicalPackageV1 {
            artifact_id: "example".into(),
            version: "1.0.0".into(),
            artifact_hash: Hash32([7; 32]),
            side: ArtifactSideV1::Server,
            source: CanonicalArtifactSourceV1::Provider {
                artifact: CanonicalProviderArtifactV1 {
                    identity: CanonicalPackageIdentityV1 {
                        provider: CanonicalProviderV1::CurseForge,
                        project_id: "123".into(),
                        version_id: "456".into(),
                    },
                    file_name: "example.jar".into(),
                    file_size: Some(3),
                    hashes: vec![CanonicalProviderHashV1 {
                        algorithm: CanonicalHashAlgorithmV1::Sha1,
                        digest_hex: "a9993e364706816aba3e25717850c26c9cd0d89d".into(),
                    }],
                    retrieval,
                    dependencies: vec![],
                },
            },
        }],
        datapacks: vec![],
    }
}

#[test]
fn oversized_modrinth_metadata_is_rejected_before_json_parsing() {
    let client = ModrinthClient::with_transport("https://fixtures.invalid/v2", OversizedTransport).unwrap();
    let error = client
        .search(&ModSearchQuery {
            query: "example".into(),
            minecraft_version: "1.21.1".into(),
            loader: "fabric".into(),
            environment: PackageEnvironment::Server,
            release_type: Some(ReleaseType::Release),
            offset: 0,
            limit: 10,
        })
        .unwrap_err();
    assert_eq!(error.kind, ProviderFailureKind::MalformedResponse);
    assert!(error.message.contains("response_too_large"));
}

#[test]
fn strong_hash_provider_contract_survives_clean_peer_runtime_round_trip() {
    let canonical = strong_curseforge_pack(CanonicalRetrievalV1::ProviderDownload);
    canonical.validate().unwrap();
    let runtime = canonical.to_runtime_compatibility("0.5.0").unwrap();
    let rebuilt = CanonicalModpackV1::from_runtime_compatibility(&runtime).unwrap();
    rebuilt.validate().unwrap();
    assert_eq!(rebuilt, canonical);
    let CanonicalArtifactSourceV1::Provider { artifact } = &rebuilt.packages[0].source else {
        panic!("provider provenance collapsed during clean-peer round trip");
    };
    assert_eq!(artifact.retrieval, CanonicalRetrievalV1::ProviderDownload);
    assert!(artifact.hashes.iter().any(|hash| hash.algorithm == CanonicalHashAlgorithmV1::Sha1));
}

#[test]
fn md5_only_provider_download_is_rejected_but_manual_contract_remains_valid() {
    let mut canonical = strong_curseforge_pack(CanonicalRetrievalV1::ProviderDownload);
    let CanonicalArtifactSourceV1::Provider { artifact } = &mut canonical.packages[0].source else {
        unreachable!();
    };
    artifact.hashes = vec![CanonicalProviderHashV1 {
        algorithm: CanonicalHashAlgorithmV1::Md5,
        digest_hex: "900150983cd24fb0d6963f7d28e17f72".into(),
    }];
    assert!(canonical.validate().is_err());
    let CanonicalArtifactSourceV1::Provider { artifact } = &mut canonical.packages[0].source else {
        unreachable!();
    };
    artifact.retrieval = CanonicalRetrievalV1::ManualRequired;
    canonical.validate().unwrap();
}
