name: Player journey live acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-machine-live:
    name: Clean machine live artifacts + Minecraft
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.5.1'
      - name: Reject mutable Fabric build tooling
        working-directory: minecraft/fabric
        run: '! grep -Ei "^loom_version=.*SNAPSHOT" gradle.properties'
      - name: Build candidate SwarmCraft Fabric artifact
        working-directory: minecraft/fabric
        run: gradle build --stacktrace
      - name: Build candidate Rust binaries
        run: cargo build -p swarm-cli --bins --locked
      - name: Resolve candidate Fabric JAR
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find minecraft/fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar"
          echo "SWARMCRAFT_FABRIC_MOD_JAR=$GITHUB_WORKSPACE/$jar" >> "$GITHUB_ENV"
      - name: Execute clean-machine player journey against official services
        shell: bash
        env:
          SWARMCRAFT_ACCEPTANCE_KEEP_DATA: '1'
          SWARMCRAFT_ACCEPTANCE_DATA_DIR: ${{ runner.temp }}/swarmcraft-clean-machine-data
          SWARMCRAFT_ACCEPTANCE_LOG_DIR: ${{ runner.temp }}/swarmcraft-clean-machine-logs
        run: |
          set -euo pipefail
          # Each attempt MUST start from a genuinely empty data directory and
          # install the official managed Java/Minecraft/Fabric artifacts itself.
          # Never retry a product assertion, checksum failure or other non-504
          # error as if it were an infrastructure outage.
          for attempt in 1 2 3 4; do
            data="$SWARMCRAFT_ACCEPTANCE_DATA_DIR/attempt-$attempt"
            logs="$SWARMCRAFT_ACCEPTANCE_LOG_DIR/attempt-$attempt"
            mkdir -p "$logs"
            console="$logs/console.log"
            echo "Live player journey attempt $attempt/4 (fresh state)"
            if env -u JAVA_HOME \
                PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                SWARMCRAFT_FABRIC_MOD_JAR="$SWARMCRAFT_FABRIC_MOD_JAR" \
                SWARMCRAFT_ACCEPTANCE_KEEP_DATA=1 \
                SWARMCRAFT_ACCEPTANCE_DATA_DIR="$data" \
                SWARMCRAFT_ACCEPTANCE_LOG_DIR="$logs" \
                bash scripts/acceptance/clean-machine-live.sh 2>&1 | tee "$console"; then
              grep -q '^CLEAN_MACHINE_LIVE_PASS ' "$console" || {
                echo "Live journey returned success without required success marker" >&2
                exit 1
              }
              exit 0
            fi
            # Only the terminal failure may authorize a retry. An earlier
            # recovered 504 must never hide a subsequent product assertion.
            terminal="$(grep -Ev '^(Preserved acceptance (data|logs):|[[:space:]]*$)' "$console" | tail -n 1)"
            if ! grep -Eq '^curl: \(22\) The requested URL returned error: (429|500|502|503|504)
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Official artifact HTTP outage persisted across all four fresh-state attempts" >&2
              exit 1
            fi
            echo "Official artifact HTTP error; bounded retry with fresh clean-machine state"
            sleep $((5 * attempt * attempt))
          done
      - name: Upload clean-machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-machine-live-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/swarmcraft-clean-machine-logs/**
            ${{ runner.temp }}/swarmcraft-clean-machine-data/**
          if-no-files-found: warn
          retention-days: 14
 <<<"$terminal"; then
              echo "Live journey terminal failure is not an upstream HTTP response; failing closed" >&2
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Official artifact HTTP outage persisted across all four fresh-state attempts" >&2
              exit 1
            fi
            echo "Official artifact HTTP error; bounded retry with fresh clean-machine state"
            sleep $((5 * attempt * attempt))
          done
      - name: Upload clean-machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clean-machine-live-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/swarmcraft-clean-machine-logs/**
            ${{ runner.temp }}/swarmcraft-clean-machine-data/**
          if-no-files-found: warn
          retention-days: 14
