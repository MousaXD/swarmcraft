name: Agent 2 final rustfmt

on:
  pull_request:
    branches: [backup/local-work-20260824]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/modrinth-provider'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace Rust
        run: cargo fmt --all
      - name: Format excluded Rust crates
        run: rustfmt --edition 2021 apps/desktop/src-tauri/src/main.rs apps/desktop/src-tauri/src/modrinth_commands.rs crates/swarm-provider/src/lib.rs
      - name: Commit formatting and retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent2-final-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Format final Agent 2 changes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
