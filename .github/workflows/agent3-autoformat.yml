name: Agent 3 one-shot rustfmt

on:
  push:
    branches: [fix/agent-3-storage]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-3-storage
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply Agent 3 source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          integrity = Path("crates/swarm-storage/src/integrity.rs")
          text = integrity.read_text()
          old = '''            if entry.path().extension().and_then(|value| value.to_str()) != Some("postcard") {
              continue;
          }
          let stem =
              entry.path().file_stem().and_then(|value| value.to_str()).ok_or(StorageError::WorldMetadataMismatch)?;
          let number = stem.parse::<u64>().map_err(|_| StorageError::WorldMetadataMismatch)?;
          '''
          new = '''            let path = entry.path();
          if path.extension().and_then(|value| value.to_str()) != Some("postcard") {
              continue;
          }
          let stem = path.file_stem().and_then(|value| value.to_str()).ok_or(StorageError::WorldMetadataMismatch)?;
          let number = stem.parse::<u64>().map_err(|_| StorageError::WorldMetadataMismatch)?;
          '''
          if old in text:
              text = text.replace(old, new, 1)
              integrity.write_text(text)
          elif 'let path = entry.path();' not in text:
              raise SystemExit("integrity.rs compile fix target not found")

          streaming = Path("crates/swarm-storage/src/streaming.rs")
          text = streaming.read_text()
          old_import = '    fs::{self, File, OpenOptions},\n'
          if old_import in text:
              text = text.replace(old_import, '    fs::{self, File},\n', 1)
          marker = '#[cfg(test)]\nmod tests {\n    use super::*;\n'
          replacement = '#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs::OpenOptions;\n'
          if 'use std::fs::OpenOptions;' not in text:
              if marker not in text:
                  raise SystemExit("streaming.rs test module target not found")
              text = text.replace(marker, replacement, 1)
          streaming.write_text(text)

          migration = Path("crates/swarm-cli/src/migration.rs")
          text = migration.read_text()
          old = '''    ensure_authority_generation(storage, &identity, &epoch)?;
          let number = storage.next_snapshot_number(options.world)?;
          let previous_hash = Some(latest.manifest_hash()?);
          '''
          new = '''    ensure_authority_generation(storage, &identity, &epoch)?;
          let expected_head = storage.canonical_snapshot_head(options.world)?.head;
          let number = storage.next_snapshot_number(options.world)?;
          let previous_hash = Some(latest.manifest_hash()?);
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'let expected_head = storage.canonical_snapshot_head(options.world)?.head;' not in text:
              raise SystemExit("migration checkpoint head target not found")
          old = '''    identity.sign_snapshot(&mut final_manifest)?;
          storage.commit_snapshot(&final_manifest)?;
          '''
          new = '''    identity.sign_snapshot(&mut final_manifest)?;
          storage.commit_snapshot_fenced(
              &final_manifest,
              swarm_storage::SnapshotCommitFence {
                  expected_epoch: epoch.epoch_number,
                  expected_fencing_token: epoch.fencing_token,
                  expected_head,
              },
          )?;
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'storage.commit_snapshot_fenced(\n        &final_manifest,' not in text:
              raise SystemExit("migration checkpoint commit target not found")
          migration.write_text(text)

          promotion_old = '''        identity.sign_snapshot(&mut promoted)?;
          storage.commit_snapshot(&promoted)?;
          '''
          promotion_new = '''        identity.sign_snapshot(&mut promoted)?;
          let promoted_expected_head = storage.canonical_snapshot_head(promoted.world_id)?.head;
          storage.commit_snapshot_fenced(
              &promoted,
              swarm_storage::SnapshotCommitFence {
                  expected_epoch: epoch.epoch_number,
                  expected_fencing_token: epoch.fencing_token,
                  expected_head: promoted_expected_head,
              },
          )?;
          '''
          for source in [Path("crates/swarm-cli/src/migration.rs"), Path("crates/swarm-cli/src/daemon.rs")]:
              text = source.read_text()
              if promotion_old in text:
                  text = text.replace(promotion_old, promotion_new, 1)
                  source.write_text(text)
              elif 'let promoted_expected_head = storage.canonical_snapshot_head(promoted.world_id)?.head;' not in text:
                  raise SystemExit(f"{source} promotion commit target not found")
          PY
      - name: Refresh root lockfile minimally
        run: cargo check -p swarm-storage
      - name: Refresh Desktop lockfile minimally
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Capture clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee implementation/agent-3-clippy.txt
          status=${PIPESTATUS[0]}
          echo "CLIPPY_EXIT=$status" | tee -a implementation/agent-3-clippy.txt
          exit 0
      - name: Commit source, lockfiles, formatter, and diagnostics
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "source, lockfiles, formatter, and diagnostics unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(storage): fence canonical authority publications"
          git push origin HEAD:fix/agent-3-storage
