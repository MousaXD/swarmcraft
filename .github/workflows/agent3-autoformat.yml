name: Agent 3 one-shot rustfmt

on:
  push:
    branches: [fix/agent-3-storage]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-3-storage
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Refresh root lockfile minimally
        run: cargo check -p swarm-storage
      - name: Refresh Desktop lockfile minimally
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Capture clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee implementation/agent-3-clippy.txt
          status=${PIPESTATUS[0]}
          echo "CLIPPY_EXIT=$status" | tee -a implementation/agent-3-clippy.txt
          exit 0
      - name: Commit lockfiles, formatter, and diagnostics
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "lockfiles, formatter, and diagnostics unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(agent3): refresh locks and validation diagnostics"
          git push origin HEAD:fix/agent-3-storage
