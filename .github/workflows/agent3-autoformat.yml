name: Agent 3 one-shot rustfmt

on:
  push:
    branches: [fix/agent-3-storage]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-3-storage
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Capture clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings > implementation/agent-3-clippy.txt 2>&1
          status=$?
          echo "CLIPPY_EXIT=$status" >> implementation/agent-3-clippy.txt
          exit 0
      - name: Commit formatter and diagnostics
        shell: bash
        run: |
          if git diff --quiet; then
            echo "formatter and diagnostics unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(agent3): capture formatted clippy state"
          git push origin HEAD:fix/agent-3-storage
