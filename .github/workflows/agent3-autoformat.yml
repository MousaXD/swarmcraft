name: Agent 3 one-shot rustfmt

on:
  push:
    branches: [fix/agent-3-storage]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-3-storage
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply Agent 3 source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          integrity = Path("crates/swarm-storage/src/integrity.rs")
          text = integrity.read_text()
          if "let path = entry.path();" not in text:
              needle = '            if entry.path().extension().and_then(|value| value.to_str()) != Some("postcard") {\n'
              replacement = '            let path = entry.path();\n            if path.extension().and_then(|value| value.to_str()) != Some("postcard") {\n'
              if needle not in text:
                  raise SystemExit("integrity.rs path target not found")
              text = text.replace(needle, replacement, 1)
          if "entry.path().file_stem()" in text:
              text = text.replace("entry.path().file_stem()", "path.file_stem()", 1)
          epoch_old = "        let current_epoch = self.load_epoch_record(manifest.world_id).ok();\n"
          if epoch_old in text:
              epoch_new = "\n".join([
                  '        let epoch_path = self.world_dir(manifest.world_id).join("metadata").join("epoch.postcard");',
                  "        let current_epoch = if epoch_path.exists() {",
                  "            Some(self.load_epoch_record(manifest.world_id)?)",
                  "        } else {",
                  "            None",
                  "        };",
                  "",
              ])
              text = text.replace(epoch_old, epoch_new, 1)
          elif "let epoch_path = self.world_dir(manifest.world_id)" not in text:
              raise SystemExit("integrity.rs epoch fail-closed target not found")
          text = text.replace("    previous_head: Option<CanonicalSnapshotRefV1>,\n", "", 1)
          text = text.replace("            previous_head: previous,\n", "", 1)
          unused_impl = "\n".join([
              "impl SnapshotCommitTransaction {",
              "    pub(crate) fn previous_head(&self) -> Option<CanonicalSnapshotRefV1> {",
              "        self.previous_head",
              "    }",
              "",
              "    pub(crate) fn next_head(&self) -> CanonicalSnapshotRefV1 {",
              "        self.next_head",
              "    }",
              "}",
              "",
          ])
          text = text.replace(unused_impl, "", 1)
          integrity.write_text(text)

          streaming = Path("crates/swarm-storage/src/streaming.rs")
          text = streaming.read_text()
          text = text.replace('    fs::{self, File, OpenOptions},\n', '    fs::{self, File},\n', 1)
          if "use std::fs::OpenOptions;" not in text:
              needle = "mod tests {\n    use super::*;\n"
              replacement = "mod tests {\n    use super::*;\n    use std::fs::OpenOptions;\n"
              if needle not in text:
                  raise SystemExit("streaming.rs test module target not found")
              text = text.replace(needle, replacement, 1)
          text = text.replace(
              "if matches!(error, StorageError::SnapshotManifestConflict { .. }) {",
              "if matches!(error, StorageError::SnapshotHistoryConflict { .. }) {",
              1,
          )
          streaming.write_text(text)

          base = Path("crates/swarm-storage/src/lib.rs")
          text = base.read_text()
          old_load = "\n".join([
              "    pub fn load_snapshot(&self, world: WorldId, number: u64) -> Result<SnapshotManifestV1, StorageError> {",
              "        self.validate_canonical_snapshot_namespace(world)?;",
              "        self.load_snapshot_file_unchecked(world, number)",
              "    }",
          ])
          if old_load in text:
              new_load = "\n".join([
                  "    pub fn load_snapshot(&self, world: WorldId, number: u64) -> Result<SnapshotManifestV1, StorageError> {",
                  "        let manifest = self.load_snapshot_file_unchecked(world, number)?;",
                  "        self.validate_canonical_snapshot_namespace(world)?;",
                  "        Ok(manifest)",
                  "    }",
              ])
              text = text.replace(old_load, new_load, 1)
          elif "let manifest = self.load_snapshot_file_unchecked(world, number)?;" not in text:
              raise SystemExit("lib.rs direct load ordering target not found")
          old_debris = 'name.starts_with(".atomic-") || name.starts_with(".blob-") || name.starts_with(".restore-")'
          new_debris = old_debris + ' || name.starts_with(".deleted-")'
          if old_debris in text and 'name.starts_with(".deleted-")' not in text:
              text = text.replace(old_debris, new_debris, 1)
          base.write_text(text)

          migration = Path("crates/swarm-cli/src/migration.rs")
          text = migration.read_text()
          if "let expected_head = storage.canonical_snapshot_head(options.world)?.head;" not in text:
              needle = "    let number = storage.next_snapshot_number(options.world)?;\n"
              if needle not in text:
                  raise SystemExit("migration checkpoint number target not found")
              text = text.replace(
                  needle,
                  "    let expected_head = storage.canonical_snapshot_head(options.world)?.head;\n" + needle,
                  1,
              )
          if "storage.commit_snapshot_fenced(\n        &final_manifest," not in text:
              needle = "    storage.commit_snapshot(&final_manifest)?;\n"
              if needle not in text:
                  raise SystemExit("migration checkpoint commit target not found")
              replacement = "\n".join([
                  "    storage.commit_snapshot_fenced(",
                  "        &final_manifest,",
                  "        swarm_storage::SnapshotCommitFence {",
                  "            expected_epoch: epoch.epoch_number,",
                  "            expected_fencing_token: epoch.fencing_token,",
                  "            expected_head,",
                  "        },",
                  "    )?;",
                  "",
              ])
              text = text.replace(needle, replacement, 1)
          migration.write_text(text)

          for source in [Path("crates/swarm-cli/src/migration.rs"), Path("crates/swarm-cli/src/daemon.rs")]:
              text = source.read_text()
              if "let promoted_expected_head = storage.canonical_snapshot_head(promoted.world_id)?.head;" not in text:
                  needle = "        storage.commit_snapshot(&promoted)?;\n"
                  if needle not in text:
                      raise SystemExit(f"{source} promotion commit target not found")
                  replacement = "\n".join([
                      "        let promoted_expected_head = storage.canonical_snapshot_head(promoted.world_id)?.head;",
                      "        storage.commit_snapshot_fenced(",
                      "            &promoted,",
                      "            swarm_storage::SnapshotCommitFence {",
                      "                expected_epoch: epoch.epoch_number,",
                      "                expected_fencing_token: epoch.fencing_token,",
                      "                expected_head: promoted_expected_head,",
                      "            },",
                      "        )?;",
                      "",
                  ])
                  text = text.replace(needle, replacement, 1)
                  source.write_text(text)
          PY
      - name: Refresh root lockfile minimally
        run: cargo check -p swarm-storage
      - name: Refresh Desktop lockfile minimally
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Capture clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee implementation/agent-3-clippy.txt
          status=${PIPESTATUS[0]}
          echo "CLIPPY_EXIT=$status" | tee -a implementation/agent-3-clippy.txt
          exit 0
      - name: Commit source, lockfiles, formatter, and diagnostics
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "source, lockfiles, formatter, and diagnostics unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(storage): close fail-closed durability gaps"
          git push origin HEAD:fix/agent-3-storage
