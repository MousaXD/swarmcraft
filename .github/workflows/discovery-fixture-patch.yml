name: Discovery fixture surgical patch

on:
  push:
    branches:
      - agent/discovery

permissions:
  contents: write

jobs:
  patch-discovery-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discovery
          fetch-depth: 0
      - name: Derive fixture world ID from genesis
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/swarm-cli/src/discovery.rs")
          text = path.read_text()
          old = '''        let friend = PeerIdentity::from_secret_bytes([5; 32]);
        let world = WorldId([6; 32]);
        let genesis = swarm_protocol::WorldGenesisV1 {
            protocol_version: PROTOCOL_VERSION,
            minecraft_version: "1.21.8".into(),
            fabric_loader_version: "0.17.2".into(),
            compatibility_fingerprint: Hash32([7; 32]),
            creation_nonce: [8; 32],
            creator_public_key: local.public_key(),
            initial_membership: vec![local.peer_id()],
        };
        storage
'''
          new = '''        let friend = PeerIdentity::from_secret_bytes([5; 32]);
        let genesis = swarm_protocol::WorldGenesisV1 {
            protocol_version: PROTOCOL_VERSION,
            minecraft_version: "1.21.8".into(),
            fabric_loader_version: "0.17.2".into(),
            compatibility_fingerprint: Hash32([7; 32]),
            creation_nonce: [8; 32],
            creator_public_key: local.public_key(),
            initial_membership: vec![local.peer_id()],
        };
        let world = genesis.world_id().unwrap();
        storage
'''
          if old not in text:
              raise SystemExit("expected discovery fixture not found")
          path.write_text(text.replace(old, new, 1))
      - name: Format and run focused test
        run: |
          rustup component add rustfmt
          cargo fmt --all
          cargo test -p swarm-cli --lib discovery::tests::banned_or_removed_friend_is_not_reported_as_shared_world --locked
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/discovery-fixture-patch.yml
          git config user.name "swarmcraft-ci"
          git config user.email "swarmcraft-ci@users.noreply.github.com"
          git add crates/swarm-cli/src/discovery.rs .github/workflows/discovery-fixture-patch.yml
          git commit -m "Fix discovery shared-world fixture identity"
          git push origin HEAD:agent/discovery
