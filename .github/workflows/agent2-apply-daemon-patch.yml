name: Agent 2 apply daemon patch

on:
  push:
    branches: [fix/agent-2-protocol]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-2-protocol
          fetch-depth: 0
      - name: Apply exact protocol acceptance patches
        shell: python
        run: |
          from pathlib import Path

          daemon = Path("crates/swarm-cli/src/daemon.rs")
          text = daemon.read_text()
          old = '''fn authorize_manifest(storage: &Storage, sender: PeerId, manifest: &SnapshotManifestV1) -> Result<()> {
              storage.load_world(manifest.world_id)?;
              authorize_member(storage, manifest.world_id, sender)?;
              let descriptor = storage.load_world_descriptor(manifest.world_id)?;
              let authority = descriptor
                  .member(manifest.authority_peer_id)
                  .context("snapshot authority is not an authorized world member")?;
              if authority.banned || !authority.authority_eligible || authority.public_key != manifest.authority_public_key {
                  return Err(anyhow!("snapshot authority is not eligible or public key does not match membership"));
              }
              verify_snapshot_signature(manifest)?;
              if let Some(current) = storage.latest_snapshot(manifest.world_id)? {
                  if manifest.epoch < current.epoch || (manifest.epoch == current.epoch && manifest.sequence < current.sequence) {
                      return Err(anyhow!("stale snapshot manifest rejected"));
                  }
              }
              if let Ok(epoch) = storage.load_epoch_record(manifest.world_id) {
                  if manifest.epoch != epoch.epoch_number || manifest.authority_peer_id != epoch.authority_peer_id {
                      return Err(anyhow!("snapshot does not belong to the accepted authority epoch"));
                  }
              }
              Ok(())
          }
          '''
          new = '''fn authorize_manifest(storage: &Storage, sender: PeerId, manifest: &SnapshotManifestV1) -> Result<()> {
              storage.load_world(manifest.world_id)?;
              authorize_member(storage, manifest.world_id, sender)?;
              let descriptor = storage.load_world_descriptor(manifest.world_id)?;
              let authority = descriptor
                  .member(manifest.authority_peer_id)
                  .context("snapshot authority is not an authorized world member")?;
              if authority.banned || !authority.authority_eligible || authority.public_key != manifest.authority_public_key {
                  return Err(anyhow!("snapshot authority is not eligible or public key does not match membership"));
              }
              verify_snapshot_signature(manifest)?;
              storage.validate_replica_history(manifest)?;
              if let Ok(epoch) = storage.load_epoch_record(manifest.world_id) {
                  if manifest.epoch != epoch.epoch_number
                      || manifest.authority_peer_id != epoch.authority_peer_id
                      || manifest.authority_public_key != epoch.authority_public_key
                  {
                      return Err(anyhow!("snapshot does not belong to the accepted authority epoch"));
                  }
              }
              Ok(())
          }
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("authorize_manifest target did not match expected branch source")

          epoch_old = '''fn authorize_epoch(storage: &Storage, sender: PeerId, record: &EpochRecordV1) -> Result<()> {
              authorize_member(storage, record.world_id, sender)?;
          '''
          epoch_new = '''fn authorize_epoch(storage: &Storage, sender: PeerId, record: &EpochRecordV1) -> Result<()> {
              record.validate_semantics()?;
              authorize_member(storage, record.world_id, sender)?;
          '''
          if epoch_old in text:
              text = text.replace(epoch_old, epoch_new, 1)
          elif epoch_new not in text:
              raise SystemExit("authorize_epoch target did not match expected branch source")
          daemon.write_text(text)

          replica = Path("crates/swarm-storage/src/replica.rs")
          text = replica.read_text()
          old = '''    #[error(transparent)]
              Storage(#[from] StorageError),
          '''
          new = '''    #[error(transparent)]
              Storage(#[from] StorageError),
              #[error(transparent)]
              Protocol(#[from] swarm_protocol::ProtocolError),
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("replica error target did not match expected branch source")
          replica.write_text(text)

          v2 = Path("crates/swarm-protocol/src/v2.rs")
          text = v2.read_text()
          text = text.replace(
              "    /// Optional non-canonical discovery hint such as a Modrinth project ID.\n",
              "    /// Optional canonical provider/source hint. When present it is signed and participates in compatibility identity.\n",
              1,
          )
          old = '''    pub fn fingerprint(&self) -> Result<Hash32, ProtocolError> {
              let mut normalized = self.clone();
          '''
          new = '''    pub fn fingerprint(&self) -> Result<Hash32, ProtocolError> {
              self.validate_semantics()?;
              let mut normalized = self.clone();
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("fingerprint target did not match expected branch source")
          old = '''            .then(a.artifact_hash.0.cmp(&b.artifact_hash.0))
                  .then(a.side.cmp(&b.side))
          '''
          new = '''            .then(a.artifact_hash.0.cmp(&b.artifact_hash.0))
                  .then(a.side.cmp(&b.side))
                  .then(a.provider_hint.cmp(&b.provider_hint))
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("artifact sort target did not match expected branch source")
          old = '''            && a.artifact_hash == b.artifact_hash
                  && a.side == b.side
          '''
          new = '''            && a.artifact_hash == b.artifact_hash
                  && a.side == b.side
                  && a.provider_hint == b.provider_hint
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("artifact dedup target did not match expected branch source")
          v2.write_text(text)
      - name: Format patched Rust
        run: cargo fmt --all
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-cli/src/daemon.rs crates/swarm-storage/src/replica.rs crates/swarm-protocol/src/v2.rs
          git commit -m "fix(agent2): enforce protocol history at daemon boundary"
          git push origin HEAD:fix/agent-2-protocol
