name: Agent 2 apply daemon patch

on:
  push:
    branches: [fix/agent-2-protocol]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-2-protocol
          fetch-depth: 0
      - name: Apply protocol acceptance patches
        shell: python
        run: |
          from pathlib import Path
          import re

          daemon = Path("crates/swarm-cli/src/daemon.rs")
          text = daemon.read_text()
          start = text.index("fn authorize_manifest(storage: &Storage, sender: PeerId, manifest: &SnapshotManifestV1) -> Result<()> {")
          end = text.index("\nfn validate_recovery_epoch(", start)
          replacement = '''fn authorize_manifest(storage: &Storage, sender: PeerId, manifest: &SnapshotManifestV1) -> Result<()> {
              storage.load_world(manifest.world_id)?;
              authorize_member(storage, manifest.world_id, sender)?;
              let descriptor = storage.load_world_descriptor(manifest.world_id)?;
              let authority = descriptor
                  .member(manifest.authority_peer_id)
                  .context("snapshot authority is not an authorized world member")?;
              if authority.banned || !authority.authority_eligible || authority.public_key != manifest.authority_public_key {
                  return Err(anyhow!("snapshot authority is not eligible or public key does not match membership"));
              }
              verify_snapshot_signature(manifest)?;
              storage.validate_replica_history(manifest)?;
              if let Ok(epoch) = storage.load_epoch_record(manifest.world_id) {
                  if manifest.epoch != epoch.epoch_number
                      || manifest.authority_peer_id != epoch.authority_peer_id
                      || manifest.authority_public_key != epoch.authority_public_key
                  {
                      return Err(anyhow!("snapshot does not belong to the accepted authority epoch"));
                  }
              }
              Ok(())
          }
          '''
          text = text[:start] + replacement + text[end:]
          epoch_marker = "fn authorize_epoch(storage: &Storage, sender: PeerId, record: &EpochRecordV1) -> Result<()> {\n"
          if epoch_marker + "    record.validate_semantics()?;\n" not in text:
              text = text.replace(epoch_marker, epoch_marker + "    record.validate_semantics()?;\n", 1)
          daemon.write_text(text)

          replica = Path("crates/swarm-storage/src/replica.rs")
          text = replica.read_text()
          if "Protocol(#[from] swarm_protocol::ProtocolError)" not in text:
              text = text.replace(
                  "    #[error(transparent)]\n    Storage(#[from] StorageError),\n",
                  "    #[error(transparent)]\n    Storage(#[from] StorageError),\n    #[error(transparent)]\n    Protocol(#[from] swarm_protocol::ProtocolError),\n",
                  1,
              )
          replica.write_text(text)

          v2 = Path("crates/swarm-protocol/src/v2.rs")
          text = v2.read_text()
          text = text.replace(
              "/// Optional non-canonical discovery hint such as a Modrinth project ID.",
              "/// Optional canonical provider/source hint. When present it is signed and participates in compatibility identity.",
              1,
          )
          if "pub fn fingerprint(&self) -> Result<Hash32, ProtocolError> {\n        self.validate_semantics()?;" not in text:
              text = text.replace(
                  "pub fn fingerprint(&self) -> Result<Hash32, ProtocolError> {\n        let mut normalized = self.clone();",
                  "pub fn fingerprint(&self) -> Result<Hash32, ProtocolError> {\n        self.validate_semantics()?;\n        let mut normalized = self.clone();",
                  1,
              )
          if ".then(a.provider_hint.cmp(&b.provider_hint))" not in text:
              text = text.replace(
                  ".then(a.side.cmp(&b.side))",
                  ".then(a.side.cmp(&b.side))\n            .then(a.provider_hint.cmp(&b.provider_hint))",
                  1,
              )
          if "&& a.provider_hint == b.provider_hint" not in text:
              text = text.replace(
                  "&& a.side == b.side",
                  "&& a.side == b.side\n            && a.provider_hint == b.provider_hint",
                  1,
              )
          v2.write_text(text)
      - name: Format Agent 2 Rust changes
        run: cargo fmt --all
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/swarm-cli/src/daemon.rs \
            crates/swarm-protocol/src/semantics.rs \
            crates/swarm-protocol/src/v2.rs \
            crates/swarm-core/src/lib.rs \
            crates/swarm-core/src/protocol_v2.rs \
            crates/swarm-core/src/lifecycle.rs \
            crates/swarm-core/tests/protocol_version_fail_closed.rs \
            crates/swarm-storage/src/world.rs \
            crates/swarm-storage/src/state.rs \
            crates/swarm-storage/src/control.rs \
            crates/swarm-storage/src/replica.rs
          git commit -m "fix(agent2): enforce protocol history at daemon boundary"
          git push origin HEAD:fix/agent-2-protocol
