name: Recovery player launcher wiring

on:
  workflow_dispatch:
  push:
    branches: [integration/player-launcher-v1]
    paths: [.github/workflows/recovery-integration.yml]

permissions:
  contents: write

jobs:
  wire-player-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/player-launcher-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply authoritative launcher wiring
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/desktop/src/launcher-controller.js <<'JS'
          const invoke = () => window.__TAURI__?.core?.invoke;
          const byId = (id) => document.getElementById(id);
          const clean = (value) => String(value ?? '').trim();

          function errorText(error) {
            if (!error) return 'The operation failed without a diagnostic.';
            if (typeof error === 'string') return error;
            if (error.message) return String(error.message);
            if (error.error?.message) return String(error.error.message);
            try { return JSON.stringify(error); } catch { return String(error); }
          }

          function requireOkEnvelope(value, provider) {
            if (value?.status === 'ok' || value?.status === 'downloaded') return value.data ?? value;
            if (value?.status === 'manual_artifact_required') {
              throw new Error(value.data?.reason || `${provider} requires the exact artifact to be supplied manually.`);
            }
            if (value?.error) throw new Error(value.error.message || `${provider} request failed.`);
            return value;
          }

          function providerHashes(hashes) {
            if (!hashes) return [];
            if (Array.isArray(hashes)) {
              return hashes
                .map((hash) => ({ algorithm: clean(hash.algorithm), digest: clean(hash.digest ?? hash.value) }))
                .filter((hash) => ['sha512', 'sha256', 'sha1', 'md5'].includes(hash.algorithm.toLowerCase()) && hash.digest);
            }
            return Object.entries(hashes)
              .filter(([, digest]) => clean(digest))
              .map(([algorithm, digest]) => ({ algorithm, digest: clean(digest) }))
              .filter((hash) => ['sha512', 'sha256', 'sha1', 'md5'].includes(hash.algorithm.toLowerCase()));
          }

          function dependencyTargets(dependencies, selectedByProject) {
            const result = [];
            for (const dependency of dependencies || []) {
              const projectId = clean(dependency.project_id ?? dependency.projectId);
              if (!projectId) continue;
              const kindRaw = clean(dependency.kind).toLowerCase();
              const kind = kindRaw === 'required' ? 'required'
                : kindRaw === 'optional' ? 'optional'
                  : kindRaw === 'incompatible' ? 'incompatible'
                    : kindRaw === 'embedded' || kindRaw === 'embedded_library' || kindRaw === 'include' ? 'embedded'
                      : null;
              if (!kind) continue;
              const versionId = clean(dependency.version_id ?? dependency.versionId) || selectedByProject.get(projectId);
              if (!versionId) {
                if (kind === 'required') throw new Error(`Required dependency ${projectId} did not resolve to an exact artifact.`);
                continue;
              }
              result.push({ kind, projectId, versionId });
            }
            return result;
          }

          export function canonicalPackageFromDownloaded({ provider, version, file, downloaded, inspection, selectedByProject }) {
            const projectId = clean(version.project_id ?? version.projectId ?? file.project_id ?? file.projectId);
            const versionId = clean(version.version_id ?? version.versionId ?? file.version_id ?? file.versionId ?? file.file_id ?? file.fileId);
            const artifactPath = clean(downloaded.path ?? downloaded.destination);
            if (!projectId || !versionId || !artifactPath) throw new Error(`${provider} did not return an exact downloaded artifact identity.`);
            const environment = clean(inspection.environment).toLowerCase();
            if (environment === 'client') throw new Error(`${inspection.mod_id || inspection.modId} is client-only and cannot be required by a server world.`);
            const side = environment === 'universal' ? 'both' : 'server';
            return {
              artifactId: clean(inspection.mod_id ?? inspection.modId),
              version: clean(inspection.version),
              side,
              artifactPath,
              provider,
              projectId,
              versionId,
              fileName: clean(downloaded.filename ?? file.filename ?? file.file_name ?? file.fileName),
              fileSize: Number(downloaded.size ?? downloaded.bytes ?? file.file_size ?? file.fileSize) || undefined,
              providerHashes: providerHashes(downloaded.hashes ?? file.hashes),
              retrieval: 'provider_download',
              dependencies: dependencyTargets(version.dependencies ?? file.dependencies, selectedByProject),
            };
          }

          function setCreateMessage(message, kind = 'info') {
            const target = byId('createError');
            if (!target) return;
            target.textContent = message;
            target.dataset.kind = kind;
          }

          function makeButton(label, onClick, secondary = false) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = label;
            if (secondary) button.className = 'secondary';
            button.addEventListener('click', onClick);
            return button;
          }

          function installModsUi() {
            const form = byId('createForm');
            const submit = form?.querySelector('button[type="submit"]');
            if (!form || !submit || byId('launcherMods')) return null;
            const section = document.createElement('section');
            section.id = 'launcherMods';
            section.className = 'form-section';
            section.innerHTML = `
              <h3>Mods</h3>
              <p class="muted">Search official provider catalogs. SwarmCraft resolves exact compatible files and required dependencies before the world is created.</p>
              <div class="field-grid">
                <label>Provider
                  <select id="modProvider">
                    <option value="modrinth">Modrinth</option>
                    <option value="curseforge">CurseForge</option>
                  </select>
                </label>
                <label>Search mods
                  <input id="modSearch" type="search" placeholder="e.g. Lithium" autocomplete="off" />
                </label>
              </div>
              <div class="actions"><button id="modSearchButton" type="button" class="secondary">Search</button></div>
              <div id="modSearchStatus" class="muted" aria-live="polite"></div>
              <div id="modSearchResults" class="stack"></div>
              <h4>Selected mods</h4>
              <div id="selectedMods" class="stack"><p class="muted">No third-party mods selected.</p></div>`;
            form.insertBefore(section, submit);
            return section;
          }

          function installDiscoveryUi() {
            const form = byId('joinForm');
            if (!form || byId('publicWorldDiscovery')) return;
            const section = document.createElement('section');
            section.id = 'publicWorldDiscovery';
            section.className = 'form-section';
            section.innerHTML = `
              <h3>Public worlds</h3>
              <p class="muted">Browse authenticated public announcements. Discovery never grants membership; invite-only worlds still require a signed invite.</p>
              <div class="field-grid"><label>Search public worlds<input id="publicWorldQuery" type="search" placeholder="World name or tag" /></label></div>
              <div class="actions"><button id="publicWorldSearch" type="button" class="secondary">Search</button></div>
              <div id="publicWorldStatus" class="muted" aria-live="polite"></div>
              <div id="publicWorldResults" class="stack"></div>`;
            form.parentNode.insertBefore(section, form.nextSibling);
          }

          function hideInternalInputs() {
            const compatibility = byId('createCompatibility');
            if (compatibility) {
              compatibility.required = false;
              const label = compatibility.closest('label');
              if (label) label.hidden = true;
            }
            const bootstrap = byId('bootstrapAddrs');
            const details = bootstrap?.closest('details');
            if (details) details.hidden = true;
          }

          async function hydrateImportCatalogs(call) {
            const minecraftInput = byId('importMinecraft');
            const loaderInput = byId('importLoader');
            if (!minecraftInput || !loaderInput || minecraftInput.tagName === 'SELECT') return;
            const minecraftSelect = document.createElement('select');
            minecraftSelect.id = minecraftInput.id;
            minecraftSelect.name = minecraftInput.name;
            minecraftSelect.required = true;
            minecraftInput.replaceWith(minecraftSelect);
            const loaderSelect = document.createElement('select');
            loaderSelect.id = loaderInput.id;
            loaderSelect.name = loaderInput.name;
            loaderSelect.required = true;
            loaderInput.replaceWith(loaderSelect);
            const catalog = await call('minecraft_versions');
            const versions = catalog.versions || catalog.items || catalog;
            for (const item of versions || []) {
              const id = clean(item.id ?? item.version ?? item);
              if (!id) continue;
              const option = new Option(id, id);
              minecraftSelect.add(option);
            }
            async function loadFabric() {
              loaderSelect.replaceChildren(new Option('Loading compatible loaders…', ''));
              loaderSelect.disabled = true;
              try {
                const result = await call('fabric_loader_versions', { minecraftVersion: minecraftSelect.value });
                const values = result.loaders || result.versions || result.items || result;
                loaderSelect.replaceChildren();
                for (const item of values || []) {
                  const id = clean(item.version ?? item.id ?? item);
                  if (id) loaderSelect.add(new Option(id, id));
                }
                loaderSelect.disabled = false;
              } catch (error) {
                loaderSelect.replaceChildren(new Option('No compatible Fabric Loader found', ''));
                throw error;
              }
            }
            minecraftSelect.addEventListener('change', () => loadFabric().catch(() => {}));
            if (minecraftSelect.options.length) {
              minecraftSelect.selectedIndex = 0;
              await loadFabric();
            }
          }

          function install() {
            const call = invoke();
            if (!call) return;
            hideInternalInputs();
            installModsUi();
            installDiscoveryUi();
            hydrateImportCatalogs(call).catch((error) => console.warn('Import catalog unavailable', error));

            const roots = [];
            const renderSelected = () => {
              const target = byId('selectedMods');
              if (!target) return;
              target.replaceChildren();
              if (!roots.length) {
                const empty = document.createElement('p'); empty.className = 'muted'; empty.textContent = 'No third-party mods selected.'; target.append(empty); return;
              }
              for (const root of roots) {
                const row = document.createElement('div'); row.className = 'card-row';
                const text = document.createElement('span'); text.textContent = `${root.title} · ${root.provider === 'modrinth' ? 'Modrinth' : 'CurseForge'}`;
                row.append(text, makeButton('Remove', () => { roots.splice(roots.indexOf(root), 1); renderSelected(); }, true));
                target.append(row);
              }
            };

            const addRoot = (root) => {
              if (!roots.some((item) => item.provider === root.provider && item.projectId === root.projectId)) roots.push(root);
              renderSelected();
            };

            byId('modSearchButton')?.addEventListener('click', async () => {
              const provider = byId('modProvider').value;
              const query = clean(byId('modSearch').value);
              const minecraft = clean(byId('createMinecraft').value);
              const loader = clean(byId('createLoader').value);
              const status = byId('modSearchStatus');
              const results = byId('modSearchResults');
              if (!minecraft || !loader) { status.textContent = 'Choose Minecraft and Fabric Loader first.'; return; }
              status.textContent = `Searching ${provider === 'modrinth' ? 'Modrinth' : 'CurseForge'}…`;
              results.replaceChildren();
              try {
                let items;
                if (provider === 'modrinth') {
                  const response = await call('modrinth_search', { query: {
                    query, minecraft_version: minecraft, loader: 'fabric', environment: 'server', release_type: null, offset: 0, limit: 20,
                  }});
                  items = response.items || [];
                } else {
                  const response = requireOkEnvelope(await call('curseforge_search', {
                    query, minecraft, loader: 'fabric', environment: 'server', index: 0, pageSize: 20,
                  }), 'CurseForge');
                  items = response.projects || [];
                }
                status.textContent = items.length ? `${items.length} compatible result${items.length === 1 ? '' : 's'}.` : 'No compatible mods found.';
                for (const item of items) {
                  const projectId = clean(item.project_id ?? item.projectId);
                  const title = clean(item.title ?? item.name ?? item.slug ?? projectId);
                  const row = document.createElement('div'); row.className = 'card-row';
                  const text = document.createElement('span'); text.textContent = title;
                  row.append(text, makeButton('Add', () => addRoot({ provider, projectId, title })));
                  results.append(row);
                }
              } catch (error) {
                status.textContent = errorText(error);
              }
            });

            async function inspectPackage(path) {
              return call('inspect_mod_artifact', { path });
            }

            async function prepareModrinth(root, staging) {
              const graph = await call('modrinth_resolve_project', {
                projectId: root.projectId,
                minecraftVersion: clean(byId('createMinecraft').value),
                loader: 'fabric',
                environment: 'server',
              });
              const versions = graph.versions || [];
              const selectedByProject = new Map(versions.map((version) => [clean(version.project_id), clean(version.version_id)]));
              const packages = [];
              for (const version of versions) {
                const file = (version.files || []).find((candidate) => candidate.primary && candidate.retrieval?.state === 'provider_download')
                  || (version.files || []).find((candidate) => candidate.retrieval?.state === 'provider_download');
                if (!file) throw new Error(`${version.display_name || version.project_id} cannot be downloaded automatically from Modrinth.`);
                const destinationDir = `${staging}/modrinth/${version.project_id}/${version.version_id}`;
                const downloaded = await call('modrinth_download', { request: { locator: file.locator, destination_dir: destinationDir, max_bytes: null } });
                const inspection = await inspectPackage(downloaded.path);
                packages.push(canonicalPackageFromDownloaded({ provider: 'modrinth', version, file, downloaded, inspection, selectedByProject }));
              }
              return packages;
            }

            async function prepareCurseForge(root, staging) {
              const envelope = await call('curseforge_resolve_project', {
                projectId: Number(root.projectId), minecraft: clean(byId('createMinecraft').value), loader: 'fabric', environment: 'server',
              });
              const graph = requireOkEnvelope(envelope, 'CurseForge');
              const versions = graph.packages || [];
              const selectedByProject = new Map(versions.map((version) => [clean(version.project_id), clean(version.version_id ?? version.file_id)]));
              const packages = [];
              for (const version of versions) {
                const fileName = clean(version.file_name);
                const destination = `${staging}/curseforge/${version.project_id}/${version.version_id}/${fileName}`;
                const downloadedEnvelope = await call('curseforge_download', { fileId: Number(version.file_id), destination });
                const downloaded = requireOkEnvelope(downloadedEnvelope, 'CurseForge');
                const inspection = await inspectPackage(downloaded.destination);
                packages.push(canonicalPackageFromDownloaded({ provider: 'curseforge', version, file: version, downloaded, inspection, selectedByProject }));
              }
              return packages;
            }

            byId('createForm')?.addEventListener('submit', async (event) => {
              event.preventDefault();
              event.stopImmediatePropagation();
              const name = clean(byId('createName').value);
              const minecraftVersion = clean(byId('createMinecraft').value);
              const loaderVersion = clean(byId('createLoader').value);
              const visibility = clean(byId('createVisibility').value);
              if (!name || !minecraftVersion || !loaderVersion || !visibility) { setCreateMessage('Choose a name, Minecraft version, Fabric Loader, and visibility.', 'error'); return; }
              const submit = event.currentTarget.querySelector('button[type="submit"]');
              if (submit) submit.disabled = true;
              setCreateMessage('Resolving exact mods and dependencies…');
              try {
                const staging = await call('provider_staging_dir');
                const packages = [];
                for (const root of [...roots].sort((a, b) => `${a.provider}:${a.projectId}`.localeCompare(`${b.provider}:${b.projectId}`))) {
                  packages.push(...await (root.provider === 'modrinth' ? prepareModrinth(root, staging) : prepareCurseForge(root, staging)));
                }
                const unique = new Map(packages.map((item) => [`${item.provider}:${item.projectId}:${item.versionId}`, item]));
                setCreateMessage('Creating canonical world…');
                const created = await call('create_canonical_world', { request: {
                  name, visibility,
                  modpack: { minecraftVersion, loaderId: 'fabric', loaderVersion, packages: [...unique.values()], datapacks: [] },
                }});
                for (const pkg of unique.values()) {
                  await call('world_mods_add', { world: created.worldId, jarPath: pkg.artifactPath });
                }
                setCreateMessage(`World created with canonical fingerprint ${created.canonical?.compatibilityFingerprint || ''}.`, 'success');
                window.setTimeout(() => window.location.reload(), 250);
              } catch (error) {
                setCreateMessage(errorText(error), 'error');
                if (submit) submit.disabled = false;
              }
            }, true);

            byId('publicWorldSearch')?.addEventListener('click', async () => {
              const status = byId('publicWorldStatus'); const results = byId('publicWorldResults');
              status.textContent = 'Searching authenticated public announcements…'; results.replaceChildren();
              try {
                const report = await call('discovery_search', { query: clean(byId('publicWorldQuery').value) || null });
                status.textContent = report.detail || (report.results?.length ? `${report.results.length} public world${report.results.length === 1 ? '' : 's'} found.` : 'No public worlds found.');
                for (const world of report.results || []) {
                  const row = document.createElement('div'); row.className = 'card-row';
                  const text = document.createElement('span'); text.textContent = `${world.name} · Minecraft ${world.minecraft_version} · Fabric ${world.loader_version}`;
                  const action = makeButton(world.join_action === 'invite_required' ? 'Invite required' : 'View', () => {
                    byId('joinWorldId').value = world.world_id;
                    status.textContent = world.join_action === 'invite_required'
                      ? `${world.name} is public to discover, but its authority still requires a signed invite for membership.`
                      : `${world.name} was discovered. Membership is still decided by the world authority.`;
                  }, true);
                  row.append(text, action); results.append(row);
                }
              } catch (error) { status.textContent = errorText(error); }
            });

            byId('joinWorldIdButton')?.addEventListener('click', async (event) => {
              event.preventDefault(); event.stopImmediatePropagation();
              const world = clean(byId('joinWorldId').value); if (!world) return;
              const status = byId('publicWorldStatus') || byId('joinError');
              try {
                const report = await call('discovery_resolve', { world });
                status.textContent = report.state === 'found'
                  ? `${report.world.name} is ${report.world.visibility}. Discovery verified its signed announcement; a signed invite is still required when membership policy is invite-only.`
                  : report.detail || `World resolution: ${report.state}`;
              } catch (error) { status.textContent = errorText(error); }
            }, true);
          }

          if (typeof window !== 'undefined' && typeof document !== 'undefined') {
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install, { once: true });
            else install();
          }
          JS

          python3 - <<'PY'
          from pathlib import Path

          app = Path('apps/desktop/src/app.js')
          text = app.read_text()
          marker = "import { createImportRequest, parseImportResult } from './import-flow.js';\n"
          additions = "import './catalog-selectors.js';\nimport './launcher-controller.js';\n"
          if additions not in text:
              assert marker in text
              text = text.replace(marker, marker + additions, 1)
          app.write_text(text)

          cargo = Path('apps/desktop/src-tauri/Cargo.toml')
          text = cargo.read_text()
          needle = 'swarm-catalog = { path = "../../../crates/swarm-catalog" }\n'
          if 'swarm-cli = { path = "../../../crates/swarm-cli" }' not in text:
              assert needle in text
              text = text.replace(needle, needle + 'swarm-cli = { path = "../../../crates/swarm-cli" }\n', 1)
          cargo.write_text(text)

          modrinth = Path('apps/desktop/src-tauri/src/modrinth_commands.rs')
          text = modrinth.read_text()
          text = text.replace(
              'ModSearchQuery, ModSearchResult, ModVersionFilter, ModVersionList, ProviderFailure, ResolvedModGraph,',
              'ModSearchQuery, ModSearchResult, ModVersionFilter, ModVersionList, PackageEnvironment, ProviderFailure, ProviderFailureKind, ResolvedModGraph,',
          )
          addition = '''\n#[tauri::command(rename_all = "camelCase")]\npub fn modrinth_resolve_project(\n    project_id: String,\n    minecraft_version: String,\n    loader: String,\n    environment: PackageEnvironment,\n) -> Result<ResolvedModGraph, ProviderFailure> {\n    let client = client()?;\n    let filter = ModVersionFilter {\n        minecraft_version: minecraft_version.clone(),\n        loader: loader.clone(),\n        environment,\n        release_type: None,\n    };\n    let versions = client.versions(&project_id, &filter)?;\n    let root = versions.items.first().ok_or_else(|| {\n        ProviderFailure::new(\n            ProviderFailureKind::Incompatible,\n            format!("Modrinth project {project_id} has no compatible {loader} build for Minecraft {minecraft_version}"),\n        )\n    })?;\n    client.resolve(&ModResolveRequest {\n        root_version_id: root.version_id.clone(),\n        minecraft_version,\n        loader,\n        environment,\n        allowed_release_types: Vec::new(),\n    })\n}\n'''
          marker = '\n#[tauri::command]\npub fn modrinth_download'
          if 'pub fn modrinth_resolve_project' not in text:
              assert marker in text
              text = text.replace(marker, addition + marker, 1)
          modrinth.write_text(text)

          curse = Path('apps/desktop/src-tauri/src/curseforge.rs')
          text = curse.read_text()
          addition = '''\n#[tauri::command(rename_all = "camelCase")]\npub async fn curseforge_resolve_project(\n    project_id: u64,\n    minecraft: String,\n    loader: String,\n    environment: String,\n) -> Value {\n    match async {\n        let target = Target::parse(minecraft, loader, environment)?;\n        let client = CurseForgeClient::from_environment()?;\n        let root = select_best_file(client.compatible_files(project_id, &target).await?)?;\n        resolve_dependency_graph(&client, root, &target).await\n    }\n    .await\n    {\n        Ok(value) => ok(value),\n        Err(error) => error.into_response(),\n    }\n}\n'''
          marker = '\n#[tauri::command(rename_all = "camelCase")]\npub async fn curseforge_resolve(file_id:'
          if 'pub async fn curseforge_resolve_project' not in text:
              assert marker in text
              text = text.replace(marker, addition + marker, 1)
          curse.write_text(text)

          main = Path('apps/desktop/src-tauri/src/main.rs')
          text = main.read_text()
          text = text.replace('    curseforge_download, curseforge_project, curseforge_provider_status, curseforge_resolve, curseforge_search,\n    curseforge_versions,\n',
                              '    curseforge_download, curseforge_project, curseforge_provider_status, curseforge_resolve,\n    curseforge_resolve_project, curseforge_search, curseforge_versions,\n')
          text = text.replace('use modrinth_commands::{modrinth_download, modrinth_project, modrinth_resolve, modrinth_search, modrinth_versions};',
                              'use modrinth_commands::{\n    modrinth_download, modrinth_project, modrinth_resolve, modrinth_resolve_project, modrinth_search, modrinth_versions,\n};')
          if 'use swarm_cli::discovery::' not in text:
              text = text.replace('use runtime_commands::{ensure_daemon_running, start_daemon, stop_daemon, stop_host};\n',
                  'use runtime_commands::{ensure_daemon_running, start_daemon, stop_daemon, stop_host};\nuse swarm_cli::discovery::{self, DiscoverySearchInputV1};\n')
          commands = '''\nfn configured_discovery_bootstraps() -> Vec<String> {\n    std::env::var("SWARMCRAFT_DISCOVERY_BOOTSTRAP")\n        .ok()\n        .into_iter()\n        .flat_map(|value| value.split([',', ';', '\\n']).map(str::to_owned).collect::<Vec<_>>())\n        .map(|value| value.trim().to_owned())\n        .filter(|value| !value.is_empty())\n        .collect()\n}\n\n#[tauri::command]\nfn provider_staging_dir() -> Result<String, String> {\n    let paths = swarm_core::DataPaths::discover().map_err(|error| error.to_string())?;\n    paths.ensure().map_err(|error| error.to_string())?;\n    let nonce = std::time::SystemTime::now()\n        .duration_since(std::time::UNIX_EPOCH)\n        .map_err(|error| error.to_string())?\n        .as_nanos();\n    let path = paths.root.join("provider-staging").join(format!("{}-{nonce}", std::process::id()));\n    std::fs::create_dir_all(&path).map_err(|error| error.to_string())?;\n    Ok(path.to_string_lossy().into_owned())\n}\n\n#[tauri::command]\nfn inspect_mod_artifact(path: String) -> Result<swarm_cli::server_mods::InstalledServerMod, String> {\n    let path = require_value(path, "Mod artifact path")?;\n    swarm_cli::server_mods::inspect_fabric_mod(std::path::Path::new(&path)).map_err(|error| error.to_string())\n}\n\n#[tauri::command]\nasync fn discovery_search(query: Option<String>) -> Result<discovery::PublicWorldSearchReportV1, String> {\n    let paths = swarm_core::DataPaths::discover().map_err(|error| error.to_string())?;\n    discovery::search_public_worlds(\n        &paths,\n        DiscoverySearchInputV1 { query, ..Default::default() },\n        &configured_discovery_bootstraps(),\n    )\n    .await\n    .map_err(|error| error.to_string())\n}\n\n#[tauri::command]\nasync fn discovery_resolve(world: String) -> Result<discovery::ResolveWorldReportV1, String> {\n    let paths = swarm_core::DataPaths::discover().map_err(|error| error.to_string())?;\n    let world = require_value(world, "World ID")?.parse().map_err(|error| format!("invalid world ID: {error}"))?;\n    discovery::resolve_world(&paths, world, &configured_discovery_bootstraps())\n        .await\n        .map_err(|error| error.to_string())\n}\n'''
          marker = '\n#[tauri::command]\nasync fn initialize_node'
          if 'fn provider_staging_dir()' not in text:
              assert marker in text
              text = text.replace(marker, commands + marker, 1)
          registrations = [
              ('validate_fabric_selection,', 'validate_fabric_selection,\n            provider_staging_dir,\n            inspect_mod_artifact,\n            discovery_search,\n            discovery_resolve,'),
              ('modrinth_resolve,', 'modrinth_resolve,\n            modrinth_resolve_project,'),
              ('curseforge_resolve,', 'curseforge_resolve,\n            curseforge_resolve_project,'),
          ]
          for old, new in registrations:
              if new not in text:
                  assert old in text
                  text = text.replace(old, new, 1)
          main.write_text(text)
          PY

          cat > apps/desktop/tests/launcher-controller.test.mjs <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { canonicalPackageFromDownloaded } from '../src/launcher-controller.js';

          test('downloaded provider artifact maps runtime identity and exact provider provenance', () => {
            const selected = new Map([['dep', 'dep-version']]);
            const result = canonicalPackageFromDownloaded({
              provider: 'modrinth',
              version: {
                project_id: 'root', version_id: 'root-version', dependencies: [
                  { kind: 'required', project_id: 'dep', version_id: null },
                  { kind: 'optional', project_id: 'not-selected', version_id: null },
                ],
              },
              file: { filename: 'root.jar' },
              downloaded: { path: '/tmp/root.jar', filename: 'root.jar', size: 42, hashes: { sha512: 'ab'.repeat(64) } },
              inspection: { mod_id: 'real_fabric_mod_id', version: '1.2.3', environment: 'universal' },
              selectedByProject: selected,
            });
            assert.equal(result.artifactId, 'real_fabric_mod_id');
            assert.equal(result.version, '1.2.3');
            assert.equal(result.side, 'both');
            assert.equal(result.projectId, 'root');
            assert.equal(result.versionId, 'root-version');
            assert.deepEqual(result.dependencies, [{ kind: 'required', projectId: 'dep', versionId: 'dep-version' }]);
            assert.equal(result.providerHashes[0].algorithm, 'sha512');
          });

          test('missing exact required dependency fails closed', () => {
            assert.throws(() => canonicalPackageFromDownloaded({
              provider: 'curseforge',
              version: { project_id: '1', version_id: '2', dependencies: [{ kind: 'required', project_id: '3' }] },
              file: { file_name: 'x.jar', hashes: [{ algorithm: 'sha1', value: 'ab'.repeat(20) }] },
              downloaded: { destination: '/tmp/x.jar', bytes: 1 },
              inspection: { mod_id: 'x', version: '1', environment: 'server' },
              selectedByProject: new Map(),
            }), /did not resolve to an exact artifact/);
          });
          JS

          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          git diff --check
          node --test apps/desktop/tests/*.test.mjs
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop .github/workflows/recovery-integration.yml
          git commit -m 'feat(launcher): wire catalogs providers canonical create and discovery'
          git push origin HEAD:integration/player-launcher-v1
