name: Recovery player launcher wiring

on:
  workflow_dispatch:
  push:
    branches: [integration/player-launcher-v1]
    paths: [.github/workflows/recovery-integration.yml]

permissions:
  contents: write

jobs:
  format-recovery-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/player-launcher-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format recovery Rust sources
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/swarm-cli/src/provider_runtime.rs crates/swarm-cli/src/runtime_main.rs
          git commit -m 'style(runtime): apply rustfmt to provider acquisition'
          git push origin HEAD:integration/player-launcher-v1
