name: Recovery player launcher wiring

on:
  workflow_dispatch:
  push:
    branches: [integration/player-launcher-v1]
    paths: [.github/workflows/recovery-integration.yml]

permissions:
  contents: write

jobs:
  wire-player-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/player-launcher-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply authoritative launcher wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/recovery/wire_player_launcher.py
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          git diff --check
          node --test apps/desktop/tests/*.test.mjs
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-features
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop
          git commit -m 'feat(launcher): wire catalogs providers canonical create and discovery'
          git push origin HEAD:integration/player-launcher-v1
