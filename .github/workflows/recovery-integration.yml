name: Recovery player launcher formatting

on:
  workflow_dispatch:
  push:
    branches: [integration/player-launcher-v1]
    paths: [.github/workflows/recovery-integration.yml]

permissions:
  contents: write

jobs:
  format-desktop-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/player-launcher-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Desktop launcher bridge
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all
          git diff --check
          if git diff --quiet -- apps/desktop/src-tauri/src/launcher_commands.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/desktop/src-tauri/src/launcher_commands.rs
          git commit -m 'style(desktop): apply rustfmt to launcher bridge'
          git push origin HEAD:integration/player-launcher-v1
