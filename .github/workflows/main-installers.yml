name: Main Desktop Installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Exact-SHA required validation
    uses: ./.github/workflows/required-validation.yml
    with:
      run_network_soak: true
    permissions:
      contents: read
      checks: write

  linux:
    name: Linux .deb
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify Desktop lockfile is current
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build Rust runtimes
        run: cargo build --release --workspace --locked
      - name: Stage Tauri sidecars
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/swarmcraft "apps/desktop/src-tauri/binaries/swarmcraft-$target"
          cp target/release/swarmcraft-host "apps/desktop/src-tauri/binaries/swarmcraft-host-$target"
          cp target/release/swarmcraft-runtime "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target"
          cp target/release/swarmcraft-import "apps/desktop/src-tauri/binaries/swarmcraft-import-$target"
      - name: Build Debian installer
        working-directory: apps/desktop
        run: cargo tauri build --bundles deb --ci
      - name: Stage Debian artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle/deb -type f -name '*.deb' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          for file in dist/*.deb; do sha256sum "$file" > "$file.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swarmcraft-linux-deb-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows .exe installer
    needs: validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Verify Desktop lockfile is current
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps > nul
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build Rust runtimes
        run: cargo build --release --workspace --locked
      - name: Stage Tauri sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item target/release/swarmcraft.exe "apps/desktop/src-tauri/binaries/swarmcraft-$target.exe"
          Copy-Item target/release/swarmcraft-host.exe "apps/desktop/src-tauri/binaries/swarmcraft-host-$target.exe"
          Copy-Item target/release/swarmcraft-runtime.exe "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target.exe"
          Copy-Item target/release/swarmcraft-import.exe "apps/desktop/src-tauri/binaries/swarmcraft-import-$target.exe"
      - name: Build Windows installer
        working-directory: apps/desktop
        run: cargo tauri build --bundles nsis --ci
      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -File -Filter *.exe | Copy-Item -Destination dist
          if (-not (Get-ChildItem dist -File -Filter *.exe)) { throw 'No NSIS .exe installer produced' }
          Get-ChildItem dist -File -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swarmcraft-windows-exe-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS .dmg (${{ matrix.arch }})
    needs: validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Verify Desktop lockfile is current
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build Rust runtimes
        run: cargo build --release --workspace --locked
      - name: Stage Tauri sidecars
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/swarmcraft "apps/desktop/src-tauri/binaries/swarmcraft-$target"
          cp target/release/swarmcraft-host "apps/desktop/src-tauri/binaries/swarmcraft-host-$target"
          cp target/release/swarmcraft-runtime "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target"
          cp target/release/swarmcraft-import "apps/desktop/src-tauri/binaries/swarmcraft-import-$target"
      - name: Build unsigned preview macOS installer
        working-directory: apps/desktop
        run: cargo tauri build --bundles dmg --ci --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Stage macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          for file in dist/*.dmg; do shasum -a 256 "$file" > "$file.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swarmcraft-macos-${{ matrix.arch }}-dmg-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  fabric:
    name: Fabric bridge jar
    needs: validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft/fabric
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.5.1'
      - name: Reject mutable Fabric build tooling
        run: '! grep -Ei "^loom_version=.*SNAPSHOT" gradle.properties'
      - name: Build Fabric bridge
        run: gradle build --stacktrace
      - name: Stage Fabric jar and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          jar="$(find build/libs -maxdepth 1 -type f -name 'swarmcraft-fabric-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar"
          cp "$jar" ../../dist/
          (cd ../../dist && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swarmcraft-fabric-${{ github.sha }}
          path: |
            dist/*.jar
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish rolling main release
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [validation, linux, windows, macos, fabric]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: swarmcraft-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
      - name: Publish validated SwarmCraft Main Snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view main-latest >/dev/null 2>&1; then
            gh release delete main-latest --cleanup-tag --yes
          fi
          cat > release-notes.md <<EOF
          Automated preview snapshot from \`main\` after the exact commit passed Required Validation, including the release-candidate network soak.

          Commit: \`${GITHUB_SHA}\`

          Installers included:
          - Linux Debian package (\`.deb\`)
          - Windows NSIS installer (\`.exe\`)
          - macOS Apple Silicon disk image (\`.dmg\`)
          - macOS Intel disk image (\`.dmg\`)
          - versioned SwarmCraft Fabric bridge JAR
          - SHA-256 checksum files

          Preview signing policy:
          - Linux: checksum-protected development package
          - Windows: unsigned development snapshot
          - macOS: ad-hoc signed development snapshot, not notarized

          This rolling preview release may be replaced by the next validated push to \`main\`.
          EOF
          gh release create main-latest release-assets/* \
            --target "$GITHUB_SHA" \
            --title "SwarmCraft Main Snapshot" \
            --notes-file release-notes.md \
            --prerelease
