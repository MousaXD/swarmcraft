name: Agent 4 Composed Validation

on:
  push:
    branches:
      - fix/agent-4-network
    paths:
      - .github/workflows/agent4-compose-inspect.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair final composed clippy artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SwarmCraft Agent 4"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          p = Path('crates/swarm-cli/src/daemon.rs')
          text = p.read_text()
          old = 'RecoveryCertificateV1, RecoveryVoteV1, SnapshotManifestV1, SoloBranchV1, TransferPhase'
          new = 'RecoveryCertificateV1, RecoveryVoteV1, SnapshotManifestV1, TransferPhase'
          assert old in text, 'expected unused SoloBranchV1 import not found'
          p.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "crates/swarm-cli/src/daemon.rs"
          git diff --check
          git diff -- crates/swarm-cli/src/daemon.rs
          git add crates/swarm-cli/src/daemon.rs
          git commit -m "fix(agent4): remove composed unused import"
          echo "VALIDATED_PRODUCTION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:fix/agent-4-network
      - name: Format
        run: cargo fmt --all -- --check
      - name: Workspace check
        run: cargo check --workspace --all-targets --locked
      - name: Strict workspace clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Network tests
        run: cargo test -p swarm-network --locked
      - name: Protocol tests
        run: cargo test -p swarm-protocol --locked
      - name: Core tests
        run: cargo test -p swarm-core --locked
      - name: Storage tests
        run: cargo test -p swarm-storage --locked
      - name: Consensus tests
        run: cargo test -p swarm-consensus --locked
      - name: CLI library and bin tests
        run: cargo test -p swarm-cli --lib --bins --locked
      - name: Agent 1 partition safety regression
        run: cargo test -p swarm-cli --test consensus_partition_safety --locked
      - name: Agent 1 live membership regressions
        run: |
          cargo test -p swarm-cli --test live_join_replication --locked
          cargo test -p swarm-cli --test automatic_invite_join --locked
      - name: Agent 1 recovery regressions
        run: |
          cargo test -p swarm-cli --test three_daemon_recovery --locked
          cargo test -p swarm-cli --test recovery_successor_dies --locked
      - name: Agent 2 migration/history integration regression
        run: cargo test -p swarm-cli --test migration_core --locked
      - name: Compile all affected integration tests
        run: cargo test -p swarm-network -p swarm-protocol -p swarm-core -p swarm-storage -p swarm-consensus -p swarm-cli --all-targets --locked --no-run
      - name: Impaired QUIC restart and lost-ACK recovery
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { sudo tc qdisc del dev lo root 2>/dev/null || true; }
          trap cleanup EXIT
          sudo tc qdisc replace dev lo root netem delay 15ms 3ms loss 0.5% rate 100mbit
          cargo test -p swarm-network --test network_transfer_soak interrupted_quic_transfer_resumes_after_lost_ack --locked -- --ignored --nocapture
      - name: Confirm exact validated production head
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_PRODUCTION_SHA"
          test -z "$(git status --short)"
          echo "VALIDATED_PRODUCTION_SHA=$VALIDATED_PRODUCTION_SHA"
