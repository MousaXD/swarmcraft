name: Agent 4 Contract Inspect

on:
  push:
    branches:
      - fix/agent-4-network
    paths:
      - .github/workflows/agent4-compose-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace canonical authority and history contracts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== proof/history identifiers ==='
          grep -RniE 'authority.*proof|proof.*authority|history.*proof|proof.*history|membership_history|epoch_history|current_authority' crates --include='*.rs' || true
          echo '=== transition verification/storage identifiers ==='
          grep -RniE 'save_epoch_record|load_epoch_record|verify_epoch|AuthorityTransfer|RecoveryCertificate|validate_recovery_certificate|validate_membership_certificate' crates --include='*.rs' || true
          echo '=== discovery acceptance call sites ==='
          grep -RniE 'verify_world_announcement|AnnouncementReplayGuard|DiscoveryWorlds|DiscoveryResolved|refresh_publications' crates/swarm-cli crates/swarm-core crates/swarm-network crates/swarm-protocol --include='*.rs' || true
