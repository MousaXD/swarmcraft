name: Prepare main release readiness from PR

on:
  pull_request:
    branches:
      - integration/runtime-player-journey

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/main-release-readiness
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Prepare Rust and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/prepare-main-release-readiness.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate focused release changes"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          lines = raw[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, 'prepare-main-release-readiness', 'exec'))
          PY

          # Workflow files are committed separately through the GitHub connector,
          # because GITHUB_TOKEN cannot update workflow definitions here.
          git restore --source=HEAD -- .github/workflows
          cargo fmt --all

      - name: Validate Rust and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p swarm-cli runtime_installer::tests --locked
          python3 scripts/check_release_version.py
          grep -q 'Current application version: 0.4.0' README.md
          grep -q 'SwarmCraft 0.4.0 Implementation Status' docs/IMPLEMENTATION_STATUS.md
          grep -q 'swarmcraft-import' docs/RUNTIME_PLAYER_JOURNEY_INTEGRATION.md
          grep -q 'Two-voter crash failover' docs/RELEASE_GATES.md

      - name: Commit Rust and documentation fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/IMPLEMENTATION_STATUS.md docs/RUNTIME_PLAYER_JOURNEY_INTEGRATION.md docs/RELEASE_GATES.md apps/desktop/RUNTIME_WIZARD_CONTRACT.md crates/swarm-cli/src/runtime_installer.rs
          git diff --cached --check
          git commit -m 'fix: close 0.4.0 release readiness gaps'
          git push origin HEAD:agent/main-release-readiness
