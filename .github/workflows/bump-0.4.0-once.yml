name: Bump SwarmCraft to 0.4.0 once

on:
  push:
    branches:
      - integration/runtime-player-journey
    paths:
      - .github/workflows/bump-0.4.0-once.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/runtime-player-journey
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump application metadata to 0.4.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "Cargo.toml": [("version = \"0.3.0\"", "version = \"0.4.0\"")],
              "apps/desktop/src-tauri/Cargo.toml": [("version = \"0.3.0\"", "version = \"0.4.0\"")],
              "apps/desktop/src-tauri/tauri.conf.json": [("\"version\": \"0.3.0\"", "\"version\": \"0.4.0\"")],
              "minecraft/fabric/gradle.properties": [("mod_version=0.3.0", "mod_version=0.4.0")],
              "scripts/check_release_version.py": [("0.3.0", "0.4.0")],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if name == "scripts/check_release_version.py":
                      if count < 1:
                          raise SystemExit(f"expected at least one {old!r} in {name}")
                      text = text.replace(old, new)
                  else:
                      if count != 1:
                          raise SystemExit(f"expected exactly one {old!r} in {name}, found {count}")
                      text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

          cargo metadata --format-version 1 --no-deps > /dev/null
          python3 scripts/check_release_version.py
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --check

      - name: Commit validated 0.4.0 metadata and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-0.4.0-once.yml
          git add Cargo.toml Cargo.lock apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/tauri.conf.json minecraft/fabric/gradle.properties scripts/check_release_version.py
          git commit -m "chore: bump SwarmCraft to 0.4.0"
          git push origin HEAD:integration/runtime-player-journey
