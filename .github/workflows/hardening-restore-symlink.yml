name: Restore symlink hardening helper

on:
  push:
    branches:
      - agent/production-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening
      - name: Reject pre-existing symlink restore parents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          streaming = Path('crates/swarm-storage/src/streaming.rs')
          text = streaming.read_text()
          old_restore = '''        validate_manifest_shape(manifest)?;\n        fs::create_dir_all(destination).map_err(|error| io_error(destination, error))?;\n        for entry in &manifest.entries {\n            let output = destination.join(entry.path.replace('/', std::path::MAIN_SEPARATOR_STR));\n            restore_blob_streaming(self, manifest.world_id, &entry.blob, &output)?;\n        }\n        Ok(())\n'''
          new_restore = '''        validate_manifest_shape(manifest)?;\n        ensure_restore_root(destination)?;\n        for entry in &manifest.entries {\n            let output = destination.join(entry.path.replace('/', std::path::MAIN_SEPARATOR_STR));\n            restore_blob_streaming(self, manifest.world_id, &entry.blob, destination, &output)?;\n        }\n        Ok(())\n'''
          if old_restore not in text:
              raise SystemExit('restore_snapshot_streaming block not found')
          text = text.replace(old_restore, new_restore, 1)

          marker = '''fn restore_blob_streaming(\n    storage: &Storage,\n    world: WorldId,\n    descriptor: &BlobDescriptor,\n    output: &Path,\n) -> Result<(), StorageError> {'''
          helpers = '''fn restore_directory_exists(path: &Path) -> Result<bool, StorageError> {\n    match fs::symlink_metadata(path) {\n        Ok(metadata) if metadata.file_type().is_symlink() => {\n            Err(StorageError::SymlinkUnsupported(path.to_path_buf()))\n        }\n        Ok(metadata) if metadata.is_dir() => Ok(true),\n        Ok(_) => Err(io_error(\n            path,\n            std::io::Error::new(std::io::ErrorKind::NotADirectory, "restore path component is not a directory"),\n        )),\n        Err(error) if error.kind() == std::io::ErrorKind::NotFound => Ok(false),\n        Err(error) => Err(io_error(path, error)),\n    }\n}\n\nfn ensure_restore_root(destination: &Path) -> Result<(), StorageError> {\n    if !restore_directory_exists(destination)? {\n        fs::create_dir_all(destination).map_err(|error| io_error(destination, error))?;\n        if !restore_directory_exists(destination)? {\n            return Err(io_error(\n                destination,\n                std::io::Error::new(std::io::ErrorKind::NotADirectory, "restore destination is not a directory"),\n            ));\n        }\n    }\n    Ok(())\n}\n\nfn ensure_restore_parent(destination: &Path, parent: &Path) -> Result<(), StorageError> {\n    let relative = parent\n        .strip_prefix(destination)\n        .map_err(|_| StorageError::UnsafeRelativePath(parent.to_string_lossy().into_owned()))?;\n    if !restore_directory_exists(destination)? {\n        return Err(io_error(\n            destination,\n            std::io::Error::new(std::io::ErrorKind::NotFound, "restore destination disappeared"),\n        ));\n    }\n\n    let mut current = destination.to_path_buf();\n    for component in relative.components() {\n        let std::path::Component::Normal(part) = component else {\n            return Err(StorageError::UnsafeRelativePath(parent.to_string_lossy().into_owned()));\n        };\n        current.push(part);\n        if !restore_directory_exists(&current)? {\n            fs::create_dir(&current).map_err(|error| io_error(&current, error))?;\n            if !restore_directory_exists(&current)? {\n                return Err(io_error(\n                    &current,\n                    std::io::Error::new(std::io::ErrorKind::NotADirectory, "restore directory was replaced"),\n                ));\n            }\n        }\n    }\n    Ok(())\n}\n\nfn restore_blob_streaming(\n    storage: &Storage,\n    world: WorldId,\n    descriptor: &BlobDescriptor,\n    destination: &Path,\n    output: &Path,\n) -> Result<(), StorageError> {'''
          if marker not in text:
              raise SystemExit('restore_blob_streaming marker not found')
          text = text.replace(marker, helpers, 1)
          old_parent = '''    fs::create_dir_all(parent).map_err(|error| io_error(parent, error))?;\n    let (temporary_path, mut temporary_file) = create_unique_temp(parent, "restore", "tmp")?;'''
          new_parent = '''    // Reject pre-existing symlink components before creating temporary files.\n    // A future Unix openat/O_NOFOLLOW extraction path can additionally close the remaining TOCTOU window.\n    ensure_restore_parent(destination, parent)?;\n    let (temporary_path, mut temporary_file) = create_unique_temp(parent, "restore", "tmp")?;'''
          if old_parent not in text:
              raise SystemExit('restore parent creation marker not found')
          streaming.write_text(text.replace(old_parent, new_parent, 1))

          tests = Path('crates/swarm-storage/tests/failure_injection.rs')
          text = tests.read_text()
          text = text.replace('#[ignore = "known security gap: restore follows symlinked parents; requires race-resistant extraction"]\n', '', 1)
          marker = '''    assert!(!outside.join("escaped.dat").exists());\n}\n\n#[test]\nfn duplicate_manifest_paths_are_rejected_even_with_a_matching_state_root()'''
          added = '''    assert!(!outside.join("escaped.dat").exists());\n}\n\n#[cfg(unix)]\n#[test]\nfn restore_rejects_symlinked_destination_root() {\n    use std::os::unix::fs::symlink;\n\n    let (temp, storage, manifest) = snapshot_fixture();\n    let outside = temp.path().join("outside-root");\n    let destination = temp.path().join("restore-root");\n    fs::create_dir_all(&outside).unwrap();\n    symlink(&outside, &destination).unwrap();\n\n    assert!(matches!(\n        storage.restore_snapshot(&manifest, &destination),\n        Err(StorageError::SymlinkUnsupported(path)) if path == destination\n    ));\n    assert!(!outside.join("level.dat").exists());\n}\n\n#[test]\nfn duplicate_manifest_paths_are_rejected_even_with_a_matching_state_root()'''
          if marker not in text:
              raise SystemExit('failure injection insertion marker not found')
          tests.write_text(text.replace(marker, added, 1))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Test storage hardening
        run: cargo test -p swarm-storage --test failure_injection
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-storage/src/streaming.rs crates/swarm-storage/tests/failure_injection.rs
          git commit -m "fix(storage): reject symlink restore parents"
          git push origin HEAD:agent/production-hardening
