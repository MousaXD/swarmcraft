name: Agent 4 Integration Bulk Admission Repair

on:
  push:
    branches:
      - integration/agent4-validated
    paths:
      - .github/integration_agent4_bulk_admission_fix.py
      - .github/workflows/integration-agent4-bulk-admission-fix.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply bounded bulk admission repair
        run: python .github/integration_agent4_bulk_admission_fix.py

      - name: Format and validate network crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p swarm-network --all-targets --locked
          cargo clippy -p swarm-network --all-targets --locked -- -D warnings

      - name: Run admission and reconnect regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p swarm-network admission --locked -- --nocapture
          cargo test -p swarm-network --test network_transfer_soak interrupted_quic_transfer_resumes_after_lost_ack --locked -- --nocapture

      - name: Remove temporary repair machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/integration_agent4_bulk_admission_fix.py
          rm -f .github/workflows/integration-agent4-bulk-admission-fix.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/integration_agent4_bulk_admission_fix.py' \
            '.github/workflows/integration-agent4-bulk-admission-fix.yml' \
            'crates/swarm-network/src/admission.rs' \
            'crates/swarm-network/src/discovery.rs' \
            'crates/swarm-network/src/node.rs' \
            'crates/swarm-network/tests/network_transfer_soak.rs' | sort)"
          test "$changed" = "$expected"

      - name: Commit integration repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'swarmcraft-integration'
          git config user.email 'integration@users.noreply.github.com'
          git add -A
          git commit -m 'fix(network): separate authenticated bulk admission budget'
          git push origin HEAD:integration/agent4-validated
