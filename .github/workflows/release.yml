name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validation:
    name: Exact-tag required validation
    uses: ./.github/workflows/required-validation.yml
    with:
      release_tag: ${{ github.ref_name }}
      run_network_soak: true
    permissions:
      contents: read
      checks: write

  release-policy:
    name: Production signing policy
    runs-on: ubuntu-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require production signing and notarization credentials
        run: python3 scripts/check_release_credentials.py

  linux:
    name: Linux release bundle
    needs: [validation, release-policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify Desktop lockfile is current
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build Rust runtimes
        run: cargo build --release --workspace --locked
      - name: Stage Tauri sidecars
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/swarmcraft "apps/desktop/src-tauri/binaries/swarmcraft-$target"
          cp target/release/swarmcraft-host "apps/desktop/src-tauri/binaries/swarmcraft-host-$target"
          cp target/release/swarmcraft-runtime "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target"
          cp target/release/swarmcraft-import "apps/desktop/src-tauri/binaries/swarmcraft-import-$target"
      - name: Build native Linux packages
        working-directory: apps/desktop
        run: cargo tauri build --bundles deb,appimage --ci
      - name: Stage Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          for file in dist/*.deb dist/*.AppImage; do sha256sum "$file" > "$file.sha256"; done
          printf '%s\n' 'Checksum-protected Linux release package.' > dist/SIGNING_STATUS_LINUX.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows signed release bundle
    needs: [validation, release-policy]
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Verify Desktop lockfile is current
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build Rust runtimes
        run: cargo build --release --workspace --locked
      - name: Stage Tauri sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item target/release/swarmcraft.exe "apps/desktop/src-tauri/binaries/swarmcraft-$target.exe"
          Copy-Item target/release/swarmcraft-host.exe "apps/desktop/src-tauri/binaries/swarmcraft-host-$target.exe"
          Copy-Item target/release/swarmcraft-runtime.exe "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target.exe"
          Copy-Item target/release/swarmcraft-import.exe "apps/desktop/src-tauri/binaries/swarmcraft-import-$target.exe"
      - name: Import Authenticode certificate and sign bundled executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'swarmcraft-release.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner' }
          $targets = @(
            'target/release/swarmcraft.exe',
            'target/release/swarmcraft-host.exe'
          ) + (Get-ChildItem apps/desktop/src-tauri/binaries -File -Filter *.exe | ForEach-Object FullName)
          foreach ($target in $targets) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $target" }
          }
      - name: Build native Windows installer
        working-directory: apps/desktop
        run: cargo tauri build --bundles nsis --ci
      - name: Stage and sign Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -File -Filter *.exe | Copy-Item -Destination dist
          if (-not (Get-ChildItem dist -File -Filter *.exe)) { throw 'No NSIS .exe installer produced' }
          $pfx = Join-Path $env:RUNNER_TEMP 'swarmcraft-release.pfx'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner' }
          Get-ChildItem dist -File -Filter *.exe | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
          }
          'Authenticode signed with the required production release certificate.' | Set-Content dist/SIGNING_STATUS_WINDOWS.txt
          Remove-Item $pfx -Force
          Get-ChildItem dist -File -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS signed/notarized release (${{ matrix.arch }})
    needs: [validation, release-policy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Verify Desktop lockfile is current
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build Rust runtimes
        run: cargo build --release --workspace --locked
      - name: Stage Tauri sidecars
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/swarmcraft "apps/desktop/src-tauri/binaries/swarmcraft-$target"
          cp target/release/swarmcraft-host "apps/desktop/src-tauri/binaries/swarmcraft-host-$target"
          cp target/release/swarmcraft-runtime "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target"
          cp target/release/swarmcraft-import "apps/desktop/src-tauri/binaries/swarmcraft-import-$target"
      - name: Build Developer ID signed and notarized macOS installer
        working-directory: apps/desktop
        run: cargo tauri build --bundles dmg --ci
      - name: Stage macOS package and signing status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          printf '%s\n' 'Developer ID signing and notarization credentials were required and configured for this production build.' > "dist/SIGNING_STATUS_MACOS_${{ matrix.arch }}.txt"
          for file in dist/*.dmg; do shasum -a 256 "$file" > "$file.sha256"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  fabric:
    name: Fabric bridge jar
    needs: [validation, release-policy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft/fabric
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.5.1'
      - name: Reject mutable Fabric build tooling
        run: '! grep -Ei "^loom_version=.*SNAPSHOT" gradle.properties'
      - name: Build Fabric bridge
        run: gradle build --stacktrace
      - name: Stage Fabric jar and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          jar="$(find build/libs -maxdepth 1 -type f -name 'swarmcraft-fabric-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar"
          cp "$jar" ../../dist/
          (cd ../../dist && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-release-${{ github.sha }}
          path: |
            dist/*.jar
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [validation, release-policy, linux, windows, macos, fabric]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-release-${{ github.sha }}'
          path: dist
          merge-multiple: true
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find dist -type f -exec cp {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          ls -la release-assets
      - name: Publish exact validated production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "SwarmCraft $GITHUB_REF_NAME"
