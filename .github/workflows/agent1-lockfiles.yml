name: Agent 1 Desktop Diagnostic

on:
  pull_request:
    branches: [backup/local-work-20260824]

permissions:
  contents: read

jobs:
  diagnose-desktop:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Regenerate required lockfiles for diagnosis
        run: |
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Desktop Tauri check
        id: desktop_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check \
            --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --all-features \
            --locked 2>&1 | tee desktop-tauri-check.log

      - name: Upload Desktop compiler diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-desktop-tauri-check
          path: desktop-tauri-check.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when Desktop check failed
        if: steps.desktop_check.outcome == 'failure'
        run: exit 1
