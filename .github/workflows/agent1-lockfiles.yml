name: Agent 1 Prepare Validation Fixes

on:
  pull_request:
    branches: [backup/local-work-20260824]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Factor mock response queue type
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/swarm-catalog/src/lib.rs')
          text = path.read_text()
          old = '''    #[derive(Clone)]
              struct MockTransport {
                  calls: Arc<AtomicUsize>,
                  responses: Arc<Mutex<VecDeque<Result<Vec<u8>, CatalogError>>>>,
              }
          '''
          new = '''    type MockResponseQueue = Arc<Mutex<VecDeque<Result<Vec<u8>, CatalogError>>>>;

              #[derive(Clone)]
              struct MockTransport {
                  calls: Arc<AtomicUsize>,
                  responses: MockResponseQueue,
              }
          '''
          if old not in text:
              raise SystemExit('expected MockTransport definition not found; refusing broad rewrite')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Generate exact formatting and lockfiles
        run: |
          cargo fmt --all
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit generated validation fixes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            Cargo.lock \
            apps/desktop/src-tauri/Cargo.lock \
            crates/swarm-catalog/src/lib.rs \
            crates/swarm-catalog/tests/live_sources.rs
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No generated fixes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(agent1): satisfy current Rust validation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
