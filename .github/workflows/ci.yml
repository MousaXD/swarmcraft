name: Core CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked

  acceptance:
    name: Acceptance (process-level)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Peer networking hard reconnect
        run: cargo test -p swarm-network --test peer_networking_acceptance --locked
      - name: Hostile network input remains nonfatal
        run: cargo test -p swarm-network --test input_hardening --locked
      - name: Network handshake hardening
        run: cargo test -p swarm-network --test handshake_hardening --locked
      - name: Snapshot swarm reconstruction
        run: cargo test -p swarm-storage --test snapshot_swarm_acceptance --locked
      - name: Publication ownership + replica + GC + retention race
        run: cargo test -p swarm-storage --test publication_ownership_race --locked
      - name: Storage failure injection
        run: cargo test -p swarm-storage --test failure_injection --locked
      - name: Existing-world import journey
        run: cargo test -p swarm-cli world_import --lib --locked
      - name: Sleep/wake direct launch guard regressions
        run: cargo test -p swarm-cli launch_guard::tests --lib --locked
      - name: Standby corrupt-sleep regression
        run: cargo test -p swarm-cli --bin swarmcraft-host standby_wait_until_ready_rejects_corrupt_sleep_record_before_host_launch --locked
      - name: Migration corrupt-sleep regression
        run: cargo test -p swarm-cli --test sleep_state_fail_closed --locked
      - name: Host Readiness negative matrix and two-member quorum fail-closed
        run: cargo test -p swarm-cli host_readiness::tests --lib --locked
      - name: Live join replication
        run: cargo test -p swarm-cli --test live_join_replication --locked
      - name: Host process lifecycle
        run: cargo test -p swarm-cli --test host_process --locked
      - name: Migration orchestration
        run: cargo test -p swarm-cli --test migration_core --locked
      - name: Runtime setup failure hardening
        run: cargo test -p swarm-cli --test runtime_setup_hardening --locked
      - name: Three-daemon recovery
        run: cargo test -p swarm-cli --test three_daemon_recovery --locked
      - name: Recovery successor dies before epoch promotion
        run: cargo test -p swarm-cli --test recovery_successor_dies --locked
      - name: Solo history acceptance and divergence detection
        run: cargo test -p swarm-consensus --test solo_history_acceptance --locked

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Smoke signed canonical record decoders
        run: cargo fuzz run --fuzz-dir fuzz canonical_records -- -max_total_time=20

  network-impairment:
    name: Network impairment (QUIC resume)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Compile interrupted transfer gate
        run: cargo test -p swarm-network --test network_transfer_soak --locked --no-run
      - name: Apply WAN-like loopback impairment
        run: |
          set -euxo pipefail
          command -v tc
          sudo tc qdisc replace dev lo root netem delay 12ms 4ms distribution normal loss 0.5% rate 100mbit
          tc qdisc show dev lo
      - name: Interrupted QUIC transfer with lost acknowledgements
        run: cargo test -p swarm-network --test network_transfer_soak interrupted_quic_transfer_resumes_after_lost_ack --locked -- --ignored --nocapture
      - name: Remove loopback impairment
        if: always()
        run: sudo tc qdisc del dev lo root || true

  desktop-rust:
    name: Desktop + provider direct gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
            crates/swarm-provider -> target
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify Desktop lockfile is current
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Format excluded Rust crates
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo fmt --manifest-path crates/swarm-provider/Cargo.toml -- --check
      - name: Build and stage required Tauri sidecars
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p swarm-cli --locked
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/swarmcraft "apps/desktop/src-tauri/binaries/swarmcraft-$target"
          cp target/release/swarmcraft-host "apps/desktop/src-tauri/binaries/swarmcraft-host-$target"
          cp target/release/swarmcraft-runtime "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target"
          cp target/release/swarmcraft-import "apps/desktop/src-tauri/binaries/swarmcraft-import-$target"
      - name: Desktop check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Desktop clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Desktop tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Provider check
        run: cargo check --manifest-path crates/swarm-provider/Cargo.toml
      - name: Provider clippy
        run: cargo clippy --manifest-path crates/swarm-provider/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Provider tests
        run: cargo test --manifest-path crates/swarm-provider/Cargo.toml --all-features

  desktop:
    name: Desktop package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            bundle: deb,appimage
          - os: windows-latest
            label: windows
            bundle: nsis
          - os: macos-latest
            label: macos-arm64
            bundle: dmg
          - os: macos-15-intel
            label: macos-x86_64
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Frontend Desktop tests
        if: runner.os == 'Linux'
        run: node --test apps/desktop/tests/*.test.mjs
      - name: Validate Tauri frontend bridge
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('apps/desktop/src-tauri/tauri.conf.json').read_text())
          frontend = Path('apps/desktop/src/app.js').read_text()

          assert 'window.__TAURI__' in frontend, 'desktop frontend no longer uses the expected Tauri global API'
          assert config.get('app', {}).get('withGlobalTauri') is True, (
              'apps/desktop/src/app.js uses window.__TAURI__, so tauri.conf.json must set '
              'app.withGlobalTauri=true'
          )
          PY
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Verify Desktop lockfile is current
        shell: bash
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build bundled runtimes
        run: cargo build --release -p swarm-cli --locked
      - name: Stage Unix sidecars
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/swarmcraft "apps/desktop/src-tauri/binaries/swarmcraft-$target"
          cp target/release/swarmcraft-host "apps/desktop/src-tauri/binaries/swarmcraft-host-$target"
          cp target/release/swarmcraft-runtime "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target"
          cp target/release/swarmcraft-import "apps/desktop/src-tauri/binaries/swarmcraft-import-$target"
          "apps/desktop/src-tauri/binaries/swarmcraft-$target" --version
          "apps/desktop/src-tauri/binaries/swarmcraft-host-$target" --version
          "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target" --version
          "apps/desktop/src-tauri/binaries/swarmcraft-import-$target" --version
      - name: Stage Windows sidecars
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item target/release/swarmcraft.exe "apps/desktop/src-tauri/binaries/swarmcraft-$target.exe"
          Copy-Item target/release/swarmcraft-host.exe "apps/desktop/src-tauri/binaries/swarmcraft-host-$target.exe"
          Copy-Item target/release/swarmcraft-runtime.exe "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target.exe"
          Copy-Item target/release/swarmcraft-import.exe "apps/desktop/src-tauri/binaries/swarmcraft-import-$target.exe"
      - name: Build native desktop package
        working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundle }} --ci
      - name: Upload native packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swarmcraft-desktop-${{ matrix.label }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  fabric:
    name: Fabric server mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft/fabric
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.5.1'
      - name: Reject mutable Fabric build tooling
        run: '! grep -Ei "^loom_version=.*SNAPSHOT" gradle.properties'
      - name: Build Fabric mod
        run: gradle build --stacktrace
      - name: Verify released Fabric artifact embeds Fabric API
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          jars = [path for path in glob.glob('build/libs/*.jar') if '-sources' not in path]
          assert jars, 'Fabric build produced no release JAR'
          with zipfile.ZipFile(jars[0]) as archive:
              nested = [
                  name for name in archive.namelist()
                  if name.startswith('META-INF/jars/') and 'fabric-api' in name.lower() and name.endswith('.jar')
              ]
          assert nested, 'released SwarmCraft Fabric JAR does not embed Fabric API under META-INF/jars'
          print('Embedded Fabric API:', ', '.join(nested))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swarmcraft-fabric
          path: minecraft/fabric/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Verify committed root lockfile is current
        run: cargo metadata --locked --format-version 1 > /dev/null
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  desktop-dependency-audit:
    name: Desktop Rust dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Verify committed Desktop lockfile is current
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 > /dev/null
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: apps/desktop/src-tauri
