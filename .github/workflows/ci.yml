name: Core CI (metadata only)

# Sole automatic workflow: deliberately cheap, no test/build matrix,
# dependency installation, live-service probes, or artifact generation.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: core-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR/main metadata gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check workflow policy and release metadata
        run: |
          python3 scripts/check_workflow_policy.py
          python3 scripts/check_release_version.py
