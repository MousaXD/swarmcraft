name: Agent 4 FINAL-028 Exact Head Closure

on:
  push:
    branches:
      - fix/agent-4-network

permissions:
  contents: write

concurrency:
  group: agent4-final028-exact-head
  cancel-in-progress: false

env:
  INTEGRATION_ANCESTOR: c9252820a560e6ed4d30bb77227e3a494c6ce869

jobs:
  materialize-final-source:
    if: startsWith(github.event.head_commit.message, 'ci(agent4)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert pristine bootstrap head
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$INTEGRATION_ANCESTOR" HEAD
          test -z "$(git status --short)"
      - name: Materialize direct production and permanent regression source once
        run: |
          python .github/agent4_finalize_source.py
          python .github/agent4_finalize_source_v2.py
      - name: Format direct source
        run: cargo fmt --all
      - name: Prove only Agent 4 production and permanent regression files changed
        run: |
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            'crates/swarm-cli/src/daemon.rs' \
            'crates/swarm-cli/src/discovery.rs' \
            'crates/swarm-cli/tests/discovery_freshness.rs' \
            'crates/swarm-cli/tests/discovery_network_freshness.rs' \
            'crates/swarm-consensus/src/membership.rs' \
            'crates/swarm-core/src/discovery.rs' \
            'crates/swarm-network/src/wire.rs' \
            'crates/swarm-protocol/src/discovery.rs' | sort)"
          test "$changed" = "$expected"
      - name: Fast format gate
        run: cargo fmt --all -- --check
      - name: Fast workspace all-target check
        run: cargo check --workspace --all-targets --locked
      - name: Fast strict clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Focused protocol freshness
        run: cargo test -p swarm-protocol --locked discovery
      - name: Focused core freshness
        run: cargo test -p swarm-core --locked discovery
      - name: Focused joint quorum
        run: cargo test -p swarm-consensus --locked membership
      - name: Focused FINAL-028 verifier suite
        run: cargo test -p swarm-cli --test discovery_freshness --locked -- --nocapture
      - name: Durable recovery-promise freshness transition
        run: cargo test -p swarm-cli --lib --locked durable_recovery_promise_fences_stale_freshness_and_current_majority_recovers -- --nocapture
      - name: Network browse and exact-resolve adversarial freshness
        run: cargo test -p swarm-cli --test discovery_network_freshness --locked -- --nocapture
      - name: Commit normal production milestone only after focused gates pass
        run: |
          git config user.name "swarmcraft-agent4"
          git config user.email "agent4@users.noreply.github.com"
          git add \
            crates/swarm-cli/src/daemon.rs \
            crates/swarm-cli/src/discovery.rs \
            crates/swarm-cli/tests/discovery_freshness.rs \
            crates/swarm-cli/tests/discovery_network_freshness.rs \
            crates/swarm-consensus/src/membership.rs \
            crates/swarm-core/src/discovery.rs \
            crates/swarm-network/src/wire.rs \
            crates/swarm-protocol/src/discovery.rs
          git commit -m "fix(agent4): finalize FINAL-028 production tree"
          git push origin HEAD:fix/agent-4-network
          test -z "$(git status --short)"
          echo "Production candidate: $(git rev-parse HEAD)"

  linux-exact-head:
    if: startsWith(github.event.head_commit.message, 'fix(agent4)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exact SHA and clean tree at start
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$INTEGRATION_ANCESTOR" HEAD
          test -z "$(git status --short)"
      - name: Locked metadata
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          (cd apps/desktop/src-tauri && cargo metadata --locked --format-version 1 >/dev/null)
      - name: Workspace format
        run: cargo fmt --all -- --check
      - name: Workspace check all targets locked
        run: cargo check --workspace --all-targets --locked
      - name: Workspace strict clippy all targets locked
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Network protocol core storage consensus and CLI suites
        run: |
          cargo test -p swarm-network --locked
          cargo test -p swarm-protocol --locked
          cargo test -p swarm-core --locked
          cargo test -p swarm-storage --locked
          cargo test -p swarm-consensus --locked
          cargo test -p swarm-cli --lib --bins --locked
      - name: FINAL-028 pure and network freshness suites
        run: |
          cargo test -p swarm-cli --test discovery_freshness --locked -- --nocapture
          cargo test -p swarm-cli --test discovery_network_freshness --locked -- --nocapture
          cargo test -p swarm-cli --lib --locked durable_recovery_promise_fences_stale_freshness_and_current_majority_recovers -- --nocapture
      - name: Connection-bound handshake captured replay and hostile input
        run: |
          cargo test -p swarm-network --test peer_networking_acceptance --locked
          cargo test -p swarm-network --test input_hardening --locked
      - name: Invite DNS address and privacy regressions
        run: |
          cargo test -p swarm-network --locked invite
          cargo test -p swarm-cli --lib --locked friend
      - name: Agent 1 partition membership invite and recovery campaigns
        run: |
          cargo test -p swarm-cli --test consensus_partition_safety --locked -- --nocapture
          cargo test -p swarm-cli --test live_join_replication --locked
          cargo test -p swarm-cli --test automatic_invite_join --locked
          cargo test -p swarm-cli --test three_daemon_recovery --locked
          cargo test -p swarm-cli --test recovery_successor_dies --locked
      - name: Agent 2 direct history stale authority and canonical semantics
        run: |
          cargo test -p swarm-storage --test membership_history --locked
          cargo test -p swarm-core --test protocol_version_fail_closed --locked
          cargo test -p swarm-protocol --test canonical_semantics --locked
          cargo test -p swarm-cli --test migration_core --locked
      - name: Agent 3 canonical head immutable slot process promise and stale fence
        run: |
          cargo test -p swarm-storage --test storage_integrity --locked -- --nocapture
          cargo test -p swarm-storage --test publication_ownership_race --locked -- --nocapture
      - name: Impaired QUIC lost-ACK restart recovery
        run: cargo test -p swarm-network --test network_transfer_soak --locked -- --nocapture
      - name: Compile all CLI integration targets
        run: cargo test -p swarm-cli --tests --no-run --locked
      - name: Exact SHA and clean tree at end
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"

  windows-proof-portability:
    if: startsWith(github.event.head_commit.message, 'fix(agent4)')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exact SHA and clean tree at start
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - name: Freshness serialization canonical signing proof bounds and verifier
        run: |
          cargo test -p swarm-protocol --locked discovery
          cargo test -p swarm-core --locked discovery
          cargo test -p swarm-consensus --locked membership
          cargo test -p swarm-cli --test discovery_freshness --locked
          cargo test -p swarm-cli --test discovery_network_freshness --no-run --locked
      - name: Exact SHA and clean tree at end
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"

  macos-proof-portability:
    if: startsWith(github.event.head_commit.message, 'fix(agent4)')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Exact SHA and clean tree at start
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
      - name: Freshness serialization canonical signing proof bounds and verifier
        run: |
          cargo test -p swarm-protocol --locked discovery
          cargo test -p swarm-core --locked discovery
          cargo test -p swarm-consensus --locked membership
          cargo test -p swarm-cli --test discovery_freshness --locked
          cargo test -p swarm-cli --test discovery_network_freshness --no-run --locked
      - name: Exact SHA and clean tree at end
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
