name: One-shot live join formatter

on:
  push:
    branches: [feat/runtime-release]
    paths: ['.github/workflows/format-live-join.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-release
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format exact test file
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          git diff -- crates/swarm-cli/tests/live_join_replication.rs
          git config user.name 'MousaXD'
          git config user.email '101021011+MousaXD@users.noreply.github.com'
          git add crates/swarm-cli/tests/live_join_replication.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(runtime): format live join replication acceptance'
          git push origin HEAD:feat/runtime-release
