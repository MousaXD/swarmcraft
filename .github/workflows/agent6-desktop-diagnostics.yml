name: Agent 6 Desktop Diagnostics Validation

on:
  push:
    branches: [fix/agent-6-runtime]
    paths:
      - .github/workflows/agent6-desktop-diagnostics.yml
      - apps/desktop/src-tauri/src/runtime.rs
      - apps/desktop/src-tauri/src/runtime_commands.rs
      - apps/desktop/src-tauri/src/main.rs
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/Cargo.lock
      - crates/swarm-cli/tests/agent6_real_import.rs
      - crates/swarm-cli/tests/agent6_runtime_lifecycle.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Workspace format
        run: cargo fmt --all -- --check
      - name: Desktop format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Build sidecars for Desktop compile context
        run: |
          cargo build -p swarm-cli --locked
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/debug/swarmcraft "apps/desktop/src-tauri/binaries/swarmcraft-$target"
          cp target/debug/swarmcraft-host "apps/desktop/src-tauri/binaries/swarmcraft-host-$target"
          cp target/debug/swarmcraft-runtime "apps/desktop/src-tauri/binaries/swarmcraft-runtime-$target"
          cp target/debug/swarmcraft-import "apps/desktop/src-tauri/binaries/swarmcraft-import-$target"
      - name: Desktop locked check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Desktop diagnostics tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked runtime_diagnostics -- --nocapture
      - name: Desktop strict clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Verify clean source tree
        run: git diff --exit-code
