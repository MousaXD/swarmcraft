name: Decompression bound hardening helper

on:
  push:
    branches:
      - agent/production-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening
      - name: Bound decoded blobs by signed descriptor size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path('crates/swarm-storage/src/lib.rs')
          text = base.read_text()
          text = text.replace('    io::Write,\n', '    io::{Read, Write},\n', 1)
          old = '''        let bytes = match descriptor.encoding {\n            BlobEncoding::Raw => encoded,\n            BlobEncoding::Zstd => {\n                zstd::stream::decode_all(encoded.as_slice()).map_err(|_| StorageError::BlobCorrupt(descriptor.hash))?\n            }\n        };'''
          new = '''        let bytes = match descriptor.encoding {\n            BlobEncoding::Raw => encoded,\n            BlobEncoding::Zstd => {\n                let decoder = zstd::stream::read::Decoder::new(encoded.as_slice())\n                    .map_err(|_| StorageError::BlobCorrupt(descriptor.hash))?;\n                let mut reader = decoder.take(descriptor.uncompressed_size.saturating_add(1));\n                let mut decoded = Vec::new();\n                reader\n                    .read_to_end(&mut decoded)\n                    .map_err(|_| StorageError::BlobCorrupt(descriptor.hash))?;\n                decoded\n            }\n        };'''
          if old not in text:
              raise SystemExit('legacy read_blob decode block not found')
          base.write_text(text.replace(old, new, 1))

          streaming = Path('crates/swarm-storage/src/streaming.rs')
          text = streaming.read_text()
          old_restore_loop = '''        hasher.update(&buffer[..read]);\n        temporary_file.write_all(&buffer[..read]).map_err(|error| io_error(&temporary_path, error))?;\n        total = total.saturating_add(read as u64);'''
          new_restore_loop = '''        let next_total = total.checked_add(read as u64).ok_or(StorageError::BlobCorrupt(descriptor.hash))?;\n        if next_total > descriptor.uncompressed_size {\n            drop(temporary_file);\n            remove_if_present(&temporary_path)?;\n            return Err(StorageError::BlobCorrupt(descriptor.hash));\n        }\n        hasher.update(&buffer[..read]);\n        temporary_file.write_all(&buffer[..read]).map_err(|error| io_error(&temporary_path, error))?;\n        total = next_total;'''
          if old_restore_loop not in text:
              raise SystemExit('restore decode loop not found')
          text = text.replace(old_restore_loop, new_restore_loop, 1)

          old_verify_loop = '''        hasher.update(&buffer[..read]);\n        total = total.saturating_add(read as u64);'''
          new_verify_loop = '''        let next_total = total.checked_add(read as u64).ok_or(StorageError::BlobCorrupt(descriptor.hash))?;\n        if next_total > descriptor.uncompressed_size {\n            return Err(StorageError::BlobCorrupt(descriptor.hash));\n        }\n        hasher.update(&buffer[..read]);\n        total = next_total;'''
          if old_verify_loop not in text:
              raise SystemExit('verify decode loop not found')
          streaming.write_text(text.replace(old_verify_loop, new_verify_loop, 1))

          tests = Path('crates/swarm-storage/tests/failure_injection.rs')
          text = tests.read_text()
          text = text.replace(
              'use swarm_protocol::{snapshot_state_root, Hash32, PeerId, WorldId};',
              'use swarm_protocol::{snapshot_state_root, BlobDescriptor, BlobEncoding, Hash32, PeerId, WorldId};',
              1,
          )
          marker = '''#[test]\nfn filesystem_shape_error_is_reported_as_io_failure_without_panicking() {'''
          added = '''#[test]\nfn compressed_blob_larger_than_declared_size_is_rejected() {\n    let temp = tempfile::tempdir().unwrap();\n    let storage = Storage::open(temp.path().join("store")).unwrap();\n    let world = WorldId([6; 32]);\n    let hash = Hash32([0x44; 32]);\n    let expanded = vec![0x5a; 8 * 1024 * 1024];\n    let encoded = zstd::stream::encode_all(expanded.as_slice(), 3).unwrap();\n    let descriptor = BlobDescriptor {\n        hash,\n        uncompressed_size: 64,\n        encoded_size: encoded.len() as u64,\n        encoding: BlobEncoding::Zstd,\n    };\n    let blob_dir = storage.world_dir(world).join("blobs");\n    fs::create_dir_all(&blob_dir).unwrap();\n    fs::write(blob_dir.join(format!("{}.zst", hash.to_hex())), encoded).unwrap();\n\n    assert!(matches!(\n        storage.verify_blob_streaming(world, &descriptor),\n        Err(StorageError::BlobCorrupt(actual)) if actual == hash\n    ));\n    assert!(matches!(\n        storage.read_blob(world, &descriptor),\n        Err(StorageError::BlobCorrupt(actual)) if actual == hash\n    ));\n}\n\n#[test]\nfn filesystem_shape_error_is_reported_as_io_failure_without_panicking() {'''
          if marker not in text:
              raise SystemExit('failure injection marker not found')
          tests.write_text(text.replace(marker, added, 1))
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Test storage failure injection
        run: cargo test -p swarm-storage --test failure_injection --locked
      - name: Clippy storage
        run: cargo clippy -p swarm-storage --all-targets --all-features --locked -- -D warnings
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-storage/src/lib.rs crates/swarm-storage/src/streaming.rs crates/swarm-storage/tests/failure_injection.rs
          git commit -m "fix(storage): bound blob decompression"
          git push origin HEAD:agent/production-hardening
