name: Refresh v0.2.0 lockfile

on:
  push:
    branches:
      - fix/v0.2.0-version-metadata

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Update SwarmCraft package versions in Cargo.lock
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('Cargo.lock')
          text = path.read_text()
          owned = {
              'swarm-cli',
              'swarm-consensus',
              'swarm-core',
              'swarm-ipc',
              'swarm-network',
              'swarm-protocol',
              'swarm-storage',
          }
          parts = text.split('[[package]]')
          seen = set()
          for index in range(1, len(parts)):
              block = parts[index]
              name = re.search(r'\nname = "([^"]+)"', block)
              if not name or name.group(1) not in owned:
                  continue
              seen.add(name.group(1))
              block, count = re.subn(
                  r'\nversion = "[^"]+"',
                  '\nversion = "0.2.0"',
                  block,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'could not update version for {name.group(1)}')
              parts[index] = block
          missing = owned - seen
          if missing:
              raise SystemExit(f'missing workspace packages: {sorted(missing)}')
          path.write_text('[[package]]'.join(parts))
      - name: Verify locked metadata
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'fix: refresh lockfile for 0.2.0'
          git push origin HEAD:fix/v0.2.0-version-metadata
