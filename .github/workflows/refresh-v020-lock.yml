name: Refresh v0.2.0 lockfile

on:
  push:
    branches:
      - fix/v0.2.0-version-metadata

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfile metadata
        run: cargo metadata --format-version 1 --no-deps > /dev/null
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'fix: refresh lockfile for 0.2.0'
          git push origin HEAD:fix/v0.2.0-version-metadata
