name: Protocol fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 3'

permissions:
  contents: read

jobs:
  canonical-records:
    name: Canonical record parsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz signed canonical record decoders
        run: cargo fuzz run --fuzz-dir fuzz canonical_records -- -max_total_time=300
