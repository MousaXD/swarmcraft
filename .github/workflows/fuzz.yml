name: Protocol fuzz

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 3'

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  canonical-records-pr-smoke:
    name: Canonical record fuzz smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build canonical record fuzz target
        run: cargo fuzz build --fuzz-dir fuzz canonical_records

  canonical-records:
    name: Canonical record parsers
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz signed canonical record decoders
        run: cargo fuzz run --fuzz-dir fuzz canonical_records -- -max_total_time=300
