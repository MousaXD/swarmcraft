name: Agent 4 handshake milestone

on:
  push:
    branches: [fix/agent-4-network]
    paths:
      - implementation/agent4-handshake-runner.py
      - .github/workflows/agent4-handshake-runner.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact milestone seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/agent-4-network
          fetch-depth: 0

      - name: Apply connection-bound handshake change
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("implementation/agent4-handshake-runner.py")
          text = path.read_text()
          old = '''replace_once(
              "crates/swarm-cli/src/discovery.rs",
              "let mut node = DiscoveryNode::new(generate_transport_key(), hello)?;",
              "let mut node = DiscoveryNode::new(generate_transport_key(), hello, identity.network_signing_key())?;",
          )'''
          new = '''path = "crates/swarm-cli/src/discovery.rs"
          text = read(path)
          old = "let mut node = DiscoveryNode::new(generate_transport_key(), hello)?;"
          new = "let mut node = DiscoveryNode::new(generate_transport_key(), hello, identity.network_signing_key())?;"
          count = text.count(old)
          if count != 3:
              raise SystemExit(f"{path}: expected three discovery constructor targets, found {count}")
          write(path, text.replace(old, new))'''
          if text.count(old) != 1:
              raise SystemExit("handshake runner constructor patch shape changed")
          path.write_text(text.replace(old, new, 1))
          PY
          python implementation/agent4-handshake-runner.py 2>&1 | tee implementation/agent4-handshake-apply.log
          python - <<'PY' 2>&1 | tee -a implementation/agent4-handshake-apply.log
          from pathlib import Path
          path = Path("crates/swarm-cli/src/daemon.rs")
          text = path.read_text()
          old = '        WireRequest::Hello(_) => return Err(anyhow!("PeerHello is handled by the network authentication layer")),\n'
          new = '''        WireRequest::Hello(_)
          | WireRequest::HelloChallenge { .. }
          | WireRequest::HelloProof(_) => {
              return Err(anyhow!("application handshake requests are handled by the network authentication layer"));
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("daemon handshake catch-all shape changed")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee implementation/agent4-handshake-format.log
          cargo fmt --all -- --check 2>&1 | tee -a implementation/agent4-handshake-format.log

      - name: Compile affected crates
        shell: bash
        run: |
          set -o pipefail
          cargo check -p swarm-network -p swarm-cli --all-targets --locked 2>&1 | tee implementation/agent4-handshake-check.log

      - name: Network tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p swarm-network --locked 2>&1 | tee implementation/agent4-handshake-tests.log

      - name: Commit validated milestone
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm implementation/agent4-handshake-runner.py .github/workflows/agent4-handshake-runner.yml
          rm -f implementation/agent4-handshake-*.log
          git config user.name "swarmcraft-agent-4"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(network): bind application auth to live connections"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/agent-4-network

      - name: Preserve failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "# Agent 4 handshake milestone failure"
            echo
            echo "Seed: ${GITHUB_SHA}"
            for file in implementation/agent4-handshake-apply.log implementation/agent4-handshake-format.log implementation/agent4-handshake-check.log implementation/agent4-handshake-tests.log; do
              if [ -f "$file" ]; then
                echo
                echo "## $file"
                echo '```text'
                tail -n 400 "$file"
                echo '```'
              fi
            done
          } > implementation/agent4-handshake-failure.log
          rm -f implementation/agent4-handshake-apply.log implementation/agent4-handshake-format.log implementation/agent4-handshake-check.log implementation/agent4-handshake-tests.log
          git config user.name "swarmcraft-agent-4"
          git config user.email "actions@users.noreply.github.com"
          git add -f implementation/agent4-handshake-failure.log
          git commit -m "chore(agent4): preserve handshake validation failure" || exit 0
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/agent-4-network
