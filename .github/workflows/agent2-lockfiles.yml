name: Agent 2 lockfile regeneration

on:
  pull_request:
    branches: [backup/local-work-20260824]

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.head_ref == 'agent/modrinth-provider'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh lockfiles with existing resolution where possible
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps > /dev/null
          cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 --no-deps > /dev/null
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 --no-deps > /dev/null
      - name: Commit refreshed lockfiles and retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent2-lockfiles.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock apps/desktop/src-tauri/Cargo.lock .github/workflows/agent2-lockfiles.yml
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Agent 2 lockfiles"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
