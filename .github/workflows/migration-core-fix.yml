name: Migration Core Fix

on:
  push:
    branches: [agent/migration-core]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migration-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply migration lifecycle patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_migration_core_fix.py
          python3 /tmp/apply_migration_core_fix.py
      - name: Format source
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Migration core focused
        run: cargo test -p swarm-cli --test migration_core --locked -- --nocapture
      - name: Three daemon recovery
        run: cargo test -p swarm-cli --test three_daemon_recovery --locked -- --nocapture
      - name: Host process migration
        run: cargo test -p swarm-cli --test host_process --locked -- --nocapture
      - name: Consensus manual migration
        run: cargo test -p swarm-consensus --test migration --locked -- --nocapture
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace all targets
        run: cargo test --workspace --all-targets --locked
      - name: Commit verified migration fix
        shell: bash
        run: |
          git config user.name 'swarmcraft-migration-core'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add crates/swarm-cli/src/migration.rs crates/swarm-cli/tests/migration_core.rs crates/swarm-cli/tests/three_daemon_recovery.rs docs/MIGRATION_RUNTIME.md
          git commit -m 'fix(migration): retire superseded transfer generations'
          git push origin HEAD:agent/migration-core
