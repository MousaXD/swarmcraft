name: Temporary security lockfile refresh

on:
  push:
    branches:
      - cert-03/security-lock-refresh

permissions:
  contents: read

jobs:
  refresh:
    name: Generate patched lockfiles without write permission
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
      - name: Update vulnerable packages in both separate Cargo lock graphs
        shell: bash
        run: |
          set -euo pipefail
          for manifest in Cargo.toml apps/desktop/src-tauri/Cargo.toml; do
            lock="$(dirname "$manifest")/Cargo.lock"
            while read -r name version; do
              if grep -q "name = \"$name\"" "$lock"; then
                echo "Updating $name to $version in $manifest"
                cargo update --manifest-path "$manifest" --package "$name" --precise "$version"
              fi
            done <<'PATCHES'
          ctutils 0.4.4
          quinn-proto 0.11.18
          rustls 0.23.46
          rustls-webpki 0.103.16
          webpki-roots 1.0.10
          zstd 0.13.4
          zstd-safe 7.4.0
          zstd-sys 2.1.2
          tokio 1.53.3
          PATCHES
            cargo metadata --manifest-path "$manifest" --locked --format-version 1 >/dev/null
          done
      - name: Print root lockfile for GitHub API import
        shell: bash
        run: |
          set -euo pipefail
          echo '__SWARMCRAFT_ROOT_LOCK_BEGIN__'
          base64 -w 76 Cargo.lock
          echo '__SWARMCRAFT_ROOT_LOCK_END__'
          sha256sum Cargo.lock
      - name: Print desktop lockfile for GitHub API import
        shell: bash
        run: |
          set -euo pipefail
          echo '__SWARMCRAFT_DESKTOP_LOCK_BEGIN__'
          base64 -w 76 apps/desktop/src-tauri/Cargo.lock
          echo '__SWARMCRAFT_DESKTOP_LOCK_END__'
          sha256sum apps/desktop/src-tauri/Cargo.lock
