name: Agent 1 partition and convergence hardening

on:
  push:
    branches:
      - fix/agent-1-consensus
    paths:
      - implementation/agent1-m4-hardening.py
      - implementation/agent1-m4-fixture-policy.py
      - crates/swarm-cli/tests/consensus_partition_safety.rs
      - .github/workflows/agent1-m4-worker.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/agent-1-consensus
          fetch-depth: 0

      - name: Refresh transformation targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("implementation/agent1-m4-hardening.py")
          text = p.read_text()
          text = text.replace(
              'bail!("committed transfer no longer advances the current authority generation");',
              'bail!("committed transfer no longer extends the accepted authority generation");',
          )
          old = '''replace(
              migration,
              ''' + "'''" + '''    if next.epoch_number != current.epoch_number.saturating_add(1)
                  || next.fencing_token != current.fencing_token.saturating_add(1)
                  || next.previous_epoch_hash != Some(epoch_record_hash(&current)?)
              {
                  bail!("observed epoch does not directly advance the local accepted generation");
              }
          ''' + "'''" + ''',
              ''' + "'''" + '''    let expected_generation = AuthorityGeneration {
                  epoch: current.epoch_number,
                  fencing_token: current.fencing_token,
              }
              .checked_next()
              .context("accepted authority generation is exhausted")?;
              if next.epoch_number != expected_generation.epoch
                  || next.fencing_token != expected_generation.fencing_token
                  || next.previous_epoch_hash != Some(epoch_record_hash(&current)?)
              {
                  bail!("observed epoch does not directly advance the local accepted generation");
              }
          ''' + "'''" + ''',
          )'''
          new = '''replace(
              migration,
              ''' + "'''" + '''    if transfer.phase != TransferPhase::Committed
                  || transfer.from_peer_id != current.authority_peer_id
                  || transfer.to_peer_id != next.authority_peer_id
                  || transfer.next_epoch != next.epoch_number
                  || transfer.next_fencing_token != next.fencing_token
                  || next.epoch_number != current.epoch_number.saturating_add(1)
                  || next.fencing_token != current.fencing_token.saturating_add(1)
                  || next.previous_epoch_hash != Some(epoch_record_hash(&current)?)
              {
                  bail!("manual epoch does not exactly extend the committed transfer");
              }
          ''' + "'''" + ''',
              ''' + "'''" + '''    let expected_generation = AuthorityGeneration {
                  epoch: current.epoch_number,
                  fencing_token: current.fencing_token,
              }
              .checked_next()
              .context("accepted authority generation is exhausted")?;
              if transfer.phase != TransferPhase::Committed
                  || transfer.from_peer_id != current.authority_peer_id
                  || transfer.to_peer_id != next.authority_peer_id
                  || transfer.next_epoch != next.epoch_number
                  || transfer.next_fencing_token != next.fencing_token
                  || next.epoch_number != expected_generation.epoch
                  || next.fencing_token != expected_generation.fencing_token
                  || next.previous_epoch_hash != Some(epoch_record_hash(&current)?)
              {
                  bail!("manual epoch does not exactly extend the committed transfer");
              }
          ''' + "'''" + ''',
          )'''
          if old not in text:
              raise SystemExit("stale observe-manual-transfer transform block not found")
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Validate and apply hardening
        run: |
          python3 -m py_compile implementation/agent1-m4-hardening.py implementation/agent1-m4-fixture-policy.py
          python3 implementation/agent1-m4-hardening.py
          python3 implementation/agent1-m4-fixture-policy.py

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test consensus core
        run: cargo test -p swarm-consensus

      - name: Test CLI library
        run: cargo test -p swarm-cli --lib

      - name: Test live joint membership
        run: cargo test -p swarm-cli --test live_join_replication -- --nocapture

      - name: Test membership and Solo partition safety
        run: cargo test -p swarm-cli --test consensus_partition_safety -- --nocapture --test-threads=1

      - name: Test recovery certificate crash resume
        run: cargo test -p swarm-cli --test recovery_successor_dies -- --nocapture

      - name: Compile all CLI integration tests
        run: cargo test -p swarm-cli --tests --no-run

      - name: Commit validated hardening
        env:
          BRANCH: fix/agent-1-consensus
        run: |
          rm implementation/agent1-m4-hardening.py
          rm implementation/agent1-m4-fixture-policy.py
          rm .github/workflows/agent1-m4-worker.yml
          git add -A
          git config user.name "swarmcraft-agent-1"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(consensus): harden membership convergence and partitions"
          git push origin "HEAD:${BRANCH}"
