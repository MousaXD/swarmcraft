name: Agent 5 Finalize Symlink Fence

on:
  push:
    branches:
      - fix/agent-5-supply-chain
    paths:
      - .github/workflows/agent5-finalize-symlink.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Materialize permanent symlink regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/agent-5-supply-chain)"
          python .github/agent5_symlink_test.py
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Stage validation-only Tauri sidecars
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          for name in swarmcraft swarmcraft-host swarmcraft-runtime swarmcraft-import; do
            cp /bin/true "apps/desktop/src-tauri/binaries/${name}-${target}"
          done
      - name: Prove symlink fence
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked symlinked_staging_session_is_rejected
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Commit final production milestone
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent5-finalize-symlink.yml .github/agent5_symlink_test.py
          rm -rf apps/desktop/src-tauri/binaries
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          git add -A
          git config user.name "SwarmCraft Agent 5"
          git config user.email "101021011+MousaXD@users.noreply.github.com"
          git commit -m "test(provider): prove symlink staging fence"
          git push origin HEAD:fix/agent-5-supply-chain

# retrigger after correcting expected symlink rejection text
