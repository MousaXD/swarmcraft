          ci = Path('.github/workflows/ci.yml').read_text()
          live = Path('.github/workflows/player-journey-live.yml').read_text()
          assert 'agent/final-player-journey-gates' not in ci
          assert 'agent/final-player-journey-gates' not in live
          assert '- main' in live
          PY

      - name: Commit prepared release candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: prepare 0.4.0 main release candidate'
          git push origin HEAD:agent/main-release-readiness
