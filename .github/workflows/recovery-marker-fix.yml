name: Recovery marker fix

on:
  push:
    branches: [integration/player-launcher-v1]
    paths: [.github/workflows/recovery-marker-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/player-launcher-v1
          fetch-depth: 0
      - name: Correct one-shot patch marker and retrigger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/recovery-integration.yml')
          text = p.read_text()
          old = "marker = '\\n#[tauri::command(rename_all = \"camelCase\")]\\npub async fn curseforge_resolve(file_id:'"
          new = "marker = '\\n#[tauri::command(rename_all = \"camelCase\")]\\npub async fn curseforge_resolve('"
          if old not in text:
              raise SystemExit('expected CurseForge recovery marker not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/recovery-integration.yml
          git commit -m 'ci(recovery): fix CurseForge resolver insertion marker'
          git push origin HEAD:integration/player-launcher-v1
