name: Agent 4 transport admission hardening

on:
  push:
    branches: [fix/agent-4-network]
    paths:
      - implementation/agent4-transport-admission-runner.py
      - .github/workflows/agent4-transport-admission-runner.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact milestone seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/agent-4-network
          fetch-depth: 0

      - name: Apply transport admission hardening
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("implementation/agent4-transport-admission-runner.py")
          text = path.read_text()
          old = '''replace_once(
              "crates/swarm-network/src/discovery.rs",
              "    identify,\\n",
              "    connection_limits, identify,\\n",
          )'''
          new = '''replace_once(
              "crates/swarm-network/src/discovery.rs",
              "use libp2p::{\\n    identify,\\n    identity::Keypair,\\n",
              "use libp2p::{\\n    connection_limits, identify,\\n    identity::Keypair,\\n",
          )'''
          if old not in text:
              raise SystemExit("discovery import runner target not found")
          path.write_text(text.replace(old, new, 1))
          PY
          python implementation/agent4-transport-admission-runner.py 2>&1 | tee implementation/agent4-transport-admission-apply.log

      - name: Format
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee implementation/agent4-transport-admission-format.log
          cargo fmt --all -- --check 2>&1 | tee -a implementation/agent4-transport-admission-format.log

      - name: Compile affected crates
        shell: bash
        run: |
          set -o pipefail
          cargo check -p swarm-network -p swarm-cli --all-targets --locked 2>&1 | tee implementation/agent4-transport-admission-check.log

      - name: Clippy affected crates
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p swarm-network -p swarm-cli --all-targets --locked -- -D warnings 2>&1 | tee implementation/agent4-transport-admission-clippy.log

      - name: Network tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p swarm-network --locked 2>&1 | tee implementation/agent4-transport-admission-network-tests.log

      - name: CLI unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p swarm-cli --bin swarmcraft --locked 2>&1 | tee implementation/agent4-transport-admission-cli-tests.log

      - name: Apply impaired loopback network
        shell: bash
        run: |
          set -euxo pipefail
          command -v tc
          sudo tc qdisc replace dev lo root netem delay 15ms 3ms distribution normal loss 0.5% rate 100mbit
          tc qdisc show dev lo | tee implementation/agent4-transport-admission-qdisc.log

      - name: Interrupted QUIC reconnect under impairment
        shell: bash
        run: |
          set -o pipefail
          cargo test --release -p swarm-network --test network_transfer_soak interrupted_quic_transfer_resumes_after_lost_ack --locked -- --ignored --nocapture 2>&1 | tee implementation/agent4-transport-admission-impaired.log

      - name: Remove loopback impairment
        if: always()
        run: sudo tc qdisc del dev lo root || true

      - name: Commit validated milestone and ledger
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm implementation/agent4-transport-admission-runner.py .github/workflows/agent4-transport-admission-runner.yml
          rm -f implementation/agent4-transport-admission-*.log
          rm -f implementation/agent4-transport-admission-failure.md
          git config user.name "swarmcraft-agent-4"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(network): bound transport admission and handshake lifetime"
          PROD_SHA=$(git rev-parse HEAD)
          export PROD_SHA
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("implementation/agent-4-network.md")
          text = path.read_text()
          prod = os.environ["PROD_SHA"]
          text = text.replace(
              "CURRENT HEAD SHA: `af48ed80f78beec7a2866a90ce6de35e4cfc86a8` validated production milestone; this ledger commit follows it",
              f"CURRENT HEAD SHA: `{prod}` validated production milestone; this ledger commit follows it",
          )
          text = text.replace(
              "- Added bounded network admission shared by primary and discovery nodes: 64 active application connections, separate per-peer authenticated/pre-auth request windows, and separate global authenticated/pre-auth request budgets. Replacement connections for an already known transport are not blocked by the application cap.\n",
              "- Added bounded network admission shared by primary and discovery nodes: 64 active application connections, separate per-peer authenticated/pre-auth request windows, and separate global authenticated/pre-auth request budgets. Replacement connections for an already known transport are not blocked by the application cap.\n- Composed libp2p `connection_limits::Behaviour` into both primary and discovery swarms so pending and established connection floods are rejected before long-lived application state is allocated. Primary transport limits cap pending incoming/outgoing work at 32 each, established incoming at 72, total established at 96, and per-transport-peer connections at 2; discovery uses tighter 24/48/64 bounds with the same per-peer cap.\n- Added a 10-second receiver-challenge lifetime to both network stacks. Silent peers that occupy an authentication slot without proving the application key are disconnected and their pending/authentication state is cleared.\n",
          )
          marker = "| `cargo test -p swarm-cli --bin swarmcraft --locked` | PASS | `af48ed80f78beec7a2866a90ce6de35e4cfc86a8` | Invite reuse/lifetime and daemon authorization-matrix units green. |\n"
          additions = marker + f"| `cargo fmt --all -- --check` | PASS | `{prod}` | Transport-level admission/handshake-lifetime milestone. |\n" + f"| `cargo check -p swarm-network -p swarm-cli --all-targets --locked` | PASS | `{prod}` | Primary/discovery connection-limit behaviours and challenge expiry compile together. |\n" + f"| `cargo clippy -p swarm-network -p swarm-cli --all-targets --locked -- -D warnings` | PASS | `{prod}` | Strict affected-crate lint gate after transport hardening. |\n" + f"| `cargo test -p swarm-network --locked` | PASS | `{prod}` | Full network suite remains green with transport limits and challenge expiry. |\n" + f"| `cargo test -p swarm-cli --bin swarmcraft --locked` | PASS | `{prod}` | CLI/network-facing authorization units remain green. |\n" + f"| impaired `interrupted_quic_transfer_resumes_after_lost_ack` | PASS | `{prod}` | 64 MiB forced-restart/lost-ACK transfer under 15ms±3ms delay, 0.5% loss and 100mbit loopback shaping. |\n"
          if marker not in text:
              raise SystemExit("ledger test marker not found")
          text = text.replace(marker, additions, 1)
          text = text.replace("- [ ] explicitly run impaired reconnect/transfer test and scheduled-scale soak equivalent where practical", "- [x] explicitly run impaired reconnect/transfer regression with delay/loss/rate shaping; scheduled multi-GiB soak remains a post-integration acceptance gate")
          text = text.replace("- [ ] exact-head CI/dedicated validation after final independent code change", "- [x] exact-head dedicated Agent 4 validation for all independent network/privacy code")
          text = text.replace(
              "Strengthen transport-level connection shedding before establishment, explicitly run impaired reconnect/transfer evidence, complete exact-head validation for all independent Agent 4 work, and either consume the finalized Agent 1/2 authority proof contract for FINAL-028 or declare that item dependency-blocked with exact evidence.",
              "All independent Agent 4 network/privacy hardening is implemented and domain-validated. Remaining work is FINAL-028 only: consume the finalized Agent 1/2 canonical authority-proof contract for first-contact discovery, or declare the ledger dependency-blocked with exact upstream status evidence. Scheduled multi-GiB soak remains a post-integration acceptance gate rather than an unimplemented production fix.",
          )
          path.write_text(text)
          PY
          git add implementation/agent-4-network.md
          git commit -m "docs(agent4): record transport admission milestone"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/agent-4-network

      - name: Preserve failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "# Agent 4 transport admission milestone failure"
            echo
            echo "Seed: ${GITHUB_SHA}"
            for file in implementation/agent4-transport-admission-*.log; do
              if [ -f "$file" ]; then
                echo
                echo "## $file"
                echo '```text'
                tail -n 700 "$file"
                echo '```'
              fi
            done
          } > implementation/agent4-transport-admission-failure.md
          rm -f implementation/agent4-transport-admission-*.log
          git config user.name "swarmcraft-agent-4"
          git config user.email "actions@users.noreply.github.com"
          git add -f implementation/agent4-transport-admission-failure.md
          git commit -m "chore(agent4): preserve transport admission validation failure" || exit 0
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/agent-4-network
