name: Migration Core Branch Maintenance

on:
  push:
    branches:
      - agent/migration-core

permissions:
  contents: write

jobs:
  patch-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migration-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed migration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/swarm-cli/src/migration.rs")
          text = path.read_text()

          old = "use serde::{Deserialize, Serialize};\n"
          assert text.count(old) == 1
          text = text.replace(old, "", 1)

          old = "use swarm_storage::{SnapshotContext, Storage};\n"
          new = (
              "use swarm_storage::{\n"
              "    serde::{Deserialize, Serialize},\n"
              "    serde_json, SnapshotContext, Storage,\n"
              "};\n"
          )
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = (
              "pub async fn run_authority_runtime(paths: &DataPaths, storage: &Storage, options: HostOptions) -> Result<()> {\n"
              "    run_authority_runtime_inner(paths, storage, options, MigrationTrigger::DirectHost, None, true).await\n"
              "}\n"
          )
          new = (
              "pub async fn run_authority_runtime(paths: &DataPaths, storage: &Storage, options: HostOptions) -> Result<()> {\n"
              "    let identity = PeerIdentity::load_or_create(paths)?;\n"
              "    let descriptor = storage.load_world_descriptor(options.world)?;\n"
              "    let member_count = descriptor.members.iter().filter(|member| !member.banned).count();\n"
              "    if member_count > 1 {\n"
              "        if storage.load_sleep_record(options.world).is_ok() {\n"
              "            bail!(\"multi-member sleeping worlds must be woken through the migration supervisor\");\n"
              "        }\n"
              "        let epoch = storage.load_epoch_record(options.world)?;\n"
              "        if epoch.authority_peer_id != identity.peer_id()\n"
              "            || epoch.authority_public_key != identity.public_key()\n"
              "        {\n"
              "            bail!(\"local peer does not hold the accepted authority generation\");\n"
              "        }\n"
              "        let config = RuntimeLaunchConfig {\n"
              "            java: options.java.clone(),\n"
              "            server_jar: options.server_jar.clone(),\n"
              "            mod_jar: options.mod_jar.clone(),\n"
              "            accept_eula: options.accept_eula,\n"
              "            game_endpoint: None,\n"
              "        };\n"
              "        if !wait_until_launch_safe(\n"
              "            paths,\n"
              "            storage,\n"
              "            &identity,\n"
              "            options.world,\n"
              "            &descriptor,\n"
              "            &epoch,\n"
              "            &config,\n"
              "        )\n"
              "        .await?\n"
              "        {\n"
              "            bail!(\"authority generation changed while waiting for launch safety\");\n"
              "        }\n"
              "    }\n"
              "    run_authority_runtime_inner(paths, storage, options, MigrationTrigger::DirectHost, None, true).await\n"
              "}\n"
          )
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Verify patch
        run: |
          git diff --check
          git status --short
      - name: Commit formatted backend changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/swarm-cli/src/migration.rs crates/swarm-cli/src/main.rs crates/swarm-cli/tests/migration_core.rs crates/swarm-storage/src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(migration): enforce launch safety and format"
            git push origin HEAD:agent/migration-core
          fi
