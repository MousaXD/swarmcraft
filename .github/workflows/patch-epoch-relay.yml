name: One-shot epoch relay patch

on:
  push:
    branches: [feat/runtime-release]
    paths:
      - '.github/workflows/patch-epoch-relay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-release
          fetch-depth: 0
      - name: Patch epoch relay authorization
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/swarm-cli/src/daemon.rs')
          source = path.read_text()
          old = '''fn authorize_epoch(storage: &Storage, sender: PeerId, record: &EpochRecordV1) -> Result<()> {
              if sender != record.authority_peer_id {
                  return Err(anyhow!("epoch sender is not the signed authority"));
              }
              authorize_member(storage, record.world_id, record.authority_peer_id)?;'''
          new = '''fn authorize_epoch(storage: &Storage, sender: PeerId, record: &EpochRecordV1) -> Result<()> {
              authorize_member(storage, record.world_id, sender)?;
              authorize_member(storage, record.world_id, record.authority_peer_id)?;'''
          if old not in source:
              raise SystemExit('expected authorize_epoch block not found')
          path.write_text(source.replace(old, new, 1))
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- crates/swarm-cli/src/daemon.rs
          git config user.name 'MousaXD'
          git config user.email '101021011+MousaXD@users.noreply.github.com'
          git add crates/swarm-cli/src/daemon.rs
          git commit -m 'fix(daemon): allow member relays of signed epochs'
          git push origin HEAD:feat/runtime-release
