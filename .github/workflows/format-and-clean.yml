name: One-shot rustfmt and cleanup

on:
  push:
    branches:
      - feat/runtime-release
    paths:
      - .github/workflows/format-and-clean.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/runtime-release
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and remove helper workflows
        shell: bash
        run: |
          cargo fmt --all
          git rm -f .github/workflows/format-once.yml .github/workflows/format-and-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply rustfmt and remove one-shot helpers"
          git push origin HEAD:feat/runtime-release
