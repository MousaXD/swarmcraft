name: Agent 3 Apply

on:
  push:
    branches: [agent/server-mod-management]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply Agent 3 changes
        run: python .agent3/apply.py
      - name: Format
        run: cargo fmt --all
      - name: Commit generated implementation
        run: |
          git config user.name "swarmcraft-agent3"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add deterministic server mod runtime profiles"
          git push
      - name: Server mod unit tests
        run: cargo test -p swarm-cli --lib --locked
      - name: Swarm CLI clippy
        run: cargo clippy -p swarm-cli --all-targets --all-features --locked -- -D warnings
