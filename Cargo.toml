[workspace]
resolver = "2"
members = [
  "crates/swarm-protocol",
  "crates/swarm-core",
  "crates/swarm-storage",
  "crates/swarm-consensus",
  "crates/swarm-network",
  "crates/swarm-ipc",
  "crates/swarm-cli",
  "crates/swarm-catalog",
]
exclude = ["apps/desktop/src-tauri", "crates/swarm-provider"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/MousaXD/swarmcraft"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
fs2 = "0.4"
hex = "0.4"
libp2p = { git = "https://github.com/libp2p/rust-libp2p", rev = "b4c6d6dcaccbae6c69bc5e579a50478911c6f157", default-features = false, features = ["autonat", "cbor", "dcutr", "dns", "identify", "kad", "macros", "mdns", "noise", "ping", "quic", "relay", "request-response", "tcp", "tokio", "yamux"] }
postcard = { version = "1.0", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "=0.12.22", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2.5"
zstd = "0.13"
tempfile = "3.12"
