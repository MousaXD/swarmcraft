plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'swarmcraft-fabric'
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Migration intentionally installs one first-party bridge JAR. Nest the exact
    // Fabric API artifact in that bridge so Fabric Loader discovers it without
    // teaching the authority/migration layer package-management semantics.
    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('../../LICENSE') {
        rename { "${it}_${project.name}" }
    }
}

// Explicitly requested isolated test artifact. Not part of build, sourcesJar,
// nested production dependencies or any release workflow.
sourceSets {
    ownerlessProbe {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('ownerlessProbeJar', Jar) {
    dependsOn tasks.named('ownerlessProbeClasses')
    archiveBaseName = 'ownerless-permission-probe-test-only'
    destinationDirectory = layout.buildDirectory.dir('ownerless-probe')
    from sourceSets.ownerlessProbe.output
}
