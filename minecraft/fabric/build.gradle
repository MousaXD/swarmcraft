plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'swarmcraft-fabric'
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Migration intentionally installs one first-party bridge JAR. Nest the exact
    // Fabric API artifact in that bridge so Fabric Loader discovers it without
    // teaching the authority/migration layer package-management semantics.
    include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('../../LICENSE') {
        rename { "${it}_${project.name}" }
    }
}

// Explicitly requested isolated test artifact. Not part of build, sourcesJar,
// nested production dependencies or any release workflow.
sourceSets {
    ownerlessProbe {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
tasks.register('ownerlessProbeJar', Jar) {
    dependsOn tasks.named('ownerlessProbeClasses')
    archiveBaseName = 'ownerless-permission-probe-test-only'
    destinationDirectory = layout.buildDirectory.dir('ownerless-probe')
    from sourceSets.ownerlessProbe.output
}

// Optional client-only artifact. Never nest it in the server bridge or
// implicitly install it in a managed server runtime.
sourceSets {
    clientReconnect {
        compileClasspath += sourceSets.main.compileClasspath
    }
    clientReconnectTest {
        compileClasspath += sourceSets.clientReconnect.output + sourceSets.clientReconnect.compileClasspath
    }
}
tasks.named('processClientReconnectResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
tasks.register('clientReconnectJar', Jar) {
    dependsOn tasks.named('clientReconnectClasses')
    archiveBaseName = 'swarmcraft-fabric-reconnect'
    destinationDirectory = layout.buildDirectory.dir('client-reconnect')
    from sourceSets.clientReconnect.output
    from('../../LICENSE') {
        rename { "${it}_swarmcraft-fabric-reconnect" }
    }
}
tasks.register('clientReconnectCheck', JavaExec) {
    dependsOn tasks.named('clientReconnectTestClasses')
    // The pure policy runner does not launch Minecraft or require Loom's
    // development launcher runtime (which is not needed to build the JAR).
    classpath = sourceSets.clientReconnectTest.output + sourceSets.clientReconnect.output +
            sourceSets.clientReconnect.compileClasspath
    mainClass = 'dev.swarmcraft.reconnect.ReconnectPolicyTest'
}

// A test-only Java entrypoint for the real native gateway process gate.
// Keep it out of the distributable client and server artifacts.
tasks.register('clientReconnectProbeJar', Jar) {
    dependsOn tasks.named('clientReconnectTestClasses')
    archiveBaseName = 'swarmcraft-reconnect-live-probe-test-only'
    destinationDirectory = layout.buildDirectory.dir('client-reconnect-test')
    from(sourceSets.clientReconnectTest.output) {
        include 'dev/swarmcraft/reconnect/LiveGatewayProbe.class'
    }
}
tasks.register('clientReconnectProbeClasspath') {
    dependsOn tasks.named('clientReconnectProbeJar'), tasks.named('clientReconnectJar')
    def output = layout.buildDirectory.file('client-reconnect-test/classpath.txt')
    outputs.file(output)
    outputs.upToDateWhen { false } // absolute paths belong to this checkout
    // Use exact resolved Gson from the existing Minecraft compile classpath.
    doLast {
        def gson = sourceSets.clientReconnect.compileClasspath.files.findAll { it.name ==~ /gson-[0-9].*\.jar/ }
        if (gson.size() != 1) throw new GradleException('Expected exactly one Minecraft Gson JAR')
        output.get().asFile.text = files(tasks.named('clientReconnectProbeJar').get().archiveFile,
                tasks.named('clientReconnectJar').get().archiveFile, gson).asPath + System.lineSeparator()
    }
}

tasks.register('runtimeChallengeCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.output + sourceSets.main.output
    mainClass = 'dev.swarmcraft.fabric.RuntimeChallengeSlotTest'
}
