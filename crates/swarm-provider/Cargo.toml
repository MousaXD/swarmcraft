[package]
name = "swarm-provider"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/MousaXD/swarmcraft"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "=0.12.22", default-features = false, features = ["blocking", "rustls-tls"] }
sha1 = "0.10"
sha2 = "0.10"
