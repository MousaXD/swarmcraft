[package]
name = "swarm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "swarmcraft"
path = "src/main.rs"

[[bin]]
name = "swarmcraft-host"
path = "src/host_main.rs"

[[bin]]
name = "swarmcraft-runtime"
path = "src/runtime_main.rs"

[[bin]]
name = "swarmcraft-import"
path = "src/import_main.rs"

[[bin]]
name = "swarmcraft-infra"
path = "src/infra_main.rs"

[dependencies]
blake3.workspace = true
anyhow.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
chacha20poly1305 = "=0.10.1"
fs2.workspace = true
hex.workspace = true
postcard.workspace = true
rand_core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tempfile.workspace = true
zeroize = "=1.9.0"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true
swarm-consensus = { path = "../swarm-consensus" }
swarm-core = { path = "../swarm-core" }
swarm-ipc = { path = "../swarm-ipc" }
swarm-network = { path = "../swarm-network" }
swarm-protocol = { path = "../swarm-protocol" }
swarm-storage = { path = "../swarm-storage" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
futures.workspace = true
libp2p.workspace = true
